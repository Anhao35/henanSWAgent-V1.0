    - data:
        code: "def main(analysis_context=\"\", domain=\"\", top_k=None):\n    text = str(analysis_context or \"\")\n\n    # 1. 规范化 domain\n    raw_domain = str(domain or \"\").strip().lower()\n\n    valid_domains = [\"enterprise\", \"ics\", \"mobile\"]\n\n    if raw_domain not in valid_domains:\n        # 如果用户没有传 domain，则根据上下文简单推断\n        lower_text = text.lower()\n\n        ics_keywords = [\n            \"ics\", \"scada\", \"plc\", \"dcs\", \"ot\", \"工业控制\", \"工控\",\n            \"泵站\", \"水电站\", \"变电站\", \"调度控制\", \"工业协议\",\n            \"modbus\", \"opc\", \"组态\", \"rtu\"\n        ]\n\n        mobile_keywords = [\n            \"mobile\", \"android\", \"ios\", \"apk\", \"app\", \"手机\",\n            \"移动端\", \"安卓\", \"苹果\", \"短信木马\"\n        ]\n\n        if any(k.lower() in lower_text for k in ics_keywords):\n            normalized_domain = \"ics\"\n        elif any(k.lower() in lower_text for k in mobile_keywords):\n            normalized_domain = \"mobile\"\n        else:\n          \
          \  normalized_domain = \"enterprise\"\n    else:\n        normalized_domain = raw_domain\n\n    # 2. 规范化 top_k\n    try:\n        normalized_top_k = int(top_k)\n    except Exception:\n        normalized_top_k = 5\n\n    if normalized_top_k <= 0:\n        normalized_top_k = 5\n\n    if normalized_top_k > 10:\n        normalized_top_k = 10\n\n    return {\n        \"analysis_context\": text,\n        \"domain\": normalized_domain,\n        \"top_k\": normalized_top_k,\n        \"top_k_str\": str(normalized_top_k)\n    }"
