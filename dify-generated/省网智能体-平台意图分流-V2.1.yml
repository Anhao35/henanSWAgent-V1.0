          \   #\n    # 不修改 Agent 已生成的原始有效路由，只补充缺失的 Hash 路由。\n    existing_route_keys\
          \ = set()\n\n    for item in filtered_route_plan:\n        item_type = normalize_ioc_type(\n\
          \            item.get(\"ioc_type\") or item.get(\"ioc_type_raw\")\n    \
          \    )\n        item_ioc = str(item.get(\"ioc\") or \"\").strip().lower()\n\
          \n        if item_type and item_ioc:\n            existing_route_keys.add((item_type,\
          \ item_ioc))\n\n    for hash_value in hash_list:\n        route_key = (\"\
          hash\", hash_value.lower())\n\n        if route_key in existing_route_keys:\n\
          \            continue\n\n        filtered_route_plan.append({\n        \
          \    \"ioc_type\": \"hash\",\n            \"ioc_type_raw\": \"hashes\",\n\
          \            \"ioc\": hash_value,\n            \"hash_type\": get_hash_type(hash_value),\n\
          \            \"route_source\": \"sys.query_regex\"\n        })\n\n     \
          \   existing_route_keys.add(route_key)\n\n    primary_ip = first_item(ip_list)\n\
          \    primary_domain = first_item(domain_list)\n    primary_url = first_item(url_list)\n\
          \    primary_cve = first_item(cve_list)\n    primary_hash = first_item(hash_list)\n\
          \n    # 抽取 ATT&CK 编号，供后续 LocalAttackMCP 使用\n    attack_ids = []\n\n    #\
          \ 从完整 Agent 输出中抽取\n    attack_ids.extend(extract_attack_ids_from_text(arg1))\n\
          \n    # 从 router_result 中抽取\n    try:\n        attack_ids.extend(\n    \
          \        extract_attack_ids_from_text(\n                json.dumps(router_result,\
          \ ensure_ascii=False)\n            )\n        )\n    except Exception:\n\
          \        pass\n\n    attack_ids = dedupe_list([x.upper() for x in attack_ids])\n\
          \n    return {\n        # 是否存在有效 IOC\n        \"has_ip\": bool(primary_ip),\n\
          \        \"has_domain\": bool(primary_domain),\n        \"has_url\": bool(primary_url),\n\
          \        \"has_cve\": bool(primary_cve),\n        \"has_hash\": bool(primary_hash),\n\
          \n        # 数量统计，全部基于过滤后的真实 IOC\n        \"ip_count\": len(ip_list),\n \
