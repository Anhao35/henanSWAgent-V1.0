        code: "\nimport json\nimport re\nfrom typing import Any\n\n\n# =========================\n\
          # 1. 通用 JSON 解析工具\n# =========================\n\ndef try_json_loads(value:\
          \ Any) -> Any:\n    if value is None:\n        return None\n\n    if isinstance(value,\
          \ (dict, list)):\n        return value\n\n    if not isinstance(value, str):\n\
          \        return value\n\n    text = value.strip()\n    if not text:\n  \
          \      return None\n\n    for prefix in [\n        \"Hash查询结果：\",\n    \
          \    \"HASH查询结果：\",\n        \"哈希查询结果：\",\n        \"文件信誉查询结果：\"\n    ]:\n\
          \        if text.startswith(prefix):\n            text = text[len(prefix):].strip()\n\
          \n    text = re.sub(r\"^```json\\s*\", \"\", text, flags=re.IGNORECASE)\n\
          \    text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\"\
          , \"\", text)\n\n    current = text\n    for _ in range(5):\n        try:\n\
          \            parsed = json.loads(current)\n            if isinstance(parsed,\
          \ str):\n                current = parsed.strip()\n                continue\n\
          \            return parsed\n        except Exception:\n            break\n\
          \n    start = text.find(\"{\")\n    end = text.rfind(\"}\")\n    if start\
          \ >= 0 and end > start:\n        try:\n            return json.loads(text[start:end\
          \ + 1])\n        except Exception:\n            return text\n\n    return\
          \ text\n\n\ndef extract_payload(raw: Any) -> Any:\n    \"\"\"\n    兼容 Dify\
          \ 常见工具输出：\n    {\"text1\": \"...\"} / {\"result\": \"...\"} / {\"text\"\
          : \"...\"}\n    {\"json\": [...]} / {\"data\": {...}}\n    \"\"\"\n    obj\
          \ = try_json_loads(raw)\n\n    if obj is None:\n        return None\n\n\
          \    if isinstance(obj, list):\n        if not obj:\n            return\
          \ None\n        if len(obj) == 1:\n            return extract_payload(obj[0])\n\
          \        return [extract_payload(x) for x in obj]\n\n    if isinstance(obj,\
          \ dict):\n        for key in [\"text1\", \"result\", \"result2\", \"answer\"\
          , \"text\", \"json\"]:\n            if key in obj and obj.get(key) not in\
          \ [None, \"\", []]:\n                return extract_payload(obj.get(key))\n\
          \n        if \"data\" in obj and obj.get(\"data\") not in [None, \"\", []]:\n\
          \            return extract_payload(obj.get(\"data\"))\n\n        return\
          \ obj\n\n    return obj\n\n\ndef as_float(value: Any, default: float = 0.0)\
          \ -> float:\n    try:\n        return float(value)\n    except Exception:\n\
          \        return default\n\n\ndef as_int(value: Any, default: int = 0) ->\
          \ int:\n    try:\n        return int(float(value))\n    except Exception:\n\
          \        return default\n\n\ndef dedupe_list(items: list) -> list:\n   \
          \ result = []\n    seen = set()\n\n    for item in items:\n        if item\
          \ in [None, \"\"]:\n            continue\n\n        key = (\n          \
          \  json.dumps(item, ensure_ascii=False, sort_keys=True)\n            if\
          \ isinstance(item, (dict, list))\n            else str(item)\n        )\n\
          \n        if key not in seen:\n            seen.add(key)\n            result.append(item)\n\
          \n    return result\n\n\ndef normalize_key(value: Any) -> str:\n    return\
          \ re.sub(r\"[\\s_\\-]+\", \"\", str(value or \"\").strip().lower())\n\n\n\
          def find_first_value(obj: Any, aliases: list) -> Any:\n    \"\"\"\n    递归查找第一个匹配字段，兼容中英文键名和嵌套对象。\n\
          \    \"\"\"\n    alias_set = {normalize_key(x) for x in aliases}\n\n   \
          \ if isinstance(obj, dict):\n        for key, value in obj.items():\n  \
          \          if normalize_key(key) in alias_set and value not in [None, \"\
          \", []]:\n                return value\n\n        for value in obj.values():\n\
          \            found = find_first_value(value, aliases)\n            if found\
          \ not in [None, \"\", []]:\n                return found\n\n    elif isinstance(obj,\
          \ list):\n        for item in obj:\n            found = find_first_value(item,\
          \ aliases)\n            if found not in [None, \"\", []]:\n            \
          \    return found\n\n    return None\n\n\ndef normalize_hash(value: Any)\
          \ -> str:\n    text = str(value or \"\").strip().lower()\n\n    match =\
          \ re.search(\n        r\"(?<![a-f0-9])\"\n        r\"([a-f0-9]{128}|[a-f0-9]{64}|[a-f0-9]{40}|[a-f0-9]{32})\"\
          \n        r\"(?![a-f0-9])\",\n        text,\n        flags=re.IGNORECASE\n\
          \    )\n\n    return match.group(1).lower() if match else text\n\n\ndef\
          \ get_hash_type(value: Any) -> str:\n    text = normalize_hash(value)\n\n\
          \    if not re.fullmatch(r\"[a-f0-9]+\", text):\n        return \"\"\n\n\
          \    return {\n        32: \"MD5\",\n        40: \"SHA1\",\n        64:\
          \ \"SHA256\",\n        128: \"SHA512\"\n    }.get(len(text), \"\")\n\n\n\
          # =========================\n# 2. 风险等级映射\n# =========================\n\n\
          def rank_to_level(rank: int) -> str:\n    if rank >= 5:\n        return\
          \ \"严重风险\"\n    if rank == 4:\n        return \"高风险\"\n    if rank == 3:\n\
          \        return \"中风险\"\n    if rank == 2:\n        return \"低风险\"\n   \
