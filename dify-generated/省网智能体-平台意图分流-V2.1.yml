          \        \"filename\": filename,\n        \"mime\": mime,\n        \"ext\"\
          : ext,\n        \"file_kind\": file_kind,\n        \"route_group\": route_group,\n\
          \    }\n\n\ndef main(files: Any = None) -> dict:\n    file_list = to_obj(files)\n\
          \n    if not isinstance(file_list, list):\n        file_list = [file_list]\
          \ if file_list else []\n\n    inventory = [classify_file(f) for f in file_list]\n\
          \n    image_count = sum(1 for x in inventory if x[\"route_group\"] == \"\
          image\")\n    document_count = sum(1 for x in inventory if x[\"route_group\"\
          ] == \"document\")\n    unsupported_count = sum(1 for x in inventory if\
