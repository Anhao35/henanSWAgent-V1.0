        code: "def main(\n    user_query=\"\",\n    multimodal_context_text=\"\",\n\
          \    router_summary=\"\",\n    route_plan_json=\"\",\n    primary_ip=\"\"\
          ,\n    primary_domain=\"\",\n    primary_url=\"\",\n    primary_cve=\"\"\
          ,\n    attack_ids=\"\",\n    has_attack_id=False,\n    attack_id_count=0\n\
          ):\n    parts = []\n\n    if user_query:\n        parts.append(\"【用户原始输入】\\\
          n\" + str(user_query))\n\n    if multimodal_context_text:\n        parts.append(\"\
          【多模态文件解析上下文】\\n\" + str(multimodal_context_text))\n\n    if router_summary:\n\
          \        parts.append(\"【IOC Router 识别摘要】\\n\" + str(router_summary))\n\n\
          \    ioc_lines = []\n\n    if primary_ip:\n        ioc_lines.append(f\"\
          - IP：{primary_ip}\")\n\n    if primary_domain:\n        ioc_lines.append(f\"\
          - 域名：{primary_domain}\")\n\n    if primary_url:\n        ioc_lines.append(f\"\
          - URL：{primary_url}\")\n\n    if primary_cve:\n        ioc_lines.append(f\"\
          - CVE：{primary_cve}\")\n\n    if ioc_lines:\n        parts.append(\"【主要\
          \ IOC 对象】\\n\" + \"\\n\".join(ioc_lines))\n\n    if attack_ids:\n      \
          \  parts.append(\"【用户输入中显式出现的 ATT&CK 编号】\\n\" + str(attack_ids))\n\n   \
          \ if route_plan_json:\n        parts.append(\"【Security IOC Router 路由计划】\\\
          n\" + str(route_plan_json))\n\n    parts.append(\n        \"【ATT&CK 知识增强任务】\\\
          n\"\n        \"请根据以上安全上下文识别可能涉及的攻击行为、攻击阶段和 MITRE ATT&CK 技术。\"\n        \"\
          如果输入中已经包含 Txxxx 编号，应优先对这些编号进行精确查询。\"\n        \"如果输入中没有 Txxxx 编号，也应根据攻击行为语义进行映射。\"\
          \n        \"不得编造未查询到的 ATT&CK 技术编号。\"\n    )\n\n    return {\n        \"\
          analysis_context\": \"\\n\\n\".join(parts),\n        \"domain\": \"enterprise\"\
          ,\n        \"top_k\": 5\n    }"
