    - data:
        code: "import json\nimport re\nfrom typing import Any\n\n\n# =========================\n\
          # 1. 通用 JSON 解析工具\n# =========================\n\ndef try_json_loads(value:\
          \ Any) -> Any:\n    \"\"\"\n    尽量把 Dify 工具输出解析为 Python 对象。\n    兼容：\n \
          \   - dict/list\n    - JSON 字符串\n    - 外层 {\"result\": \"...\"} / {\"text\"\
          : \"...\"} / {\"json\": [...]}\n    - Markdown ```json 包裹\n    \"\"\"\n\
          \    if value is None:\n        return None\n\n    if isinstance(value,\
          \ (dict, list)):\n        return value\n\n    if not isinstance(value, str):\n\
          \        return value\n\n    text = value.strip()\n    if not text:\n  \
          \      return None\n\n    # 去掉可能的说明性前缀\n    for prefix in [\"VT查询结果：\",\
          \ \"微步查询结果：\", \"安恒查询结果：\"]:\n        if text.startswith(prefix):\n    \
          \        text = text[len(prefix):].strip()\n\n    # 去掉 Markdown 代码块\n  \
          \  text = re.sub(r\"^```json\\s*\", \"\", text, flags=re.IGNORECASE)\n \
          \   text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\"\
          , \"\", text)\n\n    # 多层 JSON 字符串递归解析\n    current = text\n    for _ in\
          \ range(4):\n        try:\n            parsed = json.loads(current)\n  \
          \          if isinstance(parsed, str):\n                current = parsed.strip()\n\
          \                continue\n            return parsed\n        except Exception:\n\
          \            break\n\n    # 尝试截取第一个 { 到最后一个 }\n    start = text.find(\"\
          {\")\n    end = text.rfind(\"}\")\n    if start >= 0 and end > start:\n\
          \        candidate = text[start:end + 1]\n        try:\n            return\
          \ json.loads(candidate)\n        except Exception:\n            return text\n\
          \n    return text\n\n\ndef extract_payload(raw: Any) -> Any:\n    \"\"\"\
          \n    从工具输出中提取真正有效的业务数据。\n    兼容：\n    - {\"result\": \"...\"}\n    - {\"\
          text\": \"...\"}\n    - {\"json\": [{\"result\": \"...\"}]}\n    - {\"data\"\
          : {...}}\n    - {\"answer\": \"...\"}\n    \"\"\"\n    obj = try_json_loads(raw)\n\
          \n    if obj is None:\n        return None\n\n    if isinstance(obj, list):\n\
          \        if len(obj) == 0:\n            return None\n        if len(obj)\
          \ == 1:\n            return extract_payload(obj[0])\n        return [extract_payload(x)\
          \ for x in obj]\n\n    if isinstance(obj, dict):\n        # Dify MCP/工具常见结构\n\
          \        for key in [\"result\", \"text1\", \"answer\", \"text\", \"json\"\
          , \"data\"]:\n            if key in obj and obj.get(key) not in [None, \"\
          \", []]:\n                return extract_payload(obj.get(key))\n\n     \
          \   return obj\n\n    return obj\n\n\ndef as_int(value: Any, default: int\
          \ = 0) -> int:\n    try:\n        if value is None or value == \"\":\n \
          \           return default\n        return int(float(value))\n    except\
          \ Exception:\n        return default\n\n\ndef safe_get(d: Any, path: list,\
          \ default=None):\n    cur = d\n    for key in path:\n        if not isinstance(cur,\
          \ dict):\n            return default\n        cur = cur.get(key)\n     \
          \   if cur is None:\n            return default\n    return cur\n\n\ndef\
          \ dedupe_list(items: list) -> list:\n    result = []\n    seen = set()\n\
          \    for item in items:\n        key = json.dumps(item, ensure_ascii=False,\
          \ sort_keys=True) if isinstance(item, (dict, list)) else str(item)\n   \
          \     if key not in seen:\n            seen.add(key)\n            result.append(item)\n\
          \    return result\n\n\n# =========================\n# 2. 风险等级映射\n# =========================\n\
          \ndef rank_to_level(rank: int) -> str:\n    if rank >= 5:\n        return\
          \ \"严重风险\"\n    if rank == 4:\n        return \"高风险\"\n    if rank == 3:\n\
          \        return \"中风险\"\n    if rank == 2:\n        return \"低风险\"\n   \
          \ if rank == 1:\n        return \"无明显风险\"\n    return \"未知\"\n\n\ndef level_to_rank(level:\
          \ Any) -> int:\n    if level is None:\n        return 0\n\n    text = str(level).lower()\n\
          \n    if text in [\"4\", \"5\"] or any(k in text for k in [\"严重\", \"critical\"\
          , \"高危\", \"high\", \"木马\", \"勒索\", \"后门\"]):\n        return 4\n    if\
          \ text in [\"3\"] or any(k in text for k in [\"中危\", \"medium\", \"可疑\"\
          ]):\n        return 3\n    if text in [\"1\", \"2\"] or any(k in text for\
          \ k in [\"低危\", \"low\", \"pua\", \"不受欢迎\"]):\n        return 2\n    if\
          \ text in [\"0\", \"-1\"] or any(k in text for k in [\"无威胁\", \"白名单\", \"\
          正常\", \"安全\", \"info\"]):\n        return 1\n\n    return 0\n\n\n# =========================\n\
          # 3. VT IP 标准化\n# =========================\n\ndef normalize_vt_ip(primary_ip:\
          \ str, raw: Any) -> dict:\n    data = extract_payload(raw)\n\n    evidence\
          \ = {\n        \"source\": \"VirusTotal\",\n        \"tool_name\": \"queryVtIP\"\
          ,\n        \"ioc_type\": \"ip\",\n        \"ioc\": primary_ip,\n       \
          \ \"query_success\": bool(data),\n        \"subject_risk_level\": \"未知\"\
          ,\n        \"subject_risk_rank\": 0,\n        \"context_risk_level\": \"\
          未知\",\n        \"context_risk_rank\": 0,\n        \"confidence\": \"medium\"\
          ,\n        \"summary\": \"未获取到 VT IP 有效结果。\",\n        \"key_findings\"\
          : [],\n        \"source_specific\": {},\n        \"raw_compact\": {}\n \
          \   }\n\n    if not isinstance(data, dict):\n        evidence[\"raw_compact\"\
          ] = {\"raw\": str(data)[:1000] if data else \"\"}\n        return evidence\n\
          \n    stats = data.get(\"分析统计\") or {}\n    malicious = as_int(stats.get(\"\
          恶意\"))\n    suspicious = as_int(stats.get(\"可疑\"))\n    harmless = as_int(stats.get(\"\
          无害\"))\n    undetected = as_int(stats.get(\"未检出\"))\n    timeout = as_int(stats.get(\"\
          超时\"))\n\n    votes = data.get(\"社区投票\") or {}\n    harmless_votes = as_int(votes.get(\"\
          无害票数\"))\n    malicious_votes = as_int(votes.get(\"恶意票数\"))\n\n    crowdsourced\
          \ = data.get(\"众包情报上下文\") or []\n    risk_hits = data.get(\"风险命中详情\") or\
          \ []\n\n    if malicious > 0:\n        subject_rank = 4\n        summary\
          \ = f\"VT 多引擎检测发现 {malicious} 个恶意命中。\"\n    elif suspicious > 0:\n     \
          \   subject_rank = 3\n        summary = f\"VT 多引擎检测发现 {suspicious} 个可疑命中。\"\
          \n    else:\n        subject_rank = 1\n        summary = \"VT 多引擎检测未发现恶意或可疑命中。\"\
          \n\n    context_rank = 0\n    context_findings = []\n\n    if malicious_votes\
          \ > 0:\n        context_rank = max(context_rank, 2)\n        context_findings.append(f\"\
          社区投票存在恶意票数：{malicious_votes}\")\n\n    if isinstance(crowdsourced, list)\
          \ and len(crowdsourced) > 0:\n        context_rank = max(context_rank, 3)\n\
          \        first_ctx = crowdsourced[0]\n        if isinstance(first_ctx, dict):\n\
          \            detail = first_ctx.get(\"详细说明\") or first_ctx.get(\"标题\") or\
          \ \"\"\n            context_findings.append(f\"存在众包情报上下文：{detail[:120]}\"\
          )\n\n    if isinstance(risk_hits, list) and len(risk_hits) > 0:\n      \
          \  context_rank = max(context_rank, 3)\n        context_findings.append(f\"\
          存在风险命中详情 {len(risk_hits)} 条。\")\n\n    evidence.update({\n        \"subject_risk_level\"\
          : rank_to_level(subject_rank),\n        \"subject_risk_rank\": subject_rank,\n\
          \        \"context_risk_level\": rank_to_level(context_rank),\n        \"\
          context_risk_rank\": context_rank,\n        \"summary\": summary,\n    \
          \    \"key_findings\": dedupe_list([\n            f\"恶意检测数：{malicious}\"\
          ,\n            f\"可疑检测数：{suspicious}\",\n            f\"无害检测数：{harmless}\"\
          ,\n            f\"未检出数：{undetected}\",\n            f\"归属机构：{data.get('归属机构',\
          \ '')}\",\n            f\"ASN：{data.get('ASN', '')}\",\n            *context_findings\n\
          \        ]),\n        \"source_specific\": {\n            \"vt_link\": data.get(\"\
          VT查询链接\"),\n            \"reputation\": data.get(\"信誉分\"),\n           \
          \ \"owner\": data.get(\"归属机构\"),\n            \"network\": data.get(\"所属网段\"\
          ),\n            \"country\": data.get(\"国家\"),\n            \"asn\": data.get(\"\
          ASN\"),\n            \"rir\": data.get(\"区域注册机构\"),\n            \"last_analysis_time\"\
          : data.get(\"最近分析时间\"),\n            \"last_modification_time\": data.get(\"\
          最近修改时间\"),\n            \"analysis_stats\": {\n                \"malicious\"\
          : malicious,\n                \"suspicious\": suspicious,\n            \
          \    \"harmless\": harmless,\n                \"undetected\": undetected,\n\
          \                \"timeout\": timeout\n            },\n            \"community_votes\"\
          : {\n                \"harmless\": harmless_votes,\n                \"malicious\"\
          : malicious_votes\n            },\n            \"crowdsourced_context\"\
          : crowdsourced[:3] if isinstance(crowdsourced, list) else [],\n        \
          \    \"whois_summary\": data.get(\"Whois摘要\") or {},\n            \"certificate_summary\"\
          : data.get(\"证书摘要\") or {},\n            \"risk_hits\": risk_hits[:5] if\
          \ isinstance(risk_hits, list) else []\n        },\n        \"raw_compact\"\
          : {\n            \"ip\": data.get(\"IP地址\"),\n            \"object_type\"\
          : data.get(\"对象类型\"),\n            \"analysis_stats\": stats,\n        \
          \    \"risk_hits_count\": len(risk_hits) if isinstance(risk_hits, list)\
          \ else 0\n        }\n    })\n\n    return evidence\n\n\n# =========================\n\
          # 4. 微步 IP 标准化\n# =========================\n\ndef normalize_threatbook_ip(primary_ip:\
          \ str, raw: Any) -> dict:\n    data = extract_payload(raw)\n\n    # 针对微步结果字符串异常时的兜底解析\n\
          \    if not isinstance(data, dict) and isinstance(raw, str):\n        text\
          \ = raw\n        data = {\n            \"ip\": re_search(text, r'\"ip\"\\\
          s*:\\s*\"([^\"]+)\"'),\n            \"query_success\": \"query_success\"\
          \ in text and \"true\" in text.lower(),\n            \"severity\": re_search(text,\
          \ r'\"severity\"\\s*:\\s*\"([^\"]+)\"'),\n            \"is_malicious\":\
          \ False if '\"is_malicious\": false' in text.lower() else None,\n      \
          \      \"confidence_level\": re_search(text, r'\"confidence_level\"\\s*:\\\
          s*\"([^\"]+)\"'),\n            \"country\": re_search(text, r'\"country\"\
          \\s*:\\s*\"([^\"]+)\"'),\n            \"carrier\": re_search(text, r'\"\
          carrier\"\\s*:\\s*\"([^\"]+)\"'),\n            \"asn_info\": re_search(text,\
          \ r'\"asn_info\"\\s*:\\s*\"([^\"]+)\"'),\n            \"asn_number\": as_int(re_search(text,\
          \ r'\"asn_number\"\\s*:\\s*(\\d+)')),\n            \"scene\": re_search(text,\
          \ r'\"scene\"\\s*:\\s*\"([^\"]+)\"'),\n            \"update_time\": re_search(text,\
          \ r'\"update_time\"\\s*:\\s*\"([^\"]+)\"'),\n        }\n\n    evidence =\
          \ {\n        \"source\": \"ThreatBook\",\n        \"tool_name\": \"queryThreatBookIP\"\
          ,\n        \"ioc_type\": \"ip\",\n        \"ioc\": primary_ip,\n       \
          \ \"query_success\": bool(data),\n        \"subject_risk_level\": \"未知\"\
          ,\n        \"subject_risk_rank\": 0,\n        \"context_risk_level\": \"\
          未知\",\n        \"context_risk_rank\": 0,\n        \"confidence\": \"medium\"\
          ,\n        \"summary\": \"未获取到微步 IP 有效结果。\",\n        \"key_findings\":\
          \ [],\n        \"source_specific\": {},\n        \"raw_compact\": {}\n \
          \   }\n\n    if not isinstance(data, dict):\n        evidence[\"raw_compact\"\
          ] = {\"raw\": str(data)[:1000] if data else \"\"}\n        return evidence\n\
          \n    severity = data.get(\"severity\") or \"\"\n    is_malicious = data.get(\"\
          is_malicious\")\n    confidence_level = data.get(\"confidence_level\") or\
          \ \"\"\n    judgments = data.get(\"judgments\") or []\n    tags_classes\
          \ = data.get(\"tags_classes\") or []\n\n    if is_malicious is True:\n \
          \       rank = 4\n        summary = \"微步判定该 IP 具有恶意属性。\"\n    elif \"无威胁\"\
          \ in str(severity) or is_malicious is False:\n        rank = 1\n       \
          \ summary = \"微步判定该 IP 为无威胁。\"\n    else:\n        rank = level_to_rank(severity)\n\
          \        summary = f\"微步返回风险等级：{severity or '未知'}。\"\n\n    evidence.update({\n\
          \        \"subject_risk_level\": rank_to_level(rank),\n        \"subject_risk_rank\"\
          : rank,\n        \"context_risk_level\": \"未知\",\n        \"context_risk_rank\"\
          : 0,\n        \"confidence\": str(confidence_level) if confidence_level\
          \ else \"medium\",\n        \"summary\": summary,\n        \"key_findings\"\
          : dedupe_list([\n            f\"severity：{severity}\",\n            f\"\
          is_malicious：{is_malicious}\",\n            f\"置信度：{confidence_level}\"\
          ,\n            f\"判定标签：{'、'.join(map(str, judgments))}\" if judgments else\
          \ \"\",\n            f\"场景：{data.get('scene', '')}\",\n            f\"ASN：{data.get('asn_number',\
          \ '')} / {data.get('asn_info', '')}\",\n            f\"运营商/归属：{data.get('carrier',\
          \ '')}\"\n        ]),\n        \"source_specific\": {\n            \"response_code\"\
          : data.get(\"response_code\"),\n            \"verbose_msg\": data.get(\"\
          verbose_msg\"),\n            \"severity\": severity,\n            \"is_malicious\"\
          : is_malicious,\n            \"confidence_level\": confidence_level,\n \
          \           \"judgments\": judgments,\n            \"tags_classes\": tags_classes,\n\
          \            \"geo\": {\n                \"country\": data.get(\"country\"\
          ),\n                \"province\": data.get(\"province\"),\n            \
          \    \"city\": data.get(\"city\")\n            },\n            \"carrier\"\
          : data.get(\"carrier\"),\n            \"asn_info\": data.get(\"asn_info\"\
          ),\n            \"asn_number\": data.get(\"asn_number\"),\n            \"\
          scene\": data.get(\"scene\"),\n            \"update_time\": data.get(\"\
          update_time\"),\n            \"permalink\": data.get(\"permalink\")\n  \
          \      },\n        \"raw_compact\": {\n            \"ip\": data.get(\"ip\"\
          ),\n            \"severity\": severity,\n            \"is_malicious\": is_malicious,\n\
          \            \"confidence_level\": confidence_level,\n            \"judgments\"\
          : judgments\n        }\n    })\n\n    return evidence\n\n\ndef re_search(text:\
          \ str, pattern: str, default: str = \"\") -> str:\n    try:\n        m =\
          \ re.search(pattern, text)\n        return m.group(1) if m else default\n\
          \    except Exception:\n        return default\n\n\n# =========================\n\
          # 5. 安恒 IP 标准化\n# =========================\n\ndef collect_file_risk(files:\
          \ list) -> dict:\n    \"\"\"\n    汇总安恒关联文件风险。\n    注意：这是上下文扩展风险，不直接等同于主体\
          \ IP 风险。\n    \"\"\"\n    if not isinstance(files, list):\n        files\
          \ = []\n\n    max_level = 0\n    categories = []\n    families = []\n  \
          \  high_risk_files = []\n\n    for item in files:\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        threat = safe_get(item, [\"basic_info\"\
          , \"threat_intel\"], {}) or {}\n        category = threat.get(\"category\"\
          ) or {}\n        level = as_int(threat.get(\"level\") if threat.get(\"level\"\
          ) is not None else category.get(\"level\"))\n\n        max_level = max(max_level,\
          \ level)\n\n        cat_name = category.get(\"name\") or category.get(\"\
          code\")\n        if cat_name:\n            categories.append(cat_name)\n\
          \n        related_families = threat.get(\"related_families\") or []\n  \
          \      if isinstance(related_families, list):\n            for fam in related_families:\n\
          \                if isinstance(fam, dict) and fam.get(\"name\"):\n     \
          \               families.append(fam.get(\"name\"))\n\n        if level >=\
          \ 4:\n            high_risk_files.append({\n                \"file_sha256\"\
          : threat.get(\"file_sha256\") or safe_get(item, [\"basic_info\", \"file_sha256\"\
          ]),\n                \"file_type\": threat.get(\"file_type\") or safe_get(item,\
          \ [\"basic_info\", \"file_type\"]),\n                \"category\": cat_name,\n\
          \                \"level\": level,\n                \"families\": related_families[:3]\
          \ if isinstance(related_families, list) else []\n            })\n\n    return\
          \ {\n        \"count\": len(files),\n        \"max_level\": max_level,\n\
          \        \"categories\": dedupe_list(categories),\n        \"families\"\
          : dedupe_list(families),\n        \"high_risk_files\": high_risk_files[:5]\n\
          \    }\n\n\ndef normalize_anheng_ip(primary_ip: str, raw: Any) -> dict:\n\
          \    data = extract_payload(raw)\n\n    evidence = {\n        \"source\"\
          : \"DBAPPSecurity\",\n        \"tool_name\": \"anheng_ip_mcp\",\n      \
          \  \"ioc_type\": \"ip\",\n        \"ioc\": primary_ip,\n        \"query_success\"\
          : bool(data),\n        \"subject_risk_level\": \"未知\",\n        \"subject_risk_rank\"\
          : 0,\n        \"context_risk_level\": \"未知\",\n        \"context_risk_rank\"\
          : 0,\n        \"confidence\": \"medium\",\n        \"summary\": \"未获取到安恒\
          \ IP 有效结果。\",\n        \"key_findings\": [],\n        \"source_specific\"\
          : {},\n        \"raw_compact\": {}\n    }\n\n    if not isinstance(data,\
          \ dict):\n        evidence[\"raw_compact\"] = {\"raw\": str(data)[:1000]\
          \ if data else \"\"}\n        return evidence\n\n    # 安恒 MCP 常见结构：{\"ip\"\
          : \"...\", \"data\": {...}}\n    root = data.get(\"data\") if isinstance(data.get(\"\
          data\"), dict) else data\n\n    geolocation = safe_get(root, [\"basic_info\"\
          , \"geolocation\"], {}) or {}\n    main_intel = safe_get(root, [\"basic_info\"\
          , \"threat_intel\"], {}) or {}\n    outbound = root.get(\"outbound_threat_intel\"\
          ) or {}\n    inbound = root.get(\"inbound_threat_intel\") or {}\n\n    main_level\
          \ = as_int(main_intel.get(\"level\"))\n    outbound_level = as_int(outbound.get(\"\
          level\"))\n    inbound_level = as_int(inbound.get(\"level\"))\n\n    subject_rank\
          \ = max(\n        level_to_rank(main_level),\n        level_to_rank(outbound_level),\n\
          \        level_to_rank(inbound_level)\n    )\n\n    # level=0 / 白名单 / 安全地址，统一视为无明显风险\n\
          \    categories = main_intel.get(\"threat_category\") or []\n    category_names\
          \ = []\n    if isinstance(categories, list):\n        category_names = [x.get(\"\
          name\") for x in categories if isinstance(x, dict) and x.get(\"name\")]\n\
          \n    tags = main_intel.get(\"tags\") or []\n    is_apt = main_intel.get(\"\
          is_apt\")\n\n    if subject_rank <= 1:\n        summary = \"安恒主情报判定该 IP\
          \ 为白名单/正常/安全类地址。\"\n        subject_rank = 1\n    elif subject_rank >= 4:\n\
          \        summary = \"安恒主情报判定该 IP 存在高风险。\"\n    else:\n        summary =\
          \ \"安恒主情报提示该 IP 存在一定风险。\"\n\n    communication_files = root.get(\"related_communication_files\"\
          ) or []\n    static_files = root.get(\"related_static_files\") or []\n\n\
          \    comm_summary = collect_file_risk(communication_files)\n    static_summary\
          \ = collect_file_risk(static_files)\n\n    context_rank_raw = max(comm_summary.get(\"\
          max_level\", 0), static_summary.get(\"max_level\", 0))\n    context_rank\
          \ = level_to_rank(context_rank_raw)\n\n    context_findings = []\n    if\
          \ comm_summary[\"count\"] > 0:\n        context_findings.append(f\"关联通信文件数量：{comm_summary['count']}，最高\
