          \        # 对应 MCP 的 text\n        \"text\": warning,\n\n        # 对应 MCP\
          \ 的 json，必须是 Array[Object]\n        \"json\": [],\n\n        # 明确区分工具失败，而不是\
          \ success 或 no_mapping\n        \"status\": \"tool_failed_fallback\",\n\n\
          \        # 工具失败时无法确认是否真的需要映射。\n        # 这里设为 False，表示当前没有可供下游使用的有效映射结果。\n\
          \        \"need_attack_mapping\": False,\n\n        # 没有可靠映射结果\n       \
