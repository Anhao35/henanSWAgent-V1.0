    - data:
        code: "import json\nimport re\nfrom typing import Any, Dict, List\n\n\n# ============================================================\n\
          # 1. 通用工具函数\n# ============================================================\n\
          \ndef is_empty(value: Any) -> bool:\n    \"\"\"\n    判断一个输入是否为空。\n\n   \
          \ 注意：\n    不使用 value in [None, \"\", [], {}]，避免某些复杂对象比较时出现异常。\n    \"\"\"\
          \n    return (\n        value is None\n        or value == \"\"\n      \
          \  or value == []\n        or value == {}\n    )\n\n\ndef try_json_loads(value:\
          \ Any) -> Any:\n    \"\"\"\n    尽可能将 Dify 传入的数据解析为 Python 对象。\n\n    支持：\n\
          \    1. dict / list 原生对象；\n    2. 标准 JSON 字符串；\n    3. 被重复 JSON 编码的字符串；\n\
          \    4. Markdown 代码块包裹的 JSON；\n    5. 前后带少量说明文字、内部包含 JSON 的字符串。\n    \"\"\
          \"\n    if value is None:\n        return None\n\n    if isinstance(value,\
          \ (dict, list)):\n        return value\n\n    if not isinstance(value, str):\n\
          \        return value\n\n    text = value.strip()\n\n    if not text:\n\
          \        return None\n\n    # 去掉 Markdown 代码块\n    text = re.sub(\n    \
          \    r\"^```(?:json)?\\s*\",\n        \"\",\n        text,\n        flags=re.IGNORECASE\n\
          \    )\n    text = re.sub(r\"\\s*```$\", \"\", text)\n\n    # 最多尝试 5 次，处理重复\
          \ JSON 编码\n    current = text\n\n    for _ in range(5):\n        try:\n\
          \            parsed = json.loads(current)\n\n            if isinstance(parsed,\
          \ str):\n                current = parsed.strip()\n                continue\n\
          \n            return parsed\n        except Exception:\n            break\n\
          \n    # 尝试截取 JSON 对象\n    object_start = text.find(\"{\")\n    object_end\
          \ = text.rfind(\"}\")\n\n    if object_start >= 0 and object_end > object_start:\n\
          \        candidate = text[object_start:object_end + 1]\n\n        try:\n\
          \            return json.loads(candidate)\n        except Exception:\n \
          \           pass\n\n    # 尝试截取 JSON 数组\n    array_start = text.find(\"[\"\
          )\n    array_end = text.rfind(\"]\")\n\n    if array_start >= 0 and array_end\
          \ > array_start:\n        candidate = text[array_start:array_end + 1]\n\n\
          \        try:\n            return json.loads(candidate)\n        except\
          \ Exception:\n            pass\n\n    return text\n\n\ndef as_int(value:\
          \ Any, default: int = 0) -> int:\n    \"\"\"\n    尽量把值转换成整数。\n    \"\"\"\
          \n    try:\n        if value is None or value == \"\":\n            return\
          \ default\n\n        return int(float(value))\n    except Exception:\n \
          \       return default\n\n\ndef dedupe_list(items: List[Any]) -> List[Any]:\n\
          \    \"\"\"\n    对列表去重，同时保持原顺序。\n\n    dict / list 通过稳定 JSON 字符串去重；\n  \
          \  其他类型使用字符串去重。\n    \"\"\"\n    if not isinstance(items, list):\n     \
          \   return []\n\n    result: List[Any] = []\n    seen = set()\n\n    for\
          \ item in items:\n        if item is None or item == \"\":\n           \
          \ continue\n\n        if isinstance(item, (dict, list)):\n            try:\n\
          \                key = json.dumps(\n                    item,\n        \
          \            ensure_ascii=False,\n                    sort_keys=True\n \
          \               )\n            except Exception:\n                key =\
          \ str(item)\n        else:\n            key = str(item)\n\n        if key\
          \ in seen:\n            continue\n\n        seen.add(key)\n        result.append(item)\n\
          \n    return result\n\n\ndef truncate_text(text: Any, max_len: int = 4000)\
          \ -> str:\n    \"\"\"\n    截断过长文本，避免知识库检索或最终 LLM 上下文过长。\n    \"\"\"\n  \
          \  value = str(text or \"\")\n\n    if len(value) <= max_len:\n        return\
          \ value\n\n    return value[:max_len] + \"\\n……【内容过长，已截断】\"\n\n\ndef rank_to_level(rank:\
          \ int) -> str:\n    \"\"\"\n    风险分值到风险等级的统一映射。\n    \"\"\"\n    if rank\
          \ >= 5:\n        return \"严重风险\"\n\n    if rank == 4:\n        return \"\
          高风险\"\n\n    if rank == 3:\n        return \"中风险\"\n\n    if rank == 2:\n\
          \        return \"低风险\"\n\n    if rank == 1:\n        return \"无明显风险\"\n\
          \n    return \"未知\"\n\n\ndef normalize_ioc_type(value: Any) -> str:\n  \
          \  \"\"\"\n    统一 IOC 类型名称。\n    \"\"\"\n    text = str(value or \"\").strip().lower()\n\
          \n    aliases = {\n        \"ip_address\": \"ip\",\n        \"ipv4\": \"\
          ip\",\n        \"ipv6\": \"ip\",\n        \"domain_name\": \"domain\",\n\
          \        \"hostname\": \"domain\",\n        \"uri\": \"url\",\n        \"\
          file_hash\": \"hash\",\n        \"md5\": \"hash\",\n        \"sha1\": \"\
          hash\",\n        \"sha256\": \"hash\",\n        \"sha512\": \"hash\",\n\
          \        \"vulnerability\": \"cve\"\n    }\n\n    return aliases.get(text,\
          \ text)\n\n\n# ============================================================\n\
          # 2. 证据包解析\n# ============================================================\n\
          \ndef is_evidence_bundle(obj: Any) -> bool:\n    \"\"\"\n    判断对象是否为标准化\
          \ evidence bundle。\n\n    正常标准：\n    - 是 dict；\n    - 至少存在 bundle_type；\n\
          \    - 并且存在 fusion_result 或 evidence_items。\n    \"\"\"\n    if not isinstance(obj,\
          \ dict):\n        return False\n\n    if not obj.get(\"bundle_type\"):\n\
          \        return False\n\n    return (\n        isinstance(obj.get(\"fusion_result\"\
          ), dict)\n        or isinstance(obj.get(\"evidence_items\"), list)\n   \
          \ )\n\n\ndef parse_bundle_collection(raw: Any) -> List[Dict[str, Any]]:\n\
          \    \"\"\"\n    将一个迭代节点输出统一解析为标准 evidence bundle 列表。\n\n    当前代码节点只接收五个\
          \ Array[String]：\n    - ip_evidence_bundles\n    - domain_evidence_bundles\n\
          \    - url_evidence_bundles\n    - hash_evidence_bundles\n    - cve_evidence_bundles\n\
          \n    但数组中的单个元素可能是：\n    1. 标准 evidence bundle JSON 字符串；\n    2. 标准 evidence\
          \ bundle 字典；\n    3. 被 output/result/text/json/data 包装的对象；\n    4. 被重复 JSON\
          \ 编码的字符串；\n    5. 某个元素内部再次包含数组。\n    \"\"\"\n    if is_empty(raw):\n   \
          \     return []\n\n    # Dify 迭代节点通常直接输出 list\n    if isinstance(raw, list):\n\
          \        bundles: List[Dict[str, Any]] = []\n\n        for item in raw:\n\
          \            bundles.extend(parse_bundle_collection(item))\n\n        return\
          \ dedupe_list(bundles)\n\n    obj = try_json_loads(raw)\n\n    if is_empty(obj):\n\
          \        return []\n\n    # JSON 字符串解析后可能得到 list\n    if isinstance(obj,\
          \ list):\n        bundles: List[Dict[str, Any]] = []\n\n        for item\
          \ in obj:\n            bundles.extend(parse_bundle_collection(item))\n\n\
          \        return dedupe_list(bundles)\n\n    if isinstance(obj, dict):\n\
          \        # 当前对象本身就是标准证据包\n        if is_evidence_bundle(obj):\n        \
          \    return [obj]\n\n        # 兼容迭代输出或工作流工具常见包装层\n        wrapper_keys =\
          \ [\n            \"output\",\n            \"outputs\",\n            \"result\"\
          ,\n            \"results\",\n            \"answer\",\n            \"text\"\
          ,\n            \"json\",\n            \"data\",\n            \"items\",\n\
          \            \"evidence_bundle_json\",\n            \"evidence_bundles\"\
          \n        ]\n\n        bundles: List[Dict[str, Any]] = []\n\n        for\
          \ key in wrapper_keys:\n            if key not in obj:\n               \
          \ continue\n\n            value = obj.get(key)\n\n            if is_empty(value):\n\
          \                continue\n\n            bundles.extend(parse_bundle_collection(value))\n\
          \n        return dedupe_list(bundles)\n\n    return []\n\n\ndef extract_bundle_summary(\n\
          \    bundle: Dict[str, Any],\n    expected_ioc_type: str\n) -> Dict[str,\
          \ Any]:\n    \"\"\"\n    从一个标准化证据包中提取统一摘要。\n    \"\"\"\n    if not isinstance(bundle,\
          \ dict) or not bundle:\n        return {}\n\n    fusion = bundle.get(\"\
          fusion_result\")\n\n    if not isinstance(fusion, dict):\n        fusion\
          \ = {}\n\n    # ioc_type 优先使用证据包真实字段，缺失时使用分支类型补齐\n    ioc_type = normalize_ioc_type(\n\
          \        bundle.get(\"ioc_type\")\n        or fusion.get(\"ioc_type\")\n\
          \        or expected_ioc_type\n    )\n\n    # ioc 优先使用顶层，其次 fusion_result\n\
          \    ioc = str(\n        bundle.get(\"ioc\")\n        or fusion.get(\"ioc\"\
          )\n        or bundle.get(\"query\")\n        or \"\"\n    ).strip()\n\n\
          \    subject_rank = as_int(\n        fusion.get(\"subject_risk_rank\")\n\
          \        if fusion.get(\"subject_risk_rank\") is not None\n        else\
          \ bundle.get(\"subject_risk_rank\")\n    )\n\n    context_rank = as_int(\n\
          \        fusion.get(\"context_risk_rank\")\n        if fusion.get(\"context_risk_rank\"\
          ) is not None\n        else bundle.get(\"context_risk_rank\")\n    )\n\n\
          \    final_rank = as_int(\n        fusion.get(\"final_risk_rank\")\n   \
          \     if fusion.get(\"final_risk_rank\") is not None\n        else bundle.get(\"\
          final_risk_rank\")\n    )\n\n    subject_level = str(\n        fusion.get(\"\
          subject_risk_level\")\n        or bundle.get(\"subject_risk_level\")\n \
          \       or rank_to_level(subject_rank)\n    )\n\n    context_level = str(\n\
          \        fusion.get(\"context_risk_level\")\n        or bundle.get(\"context_risk_level\"\
          )\n        or rank_to_level(context_rank)\n    )\n\n    final_level = str(\n\
          \        fusion.get(\"final_risk_level\")\n        or bundle.get(\"final_risk_level\"\
          )\n        or rank_to_level(final_rank)\n    )\n\n    evidence_items = bundle.get(\"\
          evidence_items\")\n\n    if not isinstance(evidence_items, list):\n    \
          \    evidence_items = []\n\n    evidence_count = as_int(\n        fusion.get(\"\
          evidence_count\")\n        if fusion.get(\"evidence_count\") is not None\n\
          \        else bundle.get(\"evidence_count\")\n    )\n\n    # 如果标准化包没有显式\
          \ evidence_count，则按 evidence_items 数量补齐\n    if evidence_count <= 0 and\
          \ evidence_items:\n        evidence_count = len(evidence_items)\n\n    risk_reason\
          \ = str(\n        fusion.get(\"risk_reason\")\n        or bundle.get(\"\
          risk_reason\")\n        or \"\"\n    ).strip()\n\n    source_summaries =\
          \ fusion.get(\"source_summaries\")\n\n    if not isinstance(source_summaries,\
          \ list):\n        source_summaries = []\n\n    conflict_notes = fusion.get(\"\
          conflict_notes\")\n\n    if not isinstance(conflict_notes, list):\n    \
          \    conflict_notes = []\n\n    recommended_actions = bundle.get(\"recommended_actions\"\
          )\n\n    if not isinstance(recommended_actions, list):\n        recommended_actions\
          \ = []\n\n    key_findings: List[Any] = []\n\n    for item in evidence_items:\n\
          \        if not isinstance(item, dict):\n            continue\n\n      \
          \  findings = item.get(\"key_findings\")\n\n        if isinstance(findings,\
          \ list):\n            key_findings.extend(findings)\n\n        elif findings\
          \ not in [None, \"\"]:\n            key_findings.append(findings)\n\n  \
          \      summary = item.get(\"summary\")\n\n        if summary not in [None,\
          \ \"\"]:\n            key_findings.append(summary)\n\n    return {\n   \
          \     \"ioc_type\": ioc_type,\n        \"ioc\": ioc,\n        \"subject_risk_level\"\
          : subject_level,\n        \"subject_risk_rank\": subject_rank,\n       \
          \ \"context_risk_level\": context_level,\n        \"context_risk_rank\"\
          : context_rank,\n        \"final_risk_level\": final_level,\n        \"\
          final_risk_rank\": final_rank,\n        \"risk_reason\": risk_reason,\n\
          \        \"evidence_count\": evidence_count,\n        \"source_summaries\"\
          : dedupe_list(source_summaries),\n        \"conflict_notes\": dedupe_list(conflict_notes),\n\
          \        \"recommended_actions\": dedupe_list(recommended_actions),\n  \
          \      \"key_findings\": dedupe_list(key_findings)\n    }\n\n\n# ============================================================\n\
          # 3. 全局风险融合\n# ============================================================\n\
          \ndef build_overall_fusion(\n    bundle_summaries: List[Dict[str, Any]]\n\
          ) -> Dict[str, Any]:\n    \"\"\"\n    根据全部 IOC / Hash / CVE 对象的最终风险生成总体结论。\n\
          \n    总体风险取所有对象 final_risk_rank 的最大值。\n    \"\"\"\n    valid = [\n     \
          \   item\n        for item in bundle_summaries\n        if isinstance(item,\
          \ dict)\n        and item.get(\"ioc\")\n    ]\n\n    if not valid:\n   \
          \     return {\n            \"overall_risk_level\": \"未知\",\n          \
          \  \"overall_risk_rank\": 0,\n            \"overall_reason\": \"未获得有效标准化证据。\"\
          ,\n            \"highest_risk_iocs\": [],\n            \"ioc_count\": 0,\n\
          \            \"evidence_count\": 0,\n            \"type_counts\": {\n  \
          \              \"ip\": 0,\n                \"domain\": 0,\n            \
          \    \"url\": 0,\n                \"hash\": 0,\n                \"cve\"\
          : 0\n            }\n        }\n\n    max_rank = max(\n        as_int(item.get(\"\
          final_risk_rank\"))\n        for item in valid\n    )\n\n    highest = [\n\
          \        item\n        for item in valid\n        if as_int(item.get(\"\
          final_risk_rank\")) == max_rank\n    ]\n\n    evidence_count = sum(\n  \
          \      as_int(item.get(\"evidence_count\"))\n        for item in valid\n\
          \    )\n\n    type_counts = {\n        \"ip\": 0,\n        \"domain\": 0,\n\
          \        \"url\": 0,\n        \"hash\": 0,\n        \"cve\": 0\n    }\n\n\
          \    for item in valid:\n        ioc_type = normalize_ioc_type(item.get(\"\
          ioc_type\"))\n\n        if ioc_type in type_counts:\n            type_counts[ioc_type]\
          \ += 1\n\n    if max_rank >= 5:\n        reason = \"多源证据中存在严重风险对象，应优先处置。\"\
          \n\n    elif max_rank == 4:\n        reason = \"多源证据中存在高风险对象，建议尽快核查并处置。\"\
          \n\n    elif max_rank == 3:\n        reason = (\n            \"多源证据中存在中风险对象，\"\
          \n            \"需要结合本地日志、终端行为和资产暴露面进一步复核。\"\n        )\n\n    elif max_rank\
          \ == 2:\n        reason = (\n            \"多源证据中存在低风险或上下文风险线索，\"\n     \
          \       \"建议持续监测并补充本地证据。\"\n        )\n\n    elif max_rank == 1:\n     \
          \   reason = \"当前标准化证据未发现明显恶意风险。\"\n\n    else:\n        reason = \"当前标准化证据不足，无法形成明确风险结论。\"\
          \n\n    highest_risk_iocs: List[Dict[str, Any]] = []\n\n    for item in\
          \ highest:\n        highest_risk_iocs.append({\n            \"ioc_type\"\
          : item.get(\"ioc_type\"),\n            \"ioc\": item.get(\"ioc\"),\n   \
          \         \"final_risk_level\": item.get(\"final_risk_level\"),\n      \
          \      \"final_risk_rank\": as_int(item.get(\"final_risk_rank\")),\n   \
          \         \"risk_reason\": item.get(\"risk_reason\")\n        })\n\n   \
          \ return {\n        \"overall_risk_level\": rank_to_level(max_rank),\n \
          \       \"overall_risk_rank\": max_rank,\n        \"overall_reason\": reason,\n\
          \        \"highest_risk_iocs\": highest_risk_iocs,\n        \"ioc_count\"\
          : len(valid),\n        \"evidence_count\": evidence_count,\n        \"type_counts\"\
          : type_counts\n    }\n\n\n# ============================================================\n\
          # 4. 知识库检索语句构造\n# ============================================================\n\
          \ndef build_knowledge_retrieval_query(\n    user_query: str,\n    bundle_summaries:\
          \ List[Dict[str, Any]],\n    overall: Dict[str, Any]\n) -> str:\n    \"\"\
          \"\n    生成供知识库检索节点使用的查询文本。\n    \"\"\"\n    lines: List[str] = []\n\n  \
          \  if user_query:\n        lines.append(f\"用户原始问题：{user_query}\")\n\n  \
          \  lines.append(\n        \"请检索知识库中与以下批量 IOC、Hash 和 CVE 证据相关的\"\n      \
          \  \"安全研判、处置建议、威胁情报解释、文件信誉分析、\"\n        \"漏洞修复、ATT&CK/CWE 映射和 SOC 响应流程内容。\"\
          \n    )\n\n    lines.append(\n        f\"总体风险：{overall.get('overall_risk_level',\
          \ '未知')}；\"\n        f\"对象数量：{overall.get('ioc_count', 0)}；\"\n        f\"\
          证据数量：{overall.get('evidence_count', 0)}；\"\n        f\"总体原因：{overall.get('overall_reason',\
          \ '')}\"\n    )\n\n    for item in bundle_summaries:\n        if not isinstance(item,\
          \ dict) or not item.get(\"ioc\"):\n            continue\n\n        lines.append(\n\
          \            f\"{str(item.get('ioc_type', '')).upper()}：\"\n           \
          \ f\"{item.get('ioc')}；\"\n            f\"主体风险：{item.get('subject_risk_level')}；\"\
          \n            f\"上下文风险：{item.get('context_risk_level')}；\"\n           \
          \ f\"最终风险：{item.get('final_risk_level')}；\"\n            f\"理由：{item.get('risk_reason')}\"\
          \n        )\n\n        key_findings = item.get(\"key_findings\")\n\n   \
          \     if isinstance(key_findings, list) and key_findings:\n            lines.append(\n\
          \                \"关键发现：\"\n                + \"；\".join(\n            \
          \        str(value)\n                    for value in key_findings[:8]\n\
          \                )\n            )\n\n    lines.append(\n        \"检索重点：IOC分析、恶意IP、恶意域名、恶意URL、\"\
          \n        \"恶意Hash、文件信誉、恶意样本、多引擎检测、沙箱行为、\"\n        \"CVE漏洞、漏洞修复、补丁建议、CISA\
          \ KEV、\"\n        \"ATT&CK技术映射、SOC告警处置和应急响应。\"\n    )\n\n    return truncate_text(\"\
          \\n\".join(lines), 6000)\n\n\n# ============================================================\n\
          # 5. 最终 LLM 证据上下文构造\n# ============================================================\n\
          \ndef build_llm_context(\n    bundle_summaries: List[Dict[str, Any]],\n\
          \    overall: Dict[str, Any]\n) -> str:\n    \"\"\"\n    生成供最终研判 LLM 使用的紧凑证据文本。\n\
          \    \"\"\"\n    lines: List[str] = []\n\n    lines.append(\"【批量多源证据融合结果】\"\
          )\n\n    lines.append(\n        f\"总体风险：{overall.get('overall_risk_level',\
          \ '未知')}；\"\n        f\"对象数量：{overall.get('ioc_count', 0)}；\"\n        f\"\
          证据数量：{overall.get('evidence_count', 0)}；\"\n        f\"总体原因：{overall.get('overall_reason',\
          \ '')}\"\n    )\n\n    type_counts = overall.get(\"type_counts\")\n\n  \
          \  if isinstance(type_counts, dict):\n        lines.append(\n          \
          \  \"对象类型统计：\"\n            f\"IP={type_counts.get('ip', 0)}，\"\n      \
          \      f\"Domain={type_counts.get('domain', 0)}，\"\n            f\"URL={type_counts.get('url',\
          \ 0)}，\"\n            f\"Hash={type_counts.get('hash', 0)}，\"\n        \
          \    f\"CVE={type_counts.get('cve', 0)}。\"\n        )\n\n    highest = overall.get(\"\
          highest_risk_iocs\")\n\n    if isinstance(highest, list) and highest:\n\
          \        lines.append(\"最高风险对象：\")\n\n        for item in highest:\n   \
          \         if not isinstance(item, dict):\n                continue\n\n \
          \           lines.append(\n                f\"- {item.get('ioc_type')}：{item.get('ioc')}；\"\
          \n                f\"风险：{item.get('final_risk_level')}；\"\n            \
          \    f\"风险分值：{item.get('final_risk_rank')}；\"\n                f\"原因：{item.get('risk_reason')}\"\
          \n            )\n\n    lines.append(\"各对象证据摘要：\")\n\n    for item in bundle_summaries:\n\
          \        if not isinstance(item, dict) or not item.get(\"ioc\"):\n     \
          \       continue\n\n        lines.append(\n            f\"- {item.get('ioc_type')}：{item.get('ioc')}；\"\
          \n            f\"主体风险：{item.get('subject_risk_level')}；\"\n            f\"\
          主体分值：{item.get('subject_risk_rank')}；\"\n            f\"上下文风险：{item.get('context_risk_level')}；\"\
          \n            f\"上下文分值：{item.get('context_risk_rank')}；\"\n            f\"\
          最终风险：{item.get('final_risk_level')}；\"\n            f\"最终分值：{item.get('final_risk_rank')}；\"\
          \n            f\"证据数：{item.get('evidence_count')}；\"\n            f\"理由：{item.get('risk_reason')}\"\
          \n        )\n\n        conflict_notes = item.get(\"conflict_notes\")\n\n\
          \        if isinstance(conflict_notes, list) and conflict_notes:\n     \
          \       lines.append(\n                \"  证据冲突或注意事项：\"\n              \
          \  + \"；\".join(\n                    str(value)\n                    for\
          \ value in conflict_notes[:5]\n                )\n            )\n\n    \
          \    key_findings = item.get(\"key_findings\")\n\n        if isinstance(key_findings,\
          \ list) and key_findings:\n            lines.append(\n                \"\
          \  关键发现：\"\n                + \"；\".join(\n                    str(value)\n\
          \                    for value in key_findings[:8]\n                )\n\
          \            )\n\n    return truncate_text(\"\\n\".join(lines), 8000)\n\n\
          \n# ============================================================\n# 6. Dify\
          \ 主函数\n# ============================================================\n\n\
          def main(\n    user_query: str = \"\",\n    ip_evidence_bundles: List[str]\
          \ = None,\n    domain_evidence_bundles: List[str] = None,\n    url_evidence_bundles:\
          \ List[str] = None,\n    hash_evidence_bundles: List[str] = None,\n    cve_evidence_bundles:\
          \ List[str] = None\n) -> Dict[str, Any]:\n    \"\"\"\n    当前代码节点只使用以下 6\
          \ 个输入：\n\n    user_query                String\n    ip_evidence_bundles\
          \       Array[String]\n    domain_evidence_bundles   Array[String]\n   \
          \ url_evidence_bundles      Array[String]\n    hash_evidence_bundles   \
          \  Array[String]\n    cve_evidence_bundles      Array[String]\n\n    不再兼容、不再读取旧版单\
          \ IOC 输入变量。\n    \"\"\"\n\n    # 防止 Dify 在某些空分支中传入 None\n    ip_evidence_bundles\
          \ = ip_evidence_bundles or []\n    domain_evidence_bundles = domain_evidence_bundles\
          \ or []\n    url_evidence_bundles = url_evidence_bundles or []\n    hash_evidence_bundles\
          \ = hash_evidence_bundles or []\n    cve_evidence_bundles = cve_evidence_bundles\
          \ or []\n\n    raw_inputs = {\n        \"ip\": ip_evidence_bundles,\n  \
          \      \"domain\": domain_evidence_bundles,\n        \"url\": url_evidence_bundles,\n\
          \        \"hash\": hash_evidence_bundles,\n        \"cve\": cve_evidence_bundles\n\
          \    }\n\n    evidence_bundles: List[Dict[str, Any]] = []\n    bundle_summaries:\
          \ List[Dict[str, Any]] = []\n    all_evidence_items: List[Any] = []\n  \
          \  all_recommended_actions: List[Any] = []\n    parse_warnings: List[str]\
          \ = []\n\n    # 对五类迭代输出逐类解析\n    for expected_ioc_type, raw_collection in\
          \ raw_inputs.items():\n        if is_empty(raw_collection):\n          \
          \  continue\n\n        bundles = parse_bundle_collection(raw_collection)\n\
          \n        if not bundles:\n            parse_warnings.append(\n        \
          \        f\"{expected_ioc_type} 分支存在输入，\"\n                \"但未解析到有效标准化证据包。\"\
          \n            )\n            continue\n\n        for bundle in bundles:\n\
          \            if not isinstance(bundle, dict) or not bundle:\n          \
          \      continue\n\n            # 缺失 ioc_type 时使用当前分支类型补齐\n            if\
          \ not bundle.get(\"ioc_type\"):\n                bundle = dict(bundle)\n\
          \                bundle[\"ioc_type\"] = expected_ioc_type\n\n          \
          \  evidence_bundles.append(bundle)\n\n            summary = extract_bundle_summary(\n\
          \                bundle=bundle,\n                expected_ioc_type=expected_ioc_type\n\
          \            )\n\n            if summary and summary.get(\"ioc\"):\n   \
          \             bundle_summaries.append(summary)\n\n            else:\n  \
          \              parse_warnings.append(\n                    f\"{expected_ioc_type}\
          \ 分支解析到证据包，\"\n                    \"但证据包缺少有效 IOC 对象。\"\n              \
          \  )\n\n            evidence_items = bundle.get(\"evidence_items\")\n\n\
          \            if isinstance(evidence_items, list):\n                all_evidence_items.extend(evidence_items)\n\
          \n            recommended_actions = bundle.get(\"recommended_actions\")\n\
          \n            if isinstance(recommended_actions, list):\n              \
          \  all_recommended_actions.extend(recommended_actions)\n\n    # 全局去重\n \
          \   evidence_bundles = dedupe_list(evidence_bundles)\n    bundle_summaries\
          \ = dedupe_list(bundle_summaries)\n    all_evidence_items = dedupe_list(all_evidence_items)\n\
          \    all_recommended_actions = dedupe_list(all_recommended_actions)\n  \
          \  parse_warnings = dedupe_list(parse_warnings)\n\n    overall = build_overall_fusion(bundle_summaries)\n\
          \n    # 构造统一 IOC 列表\n    ioc_list: List[Dict[str, Any]] = []\n\n    for\
          \ item in bundle_summaries:\n        if not isinstance(item, dict) or not\
          \ item.get(\"ioc\"):\n            continue\n\n        ioc_list.append({\n\
          \            \"ioc_type\": item.get(\"ioc_type\"),\n            \"ioc\"\
          : item.get(\"ioc\"),\n            \"subject_risk_level\": item.get(\"subject_risk_level\"\
