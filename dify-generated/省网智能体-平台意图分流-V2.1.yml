    - data:
        code: "import json\nimport re\nfrom typing import Any\n\n\ndef to_text(value:\
          \ Any) -> str:\n    \"\"\"\n    兼容 Dify 文本提取器的不同输出形态：\n    1. 直接是字符串\n \
          \   2. {\"text\": \"...\"}\n    3. {\"result\": \"...\"}\n    4. {\"content\"\
          : \"...\"}\n    5. {\"data\": \"...\"}\n    \"\"\"\n    if value is None:\n\
          \        return \"\"\n\n    if isinstance(value, str):\n        text = value.strip()\n\
          \n        # 如果文本提取器输出的是 JSON 字符串，尝试解析\n        if text.startswith(\"{\"\
          ) and text.endswith(\"}\"):\n            try:\n                obj = json.loads(text)\n\
          \                return to_text(obj)\n            except Exception:\n  \
          \              return text\n\n        return text\n\n    if isinstance(value,\
          \ dict):\n        for key in [\"text\", \"result\", \"content\", \"data\"\
          , \"answer\"]:\n            if key in value and value.get(key):\n      \
          \          return to_text(value.get(key))\n        return json.dumps(value,\
          \ ensure_ascii=False)\n\n    if isinstance(value, list):\n        parts\
          \ = []\n        for item in value:\n            t = to_text(item)\n    \
          \        if t:\n                parts.append(t)\n        return \"\\n\"\
          .join(parts)\n\n    return str(value)\n\n\ndef dedupe(items: list[str])\
          \ -> list[str]:\n    result = []\n    seen = set()\n    for item in items:\n\
          \        if not item:\n            continue\n        value = str(item).strip()\n\
          \        if value and value not in seen:\n            seen.add(value)\n\
          \            result.append(value)\n    return result\n\n\ndef extract_ips(text:\
          \ str) -> list[str]:\n    pattern = r\"(?<![\\d.])(?:\\d{1,3}\\.){3}\\d{1,3}(?![\\\
          d.])\"\n    candidates = re.findall(pattern, text)\n\n    valid = []\n \
          \   for ip in candidates:\n        parts = ip.split(\".\")\n        if all(part.isdigit()\
          \ and 0 <= int(part) <= 255 for part in parts):\n            valid.append(ip)\n\
          \n    return dedupe(valid)\n\n\ndef extract_urls(text: str) -> list[str]:\n\
          \    pattern = r\"https?://[^\\s\\\"'<>，。；、)）\\]}]+\"\n    urls = re.findall(pattern,\
          \ text, flags=re.IGNORECASE)\n\n    cleaned = []\n    for url in urls:\n\
          \        cleaned.append(url.rstrip(\".,;，。；、)）]】}\"))\n\n    return dedupe(cleaned)\n\
          \n\ndef extract_domains(text: str, urls: list[str]) -> list[str]:\n    \"\
          \"\"\n    提取域名，同时避免 URL 中的域名重复进入。\n    例如：\n    - baidu.com\n    - www.jd.com\n\
          \    - attack.example.org\n    \"\"\"\n    cleaned_text = text\n\n    #\
          \ 先移除完整 URL，避免 URL 里的域名重复提取\n    for url in urls:\n        cleaned_text\
          \ = cleaned_text.replace(url, \" \")\n\n    pattern = r\"(?<![A-Za-z0-9.-])(?:[A-Za-z0-9-]+\\\
          .)+[A-Za-z]{2,}(?![A-Za-z0-9.-])\"\n    candidates = re.findall(pattern,\
          \ cleaned_text)\n\n    blacklist_suffix = {\n        \".png\", \".jpg\"\
          , \".jpeg\", \".gif\", \".zip\",\n        \".exe\", \".dll\", \".doc\",\
          \ \".docx\", \".pdf\",\n        \".xlsx\", \".csv\", \".ppt\", \".pptx\"\
          \n    }\n\n    result = []\n    for domain in candidates:\n        d = domain.lower().strip().strip(\"\
          .,;:，。；：、()（）[]【】{}<>\")\n        if not d:\n            continue\n    \
          \    if any(d.endswith(suffix) for suffix in blacklist_suffix):\n      \
          \      continue\n        if d.startswith(\"www.\") and len(d.split(\".\"\
          )) < 3:\n            result.append(d)\n        else:\n            result.append(d)\n\
          \n    return dedupe(result)\n\n\ndef extract_cves(text: str) -> list[str]:\n\
          \    pattern = r\"\\bCVE-\\d{4}-\\d{4,7}\\b\"\n    cves = re.findall(pattern,\
          \ text, flags=re.IGNORECASE)\n    return dedupe([cve.upper() for cve in\
          \ cves])\n\n\ndef extract_hashes(text: str) -> list[str]:\n    \"\"\"\n\
          \    提取常见 Hash：\n    MD5     32位\n    SHA1    40位\n    SHA256  64位\n   \
          \ \"\"\"\n    pattern = r\"\\b[a-fA-F0-9]{32}\\b|\\b[a-fA-F0-9]{40}\\b|\\\
          b[a-fA-F0-9]{64}\\b\"\n    hashes = re.findall(pattern, text)\n\n    # 排除纯数字误匹配\n\
          \    result = []\n    for h in hashes:\n        if not h.isdigit():\n  \
          \          result.append(h.lower())\n\n    return dedupe(result)\n\n\ndef\
          \ extract_emails(text: str) -> list[str]:\n    pattern = r\"\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\
          .[A-Za-z]{2,}\\b\"\n    emails = re.findall(pattern, text)\n    return dedupe([email.lower()\
          \ for email in emails])\n\n\ndef find_keyword_hits(text: str) -> list[str]:\n\
          \    \"\"\"\n    不做复杂语义分析，只做安全关键词粗筛。\n    后续是否有风险交给 Agent 和工具链判断。\n    \"\
          \"\"\n    keywords = [\n        \"恶意\", \"木马\", \"后门\", \"勒索\", \"钓鱼\",\
          \ \"漏洞\", \"攻击\", \"入侵\",\n        \"C2\", \"命令控制\", \"远控\", \"样本\", \"\
          IOC\", \"告警\", \"可疑\",\n        \"malware\", \"trojan\", \"backdoor\", \"\
          ransomware\", \"phishing\",\n        \"exploit\", \"payload\", \"shell\"\
          , \"webshell\", \"beacon\"\n    ]\n\n    hits = []\n    lower_text = text.lower()\n\
          \n    for kw in keywords:\n        if kw.lower() in lower_text:\n      \
          \      hits.append(kw)\n\n    return dedupe(hits)\n\n\ndef build_snippets(text:\
          \ str, indicators: dict) -> list[dict]:\n    \"\"\"\n    为提取到的 IOC 生成上下文片段，便于后续\
          \ LLM 知道 IOC 出现在哪里。\n    \"\"\"\n    snippets = []\n\n    all_iocs = []\n\
          \    for key in [\"ips\", \"domains\", \"urls\", \"hashes\", \"cves\", \"\
          emails\"]:\n        for value in indicators.get(key, []):\n            all_iocs.append((key,\
          \ value))\n\n    for ioc_type, value in all_iocs[:20]:\n        idx = text.find(value)\n\
          \        if idx < 0:\n            continue\n\n        start = max(0, idx\
          \ - 80)\n        end = min(len(text), idx + len(value) + 120)\n        snippet\
          \ = text[start:end].replace(\"\\n\", \" \").replace(\"\\r\", \" \")\n\n\
          \        snippets.append({\n            \"ioc_type\": ioc_type,\n      \
          \      \"ioc\": value,\n            \"snippet\": snippet\n        })\n\n\
          \    return snippets\n\n\ndef truncate(text: str, max_len: int = 3000) ->\
          \ str:\n    text = text or \"\"\n    if len(text) <= max_len:\n        return\
          \ text\n    return text[:max_len] + \"\\n...[内容过长，已截断，仅保留前部预览]\"\n\n\ndef\
          \ main(\n    filename: str = \"\",\n    file_kind: str = \"\",\n    mime:\
          \ str = \"\",\n    ext: str = \"\",\n    extracted_text: Any = \"\",\n)\
          \ -> dict:\n    raw_text = to_text(extracted_text)\n\n    urls = extract_urls(raw_text)\n\
          \    ips = extract_ips(raw_text)\n    domains = extract_domains(raw_text,\
          \ urls)\n    cves = extract_cves(raw_text)\n    hashes = extract_hashes(raw_text)\n\
          \    emails = extract_emails(raw_text)\n\n    indicators = {\n        \"\
          ips\": ips,\n        \"domains\": domains,\n        \"urls\": urls,\n  \
          \      \"hashes\": hashes,\n        \"cves\": cves,\n        \"emails\"\
          : emails\n    }\n\n    keyword_hits = find_keyword_hits(raw_text)\n    snippets\
          \ = build_snippets(raw_text, indicators)\n\n    ioc_count = (\n        len(ips)\n\
          \        + len(domains)\n        + len(urls)\n        + len(hashes)\n  \
          \      + len(cves)\n        + len(emails)\n    )\n\n    if not raw_text:\n\
          \        summary = \"文本提取器未返回有效文本内容。\"\n    elif ioc_count > 0:\n      \
          \  summary = (\n            f\"文档已完成文本提取，共识别到 {ioc_count} 个潜在安全指标，\"\n \
          \           f\"包括 IP {len(ips)} 个、域名 {len(domains)} 个、URL {len(urls)} 个、\"\
          \n            f\"Hash {len(hashes)} 个、CVE {len(cves)} 个。\"\n        )\n\
          \    else:\n        summary = \"文档已完成文本提取，暂未识别到明显 IOC。\"\n\n    result =\
          \ {\n        \"file_type\": \"document\",\n        \"filename\": filename,\n\
          \        \"file_kind\": file_kind,\n        \"mime\": mime,\n        \"\
          ext\": ext,\n        \"summary\": summary,\n        \"text_length\": len(raw_text),\n\
          \        \"text_preview\": truncate(raw_text, 3000),\n        \"security_indicators\"\
          : indicators,\n        \"keyword_hits\": keyword_hits,\n        \"ioc_context_snippets\"\
          : snippets,\n        \"key_security_findings\": [\n            f\"识别到 IP：{len(ips)}\
          \ 个\",\n            f\"识别到域名：{len(domains)} 个\",\n            f\"识别到 URL：{len(urls)}\
          \ 个\",\n            f\"识别到 Hash：{len(hashes)} 个\",\n            f\"识别到 CVE：{len(cves)}\
          \ 个\",\n            f\"命中安全关键词：{', '.join(keyword_hits)}\" if keyword_hits\
          \ else \"未命中明显安全关键词\"\n        ],\n        \"risk_clues\": keyword_hits,\n\
          \        \"raw_text_saved\": False,\n        \"note\": \"该节点基于 DIFY 文本提取器原文结果进行规则化\
          \ IOC 提取，不做大模型语义判断。\"\n    }\n\n    return {\n        \"file_result_json\"\
          : json.dumps(result, ensure_ascii=False)\n    }"
