          \ = rank_to_level(context_rank)\n\n    conflict_notes = []\n\n    # 主体风险和上下文风险分开判断\n\
          \    if subject_rank <= 1 and context_rank >= 4:\n        final_rank = 2\n\
          \        final_level = \"低风险（存在高风险关联线索，需复核）\"\n        conflict_notes.append(\n\
          \            \"主体 IP 多源判定偏安全，但安恒关联文件/上下文存在高风险线索，需结合本地日志确认关联是否真实有效。\"\n \
          \       )\n    elif subject_rank <= 1 and context_rank >= 3:\n        final_rank\
          \ = 2\n        final_level = \"低风险（存在中等关联线索）\"\n        conflict_notes.append(\n\
          \            \"主体 IP 检测结果偏安全，但存在中等上下文线索，建议结合本地访问行为复核。\"\n        )\n   \
          \ else:\n        final_rank = subject_rank\n        final_level = subject_level\n\
