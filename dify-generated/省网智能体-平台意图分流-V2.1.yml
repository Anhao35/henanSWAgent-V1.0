          \ to_obj(value: Any) -> Any:\n    if value is None:\n        return []\n\
          \    if isinstance(value, (list, dict)):\n        return value\n    if isinstance(value,\
          \ str):\n        text = value.strip()\n        if not text:\n          \
          \  return []\n        try:\n            return json.loads(text)\n      \
          \  except Exception:\n            return value\n    return value\n\n\ndef\
          \ get_file_name(f: Any) -> str:\n    if isinstance(f, dict):\n        return\
          \ (\n            f.get(\"name\")\n            or f.get(\"filename\")\n \
          \           or f.get(\"file_name\")\n            or f.get(\"origin_filename\"\
          )\n            or f.get(\"original_filename\")\n            or f.get(\"\
          display_name\")\n            or \"\"\n        )\n    return str(f)\n\n\n\
          def get_mime(f: Any) -> str:\n    if isinstance(f, dict):\n        return\
          \ (\n            f.get(\"mime_type\")\n            or f.get(\"mimeType\"\
          )\n            or f.get(\"mime\")\n            or f.get(\"content_type\"\
          )\n            or f.get(\"type\")\n            or \"\"\n        )\n    return\
          \ \"\"\n\n\ndef get_ext(filename: str) -> str:\n    if not filename:\n \
          \       return \"\"\n    return os.path.splitext(filename.lower())[1].lstrip(\"\
          .\")\n\n\ndef classify_file(f: Any) -> dict:\n    filename = get_file_name(f)\n\
          \    mime = get_mime(f).lower()\n    ext = get_ext(filename)\n\n    file_kind\
          \ = \"unknown\"\n    route_group = \"unsupported\"\n\n    if ext in IMAGE_EXTS\
          \ or mime.startswith(\"image/\"):\n        file_kind = \"image\"\n     \
          \   route_group = \"image\"\n    elif ext in PDF_EXTS or mime == \"application/pdf\"\
          :\n        file_kind = \"pdf\"\n        route_group = \"document\"\n   \
