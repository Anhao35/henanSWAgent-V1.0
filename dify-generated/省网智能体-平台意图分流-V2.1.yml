    - data:
        code: "import json\nfrom typing import Any\n\n\ndef to_text(value: Any) ->\
          \ str:\n    \"\"\"\n    将 MCP 工具可能返回的 string / dict / list / number\n  \
          \  统一转换为字符串，保证 Dify 的 string 输出类型稳定。\n    \"\"\"\n    if value is None:\n\
          \        return \"\"\n\n    if isinstance(value, str):\n        return value.strip()\n\
          \n    if isinstance(value, (dict, list)):\n        if not value:\n     \
          \       return \"\"\n        return json.dumps(\n            value,\n  \
