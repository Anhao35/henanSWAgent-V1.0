          : primary_cve,\n        \"primary_hash\": primary_hash,\n\n        # 真正的数组输出，供\
          \ Dify 迭代节点逐项处理\n        \"ip_list\": ip_list,\n        \"domain_list\"\
          : domain_list,\n        \"url_list\": url_list,\n        \"cve_list\": cve_list,\n\
          \        \"hash_list\": hash_list,\n\n        # 完整过滤后 IOC 列表，方便后续扩展\n  \
          \      \"ip_list_json\": json.dumps(ip_list, ensure_ascii=False),\n    \
          \    \"domain_list_json\": json.dumps(domain_list, ensure_ascii=False),\n\
          \        \"url_list_json\": json.dumps(url_list, ensure_ascii=False),\n\
          \        \"cve_list_json\": json.dumps(cve_list, ensure_ascii=False),\n\
          \        \"hash_list_json\": json.dumps(hash_list, ensure_ascii=False),\n\
          \n        # ATT&CK 编号抽取结果\n        \"has_attack_id\": bool(attack_ids),\n\
          \        \"attack_id_count\": len(attack_ids),\n        \"attack_ids\":\
          \ \",\".join(attack_ids),\n        \"attack_ids_json\": json.dumps(attack_ids,\
          \ ensure_ascii=False),\n\n        # 过滤后的 route_plan\n        \"route_plan_json\"\
          : json.dumps(filtered_route_plan, ensure_ascii=False),\n\n        # 摘要，基于过滤后结果\n\
          \        \"router_summary\": (\n            f\"识别到 IP {len(ip_list)} 个、域名\
          \ {len(domain_list)} 个、\"\n            f\"URL {len(url_list)} 个、CVE {len(cve_list)}\
          \ 个、\"\n            f\"Hash {len(hash_list)} 个、ATT&CK 编号 {len(attack_ids)}\
          \ 个。\"\n        ),\n\n        # 调试用：记录原始数量，方便确认是否过滤掉 .multimodal\n     \
          \   \"raw_ip_count\": len(raw_ip_list) if isinstance(raw_ip_list, list)\
