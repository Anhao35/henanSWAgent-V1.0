    - data:
        code: "import json\nfrom typing import Any\n\n\ndef to_text(value: Any) ->\
          \ str:\n    \"\"\"\n    将 MCP 工具可能返回的 string / dict / list / number\n  \
          \  统一转换为字符串，保证 Dify 的 string 输出类型稳定。\n    \"\"\"\n    if value is None:\n\
          \        return \"\"\n\n    if isinstance(value, str):\n        return value.strip()\n\
          \n    if isinstance(value, (dict, list)):\n        if not value:\n     \
          \       return \"\"\n        return json.dumps(\n            value,\n  \
          \          ensure_ascii=False,\n            indent=2,\n            default=str\n\
          \        )\n\n    return str(value).strip()\n\n\ndef main(\n    mcp_text:\
          \ Any = \"\",\n    mcp_result: Any = \"\",\n    mcp_json: Any = None\n)\
          \ -> dict:\n    \"\"\"\n    优先使用 result，其次 text，最后 json。\n    无论上游实际返回什么\
          \ Python 类型，\n    anheng_result_text 始终返回 String。\n    \"\"\"\n    for candidate\
          \ in [mcp_result, mcp_text, mcp_json]:\n        final_text = to_text(candidate)\n\
          \        if final_text:\n            return {\n                \"anheng_result_text\"\
          : final_text\n            }\n\n    return {\n        \"anheng_result_text\"\
          : \"\"\n    }\n"
