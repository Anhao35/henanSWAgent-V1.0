          \     \"medium\", \"中风险\", \"中危\",\n        \"grayware\", \"pua\", \"pup\"\
          , \"潜在不受欢迎\"\n    ]):\n        return 3\n\n    if any(k in text for k in\
          \ [\"low risk\", \"低风险\", \"低危\"]):\n        return 2\n\n    if any(k in\
          \ text for k in [\n        \"clean\", \"benign\", \"安全\", \"正常\",\n    \
          \    \"白名单\", \"可信\", \"无风险\"\n    ]):\n        return 1\n\n    return 0\n\
          \n\ndef score_to_rank(value: Any) -> int:\n    if value in [None, \"\"]:\n\
          \        return 0\n\n    score = as_float(value, -1)\n\n    if score < 0:\n\
          \        return 0\n\n    # 同时兼容 0~1 和 0~100\n    if 0 <= score <= 1:\n \
          \       score *= 100\n\n    if score >= 90:\n        return 5\n    if score\
          \ >= 70:\n        return 4\n    if score >= 40:\n        return 3\n    if\
          \ score > 0:\n        return 2\n    return 0\n\n\ndef detection_count_to_rank(count:\
          \ int) -> int:\n    if count >= 10:\n        return 5\n    if count >= 3:\n\
          \        return 4\n    if count >= 1:\n        return 3\n    return 0\n\n\
          \n# =========================\n# 3. 杀毒引擎结果解析\n# =========================\n\
          \ndef parse_antivirus_scan(data: Any) -> dict:\n    \"\"\"\n    兼容：\n  \
          \  antivirus_scan: [\n        {\"engine\": \"xxx\", \"result\": \"Trojan\"\
          }\n    ]\n\n    antivirus_scan: {\n        \"Kaspersky\": \"Trojan\",\n\
          \        \"Microsoft\": \"clean\"\n    }\n    \"\"\"\n    scan = find_first_value(data,\
          \ [\n        \"antivirus_scan\",\n        \"antivirus\",\n        \"av_scan\"\
          ,\n        \"av_results\",\n        \"scan_results\",\n        \"engines\"\
          ,\n        \"杀毒引擎\",\n        \"杀毒扫描\",\n        \"多引擎扫描\"\n    ])\n\n \
          \   explicit_positive = find_first_value(data, [\n        \"malicious_count\"\
          ,\n        \"positive_count\",\n        \"positives\",\n        \"detected_count\"\
          ,\n        \"detection_count\",\n        \"命中引擎数\",\n        \"恶意引擎数\"\n\
          \    ])\n\n    explicit_total = find_first_value(data, [\n        \"total_count\"\
          ,\n        \"engine_count\",\n        \"total_engines\",\n        \"扫描引擎数\"\
          ,\n        \"引擎总数\"\n    ])\n\n    positive_words = [\n        \"malicious\"\
          , \"detected\", \"infected\",\n        \"trojan\", \"virus\", \"ransomware\"\
          , \"backdoor\",\n        \"恶意\", \"检出\", \"木马\", \"病毒\", \"勒索\", \"后门\"\
          ,\n        \"suspicious\", \"可疑\", \"pua\", \"pup\"\n    ]\n\n    negative_words\
          \ = [\n        \"clean\", \"undetected\", \"benign\",\n        \"安全\", \"\
          未检出\", \"正常\", \"无威胁\"\n    ]\n\n    positive_results = []\n    parsed_total\
          \ = 0\n    parsed_positive = 0\n\n    def check_result(engine: str, result:\
          \ Any):\n        nonlocal parsed_total, parsed_positive\n\n        if result\
