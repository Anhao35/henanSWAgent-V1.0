          \        ),\n        \"user_query\": user_query,\n        \"overall_fusion_result\"\
          : overall,\n        \"ioc_list\": ioc_list,\n        \"bundle_summaries\"\
          : bundle_summaries,\n        \"evidence_bundles\": evidence_bundles,\n \
          \       \"all_evidence_items\": all_evidence_items,\n        \"recommended_actions\"\
          : all_recommended_actions,\n        \"parse_warnings\": parse_warnings,\n\
          \        \"knowledge_retrieval_query\": knowledge_retrieval_query\n    }\n\
          \n    return {\n        \"m_unified_risk_level\": overall.get(\n       \
