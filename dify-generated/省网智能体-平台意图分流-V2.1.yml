        code: "import json\nimport re\nfrom typing import Any\n\n\n# =========================\n\
          # 1. 通用 JSON 解析工具\n# =========================\n\ndef try_json_loads(value:\
          \ Any) -> Any:\n    \"\"\"\n    尽量把 Dify 工具输出解析为 Python 对象。\n    兼容：\n \
