    - data:
        code: "import json\nimport re\nfrom typing import Any\n\n\n# =========================\n\
          # 1. 通用 JSON 解析工具\n# =========================\n\n\ndef try_json_loads(value:\
          \ Any) -> Any:\n    \"\"\"\n    尽量把 Dify 工具输出解析为 Python 对象。\n\n    兼容：\n\
          \    - dict/list\n    - JSON 字符串或多层字符串化 JSON\n    - 外层 {\"text1\": \"...\"\
          } / {\"result\": \"...\"} / {\"text\": \"...\"}\n    - Markdown ```json\
          \ 包裹\n    \"\"\"\n    if value is None:\n        return None\n\n    if isinstance(value,\
          \ (dict, list)):\n        return value\n\n    if not isinstance(value, str):\n\
          \        return value\n\n    text = value.strip()\n    if not text:\n  \
          \      return None\n\n    for prefix in [\n        \"CVE查询结果：\",\n     \
          \   \"漏洞查询结果：\",\n        \"漏洞情报结果：\",\n    ]:\n        if text.startswith(prefix):\n\
          \            text = text[len(prefix):].strip()\n\n    text = re.sub(r\"\
          ^```json\\s*\", \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"\
          ^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n\n\
          \    current = text\n    for _ in range(5):\n        try:\n            parsed\
          \ = json.loads(current)\n            if isinstance(parsed, str):\n     \
          \           current = parsed.strip()\n                continue\n       \
          \     return parsed\n        except Exception:\n            break\n\n  \
          \  start = text.find(\"{\")\n    end = text.rfind(\"}\")\n    if start >=\
          \ 0 and end > start:\n        candidate = text[start:end + 1]\n        try:\n\
          \            return json.loads(candidate)\n        except Exception:\n \
          \           return text\n\n    return text\n\n\ndef extract_payload(raw:\
          \ Any) -> Any:\n    \"\"\"\n    从工具输出中提取真正的 CVE 业务数据。\n\n    兼容：\n    -\
          \ {\"text1\": \"...\"}\n    - {\"result\": \"...\"}\n    - {\"text\": \"\
          ...\"}\n    - {\"json\": [{\"text1\": \"...\"}]}\n    - {\"data\": {...}}\n\
          \    - {\"answer\": \"...\"}\n    \"\"\"\n    obj = try_json_loads(raw)\n\
          \n    if obj is None:\n        return None\n\n    if isinstance(obj, list):\n\
          \        if not obj:\n            return None\n        if len(obj) == 1:\n\
          \            return extract_payload(obj[0])\n        return [extract_payload(x)\
          \ for x in obj]\n\n    if isinstance(obj, dict):\n        for key in [\n\
          \            \"text1\",\n            \"result\",\n            \"result2\"\
          ,\n            \"answer\",\n            \"text\",\n            \"json\"\
          ,\n            \"data\",\n        ]:\n            if key in obj and obj.get(key)\
          \ not in [None, \"\", []]:\n                return extract_payload(obj.get(key))\n\
          \n        return obj\n\n    return obj\n\n\ndef as_float_or_none(value:\
          \ Any) -> Any:\n    \"\"\"无法可靠转换时返回 None，避免把“未评分”错误写成 0.0。\"\"\"\n    if\
          \ value in [None, \"\"]:\n        return None\n\n    text = str(value).strip()\n\
          \    if not text or text.lower() in [\n        \"n/a\",\n        \"na\"\
          ,\n        \"none\",\n        \"null\",\n        \"unknown\",\n        \"\
          unscored\",\n        \"not available\",\n        \"未评分\",\n        \"未知\"\
          ,\n        \"暂无\",\n    ]:\n        return None\n\n    try:\n        number\
          \ = float(value)\n    except Exception:\n        return None\n\n    # 部分工具用\
          \ 0.0 代表“暂无评分”，而不是 CVSS 真正为 0。\n    if number <= 0:\n        return None\n\
          \n    return number\n\n\ndef as_int(value: Any, default: int = 0) -> int:\n\
          \    try:\n        if value in [None, \"\"]:\n            return default\n\
          \        return int(float(value))\n    except Exception:\n        return\
          \ default\n\n\ndef dedupe_list(items: list) -> list:\n    result = []\n\
          \    seen = set()\n\n    for item in items:\n        if item in [None, \"\
          \"]:\n            continue\n\n        key = (\n            json.dumps(item,\
          \ ensure_ascii=False, sort_keys=True)\n            if isinstance(item, (dict,\
          \ list))\n            else str(item)\n        )\n\n        if key not in\
          \ seen:\n            seen.add(key)\n            result.append(item)\n\n\
          \    return result\n\n\ndef normalize_key(value: Any) -> str:\n    return\
          \ re.sub(r\"[\\s_\\-]+\", \"\", str(value or \"\").strip().lower())\n\n\n\
          def find_first_value(obj: Any, aliases: list) -> Any:\n    \"\"\"递归查找第一个匹配字段，兼容中英文键名和嵌套对象。\"\
          \"\"\n    alias_set = {normalize_key(alias) for alias in aliases}\n\n  \
          \  if isinstance(obj, dict):\n        for key, value in obj.items():\n \
          \           if normalize_key(key) in alias_set and value not in [None, \"\
          \", []]:\n                return value\n\n        for value in obj.values():\n\
          \            found = find_first_value(value, aliases)\n            if found\
          \ not in [None, \"\", []]:\n                return found\n\n    elif isinstance(obj,\
          \ list):\n        for item in obj:\n            found = find_first_value(item,\
          \ aliases)\n            if found not in [None, \"\", []]:\n            \
          \    return found\n\n    return None\n\n\ndef normalize_cve_id(value: Any)\
          \ -> str:\n    text = str(value or \"\").strip().upper()\n    match = re.search(r\"\
          CVE-\\d{4}-\\d{4,}\", text, flags=re.IGNORECASE)\n    return match.group(0).upper()\
          \ if match else text\n\n\ndef is_yes(value: Any) -> bool:\n    if isinstance(value,\
          \ bool):\n        return value\n\n    text = str(value or \"\").strip().lower()\n\
          \    return text in [\n        \"是\",\n        \"yes\",\n        \"true\"\
          ,\n        \"1\",\n        \"y\",\n        \"已列入\",\n        \"included\"\
          ,\n        \"kev\",\n    ]\n\n\ndef is_no(value: Any) -> bool:\n    if isinstance(value,\
          \ bool):\n        return not value\n\n    text = str(value or \"\").strip().lower()\n\
          \    return text in [\n        \"否\",\n        \"no\",\n        \"false\"\
          ,\n        \"0\",\n        \"n\",\n        \"未列入\",\n        \"not included\"\
          ,\n    ]\n\n\ndef compact_value(value: Any, limit: int = 2000) -> Any:\n\
          \    if isinstance(value, (dict, list)):\n        text = json.dumps(value,\
          \ ensure_ascii=False)\n        return text[:limit]\n    return str(value\
          \ or \"\")[:limit]\n\n\n# =========================\n# 2. 查询状态与 CVE 状态\n\
          # =========================\n\n\ndef detect_tool_failure(data: Any) -> dict:\n\
          \    \"\"\"\n    区分：\n    - 工具失败\n    - 查询成功但无记录\n    - 正常业务结果\n\n    返回：\n\
          \    {\n        \"failed\": bool,\n        \"no_record\": bool,\n      \
          \  \"error_code\": str,\n        \"error_message\": str\n    }\n    \"\"\
          \"\n    result = {\n        \"failed\": False,\n        \"no_record\": False,\n\
          \        \"error_code\": \"\",\n        \"error_message\": \"\",\n    }\n\
          \n    if data is None:\n        result[\"no_record\"] = True\n        result[\"\
          error_message\"] = \"工具未返回任何结果。\"\n        return result\n\n    if not isinstance(data,\
          \ dict):\n        text = str(data or \"\").strip().lower()\n        if not\
          \ text:\n            result[\"no_record\"] = True\n            result[\"\
          error_message\"] = \"工具返回为空。\"\n        elif any(keyword in text for keyword\
          \ in [\n            \"error\",\n            \"failed\",\n            \"\
          exception\",\n            \"timeout\",\n            \"超时\",\n          \
          \  \"失败\",\n            \"异常\",\n            \"不可用\",\n        ]):\n   \
          \         result[\"failed\"] = True\n            result[\"error_message\"\
          ] = str(data)[:500]\n        return result\n\n    code = find_first_value(data,\
          \ [\n        \"response_code\",\n        \"error_code\",\n        \"status_code\"\
          ,\n        \"code\",\n        \"错误码\",\n        \"状态码\",\n    ])\n\n   \
          \ message = find_first_value(data, [\n        \"verbose_msg\",\n       \
          \ \"error_message\",\n        \"error\",\n        \"message\",\n       \
          \ \"msg\",\n        \"detail\",\n        \"错误信息\",\n        \"异常信息\",\n\
          \    ])\n\n    status = find_first_value(data, [\n        \"query_status\"\
          ,\n        \"status\",\n        \"result_status\",\n        \"查询状态\",\n\
          \        \"状态\",\n    ])\n\n    result[\"error_code\"] = str(code or \"\"\
          )\n    result[\"error_message\"] = str(message or \"\")\n\n    code_text\
          \ = str(code or \"\").strip().lower()\n    message_text = str(message or\
          \ \"\").strip().lower()\n    status_text = str(status or \"\").strip().lower()\n\
          \n    success_codes = {\"0\", \"200\", \"10000\", \"success\", \"ok\"}\n\
          \    failure_statuses = {\n        \"failed\",\n        \"failure\",\n \
          \       \"error\",\n        \"timeout\",\n        \"unavailable\",\n   \
          \     \"tool_failed\",\n        \"查询失败\",\n        \"失败\",\n        \"异常\"\
          ,\n    }\n\n    if code not in [None, \"\"] and code_text not in success_codes:\n\
          \        # CVE 编号中的数字不会进入 code 字段，因此这里可以直接判断。\n        try:\n          \
          \  numeric_code = int(float(code_text))\n            if numeric_code not\
          \ in [0, 200, 10000]:\n                result[\"failed\"] = True\n     \
          \   except Exception:\n            if code_text not in success_codes:\n\
          \                result[\"failed\"] = True\n\n    if status_text in failure_statuses:\n\
          \        result[\"failed\"] = True\n\n    if any(keyword in message_text\
          \ for keyword in [\n        \"query failed\",\n        \"request failed\"\
          ,\n        \"server unavailable\",\n        \"timeout\",\n        \"rate\
          \ limit\",\n        \"quota\",\n        \"查询失败\",\n        \"请求失败\",\n \
          \       \"服务不可用\",\n        \"超时\",\n        \"限额\",\n        \"配额\",\n\
          \        \"异常\",\n    ]):\n        result[\"failed\"] = True\n\n    no_record_markers\
          \ = [\n        \"not found\",\n        \"no record\",\n        \"no data\"\
          ,\n        \"不存在\",\n        \"未找到\",\n        \"无记录\",\n        \"暂无数据\"\
          ,\n    ]\n\n    if not result[\"failed\"] and any(marker in message_text\
          \ for marker in no_record_markers):\n        result[\"no_record\"] = True\n\
          \n    return result\n\n\ndef classify_vulnerability_status(status: Any)\
          \ -> dict:\n    \"\"\"\n    将 NVD/CVE 状态拆分为：\n    - analyzed：已完成分析\n   \
          \ - pending_enrichment：已收录但待富化/评分\n    - rejected：已驳回\n    - reserved：已保留编号但信息不足\n\
          \    - disputed：存在争议\n    - unknown：无法识别\n\n    Received 不表示 CVE 无效，只表示已接收、尚未完成富化分析。\n\
          \    \"\"\"\n    raw = str(status or \"\").strip()\n    text = raw.lower()\n\
          \n    if text in [\"rejected\", \"reject\", \"已驳回\", \"驳回\"]:\n        return\
          \ {\n            \"record_state\": \"rejected\",\n            \"is_valid_vulnerability\"\
          : False,\n            \"needs_enrichment\": False,\n            \"status_explanation\"\
          : \"该 CVE 已被驳回，不应按有效漏洞进行风险处置。\",\n        }\n\n    if text in [\n      \
          \  \"received\",\n        \"awaiting analysis\",\n        \"awaiting_analysis\"\
          ,\n        \"undergoing analysis\",\n        \"undergoing_analysis\",\n\
          \        \"pending\",\n        \"待分析\",\n        \"分析中\",\n        \"已接收\"\
          ,\n    ]:\n        return {\n            \"record_state\": \"pending_enrichment\"\
          ,\n            \"is_valid_vulnerability\": True,\n            \"needs_enrichment\"\
          : True,\n            \"status_explanation\": (\n                \"该 CVE\
          \ 已被漏洞库接收，但尚未完成评分或富化分析；\"\n                \"这不表示漏洞无效，也不表示不存在风险。\"\n   \
          \         ),\n        }\n\n    if text in [\"reserved\", \"reserve\", \"\
          已保留\", \"保留\"]:\n        return {\n            \"record_state\": \"reserved\"\
          ,\n            \"is_valid_vulnerability\": None,\n            \"needs_enrichment\"\
          : True,\n            \"status_explanation\": (\n                \"该 CVE\
          \ 编号处于 Reserved 状态，公开漏洞细节可能尚不完整，\"\n                \"应继续跟踪 CNA 或厂商公告。\"\
          \n            ),\n        }\n\n    if text in [\"disputed\", \"有争议\", \"\
          争议\"]:\n        return {\n            \"record_state\": \"disputed\",\n\
          \            \"is_valid_vulnerability\": None,\n            \"needs_enrichment\"\
          : True,\n            \"status_explanation\": \"该 CVE 存在争议，需要结合 CNA、厂商公告和修复提交核验。\"\
          ,\n        }\n\n    if text in [\n        \"analyzed\",\n        \"modified\"\
          ,\n        \"published\",\n        \"active\",\n        \"confirmed\",\n\
          \        \"已分析\",\n        \"已发布\",\n        \"有效\",\n    ]:\n        return\
          \ {\n            \"record_state\": \"analyzed\",\n            \"is_valid_vulnerability\"\
          : True,\n            \"needs_enrichment\": False,\n            \"status_explanation\"\
          : \"该 CVE 已进入正式分析或发布状态。\",\n        }\n\n    # 状态缺失，但只要业务数据中存在描述、产品或修复信息，仍可作为有效记录。\n\
          \    return {\n        \"record_state\": \"unknown\",\n        \"is_valid_vulnerability\"\
          : None,\n        \"needs_enrichment\": False,\n        \"status_explanation\"\
          : \"工具未返回可识别的漏洞状态，需要结合原始记录进一步核验。\",\n    }\n\n\n# =========================\n\
          # 3. 风险等级映射\n# =========================\n\n\ndef rank_to_level(rank: int)\
          \ -> str:\n    if rank >= 5:\n        return \"严重风险\"\n    if rank == 4:\n\
          \        return \"高风险\"\n    if rank == 3:\n        return \"中风险\"\n   \
          \ if rank == 2:\n        return \"低风险\"\n    if rank == 1:\n        return\
          \ \"无明显风险\"\n    return \"未知\"\n\n\ndef cvss_to_rank(score: Any) -> int:\n\
          \    \"\"\"\n    CVSS 分数映射：\n    9.0 - 10.0 严重风险\n    7.0 - 8.9  高风险\n \
          \   4.0 - 6.9  中风险\n    0.1 - 3.9  低风险\n\n    无评分、0.0、N/A 均返回 0（未知），不能解释为低风险或无风险。\n\
          \    \"\"\"\n    score_value = as_float_or_none(score)\n\n    if score_value\
          \ is None:\n        return 0\n    if score_value >= 9.0:\n        return\
          \ 5\n    if score_value >= 7.0:\n        return 4\n    if score_value >=\
          \ 4.0:\n        return 3\n    return 2\n\n\ndef severity_to_rank(severity:\
          \ Any) -> int:\n    text = str(severity or \"\").strip().lower()\n\n   \
          \ if not text or text in [\n        \"n/a\",\n        \"na\",\n        \"\
          none\",\n        \"unknown\",\n        \"unscored\",\n        \"未评分\",\n\
          \        \"未知\",\n        \"暂无\",\n    ]:\n        return 0\n\n    if any(keyword\
          \ in text for keyword in [\"严重\", \"critical\", \"超危\"]):\n        return\
          \ 5\n    if any(keyword in text for keyword in [\"高危\", \"high\"]):\n  \
          \      return 4\n    if any(keyword in text for keyword in [\"中危\", \"medium\"\
          ]):\n        return 3\n    if any(keyword in text for keyword in [\"低危\"\
          , \"low\"]):\n        return 2\n    if any(keyword in text for keyword in\
          \ [\"无风险\", \"informational\", \"info\"]):\n        return 1\n\n    return\
          \ 0\n\n\ndef parse_cvss_vector(vector: Any) -> dict:\n    \"\"\"解析 CVSS\
          \ v3.x 向量。\"\"\"\n    text = str(vector or \"\").strip()\n    result = {}\n\
          \n    if not text or text.lower() in [\"n/a\", \"none\", \"unknown\"]:\n\
          \        return result\n\n    for part in text.split(\"/\"):\n        if\
          \ \":\" not in part:\n            continue\n\n        key, value = part.split(\"\
          :\", 1)\n        key = key.strip()\n        value = value.strip()\n\n  \
          \      if key == \"CVSS\":\n            result[\"version\"] = value\n  \
          \      else:\n            result[key] = value\n\n    return result\n\n\n\
          def cvss_metric_cn(metric: str, value: str) -> str:\n    mapping = {\n \
          \       \"AV\": {\n            \"N\": \"网络可达\",\n            \"A\": \"相邻网络\"\
          ,\n            \"L\": \"本地\",\n            \"P\": \"物理接触\",\n        },\n\
          \        \"AC\": {\n            \"L\": \"攻击复杂度低\",\n            \"H\": \"\
          攻击复杂度高\",\n        },\n        \"PR\": {\n            \"N\": \"无需权限\",\n\
          \            \"L\": \"低权限\",\n            \"H\": \"高权限\",\n        },\n\
          \        \"UI\": {\n            \"N\": \"无需用户交互\",\n            \"R\": \"\
          需要用户交互\",\n        },\n        \"S\": {\n            \"U\": \"影响范围不变\",\n\
          \            \"C\": \"影响范围改变\",\n        },\n        \"C\": {\n        \
          \    \"H\": \"机密性影响高\",\n            \"L\": \"机密性影响低\",\n            \"\
          N\": \"机密性无影响\",\n        },\n        \"I\": {\n            \"H\": \"完整性影响高\"\
          ,\n            \"L\": \"完整性影响低\",\n            \"N\": \"完整性无影响\",\n    \
          \    },\n        \"A\": {\n            \"H\": \"可用性影响高\",\n            \"\
          L\": \"可用性影响低\",\n            \"N\": \"可用性无影响\",\n        },\n    }\n\n\
          \    return mapping.get(metric, {}).get(value, f\"{metric}:{value}\")\n\n\
          \ndef cvss_vector_to_context(vector: Any, vector_interpretation: Any = None)\
          \ -> dict:\n    \"\"\"\n    根据 CVSS 利用条件评估“利用上下文风险”。\n\n    修复点：\n    -\
          \ C/I/A 的高影响属于漏洞主体严重性，不再单独把上下文抬到高风险；\n    - 本地、低权限漏洞不会仅因为影响高就被判为高上下文风险；\n\
          \    - 远程 + 低复杂度 + 无需权限，才提升为高上下文优先级。\n    \"\"\"\n    metrics = parse_cvss_vector(vector)\n\
          \    context_rank = 0\n    findings = []\n\n    av = metrics.get(\"AV\"\
          )\n    ac = metrics.get(\"AC\")\n    pr = metrics.get(\"PR\")\n    ui =\
          \ metrics.get(\"UI\")\n\n    if av == \"N\":\n        context_rank = max(context_rank,\
          \ 2)\n        findings.append(\"攻击向量为网络，可远程触达。\")\n    elif av == \"A\"\
          :\n        findings.append(\"攻击需要位于相邻网络。\")\n    elif av == \"L\":\n   \
          \     findings.append(\"攻击向量为本地，通常需要先获得本地执行或登录条件。\")\n    elif av == \"\
          P\":\n        findings.append(\"攻击需要物理接触。\")\n\n    if ac == \"L\":\n  \
          \      context_rank = max(context_rank, 2)\n        findings.append(\"攻击复杂度低。\"\
          )\n    elif ac == \"H\":\n        findings.append(\"攻击复杂度高。\")\n\n    if\
          \ pr == \"N\":\n        context_rank = max(context_rank, 2)\n        findings.append(\"\
          利用无需预先权限。\")\n    elif pr == \"L\":\n        findings.append(\"利用需要低权限。\"\
          )\n    elif pr == \"H\":\n        findings.append(\"利用需要高权限。\")\n\n    if\
          \ ui == \"N\":\n        context_rank = max(context_rank, 2)\n        findings.append(\"\
          利用无需用户交互。\")\n    elif ui == \"R\":\n        findings.append(\"利用需要用户交互。\"\
          )\n\n    if metrics.get(\"S\") == \"C\":\n        findings.append(\"影响范围发生改变，可能影响安全边界外组件。\"\
          )\n\n    high_impact_count = sum(\n        1 for metric in [\"C\", \"I\"\
          , \"A\"] if metrics.get(metric) == \"H\"\n    )\n    if high_impact_count\
          \ >= 2:\n        findings.append(\"机密性、完整性、可用性中至少两项为高影响。\")\n    elif high_impact_count\
          \ == 1:\n        findings.append(\"机密性、完整性、可用性中存在一项高影响。\")\n\n    if av\
          \ == \"N\" and ac == \"L\" and pr == \"N\":\n        context_rank = max(context_rank,\
          \ 4)\n        findings.append(\"具备远程、低复杂度、无需权限的高优先级利用条件。\")\n    elif av\
          \ == \"N\" and ac == \"L\":\n        context_rank = max(context_rank, 3)\n\
          \        findings.append(\"具备远程、低复杂度利用条件，但仍需结合权限和交互要求判断。\")\n\n    metric_summary\
          \ = []\n    for metric in [\"AV\", \"AC\", \"PR\", \"UI\", \"S\", \"C\"\
          , \"I\", \"A\"]:\n        if metric in metrics:\n            metric_summary.append(cvss_metric_cn(metric,\
          \ metrics.get(metric)))\n\n    if isinstance(vector_interpretation, dict):\n\
          \        for key, value in vector_interpretation.items():\n            if\
          \ value not in [None, \"\"]:\n                metric_summary.append(f\"\
          {key}：{value}\")\n\n    return {\n        \"context_rank\": context_rank,\n\
          \        \"context_level\": rank_to_level(context_rank),\n        \"metrics\"\
          : metrics,\n        \"metric_summary\": dedupe_list(metric_summary),\n \
          \       \"findings\": dedupe_list(findings),\n    }\n\n\ndef keyword_hit(text:\
          \ str, keyword: str) -> bool:\n    text = str(text or \"\").lower()\n  \
          \  keyword_lower = str(keyword or \"\").lower().strip()\n\n    if not text\
          \ or not keyword_lower:\n        return False\n\n    if keyword_lower in\
          \ [\"rce\", \"dos\", \"c2\", \"poc\"]:\n        return (\n            re.search(\n\
          \                rf\"(?<![a-z0-9]){re.escape(keyword_lower)}(?![a-z0-9])\"\
          ,\n                text,\n                flags=re.IGNORECASE,\n       \
          \     )\n            is not None\n        )\n\n    return keyword_lower\
          \ in text\n\n\ndef description_to_context(description: Any) -> dict:\n \
          \   \"\"\"\n    从漏洞类型提取处置优先级线索。\n\n    仅作为辅助信息，不代表已经存在 PoC、在野利用或可达资产。\n\
          \    因此关键词本身最多提高到中风险，不直接给出高/严重上下文风险。\n    \"\"\"\n    text = str(description\
          \ or \"\").lower()\n    rank = 0\n    findings = []\n\n    keyword_rules\
          \ = [\n        (3, [\"remote code execution\", \"rce\", \"远程代码执行\", \"命令执行\"\
          ]),\n        (3, [\"authentication bypass\", \"认证绕过\", \"身份验证绕过\"]),\n \
          \       (3, [\"supply chain\", \"供应链\", \"backdoor\", \"后门\", \"投毒\"]),\n\
          \        (2, [\"privilege escalation\", \"提权\", \"权限提升\"]),\n        (2,\
          \ [\"information disclosure\", \"信息泄露\", \"敏感信息泄露\"]),\n        (2, [\"\
          denial of service\", \"dos\", \"拒绝服务\"]),\n    ]\n\n    for level, keywords\
          \ in keyword_rules:\n        for keyword in keywords:\n            if keyword_hit(text,\
          \ keyword):\n                rank = max(rank, level)\n                findings.append(\n\
          \                    f\"漏洞描述包含高关注漏洞类型：{keyword}；\"\n                   \
          \ \"该信息不等同于已存在公开利用或在野利用。\"\n                )\n                break\n\n\
          \    return {\n        \"context_rank\": rank,\n        \"context_level\"\
          : rank_to_level(rank),\n        \"findings\": dedupe_list(findings),\n \
          \   }\n\n\ndef normalize_boolean_signal(value: Any) -> Any:\n    if value\
          \ in [None, \"\"]:\n        return None\n    if is_yes(value):\n       \
          \ return True\n    if is_no(value):\n        return False\n    return None\n\
          \n\ndef exploitation_signals_to_context(data: Any) -> dict:\n    \"\"\"\
          提取 KEV、在野利用、公开 PoC、EPSS 等明确利用信号。\"\"\"\n    kev_value = find_first_value(data,\
