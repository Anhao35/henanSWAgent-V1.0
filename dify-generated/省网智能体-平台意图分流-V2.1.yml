    - data:
        code: "import re\nfrom typing import Any, Dict\n\n\ndef to_text(value: Any)\
          \ -> str:\n    if value is None:\n        return \"\"\n\n    return str(value).replace(\"\
          \\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n\ndef extract_after_last_think(text:\
          \ str) -> str:\n    \"\"\"\n    如果存在完整的 </think>，优先提取最后一个结束标签之后的正式正文。\n\n\
          \    这样可以处理：\n    </think># 多源威胁情报综合研判报告\n    结束标签后没有换行的情况。\n    \"\"\"\n\
          \    closing_matches = list(\n        re.finditer(\n            r\"</think\\\
          s*>\",\n            text,\n            flags=re.IGNORECASE\n        )\n\
          \    )\n\n    if not closing_matches:\n        return \"\"\n\n    last_match\
          \ = closing_matches[-1]\n    return text[last_match.end():].strip()\n\n\n\
          def remove_complete_think_blocks(text: str) -> str:\n    \"\"\"\n    删除所有完整的\
          \ <think>...</think> 区块。\n    \"\"\"\n    return re.sub(\n        r\"<think\\\
          b[^>]*>[\\s\\S]*?</think\\s*>\",\n        \"\",\n        text,\n       \
          \ flags=re.IGNORECASE\n    ).strip()\n\n\ndef remove_remaining_think_tags(text:\
          \ str) -> str:\n    \"\"\"\n    清除可能残留的单独 think 标签。\n    \"\"\"\n    text\
          \ = re.sub(\n        r\"<think\\b[^>]*>\",\n        \"\",\n        text,\n\
          \        flags=re.IGNORECASE\n    )\n\n    text = re.sub(\n        r\"</think\\\
          s*>\",\n        \"\",\n        text,\n        flags=re.IGNORECASE\n    )\n\
          \n    return text.strip()\n\n\ndef extract_report_by_title(text: str) ->\
          \ str:\n    \"\"\"\n    当模型只输出了 <think> 开始标签却没有输出 </think> 时，\n    尝试从正式报告标题开始截取。\n\
          \n    使用带 # 的正式标题，避免误截取推理过程中提到的普通文字。\n    \"\"\"\n    title_patterns = [\n\
          \        r\"(?m)^#\\s*多源威胁情报综合研判报告\\s*$\",\n        r\"(?m)^#\\s*威胁情报查询结果(?:（降级模式）)?\\\
          s*$\",\n        r\"(?m)^##?\\s*多源威胁情报综合研判报告\\s*$\"\n    ]\n\n    positions\
          \ = []\n\n    for pattern in title_patterns:\n        match = re.search(\n\
          \            pattern,\n            text,\n            flags=re.IGNORECASE\n\
          \        )\n\n        if match:\n            positions.append(match.start())\n\
          \n    if not positions:\n        return \"\"\n\n    return text[min(positions):].strip()\n\
          \n\ndef strip_outer_markdown_fence(text: str) -> str:\n    \"\"\"\n    如果整个回答被模型包在\
          \ markdown 代码块中，则去除最外层围栏。\n    内部的 echarts 代码块不会被影响。\n    \"\"\"\n    text\
          \ = text.strip()\n\n    if text.lower().startswith(\"```markdown\"):\n \
          \       text = text[len(\"```markdown\"):].lstrip(\"\\n\")\n\n        if\
          \ text.endswith(\"```\"):\n            text = text[:-3]\n\n    return text.strip()\n\
          \n\ndef main(raw_text: str = \"\") -> Dict[str, str]:\n    \"\"\"\n    清除最终\
          \ LLM 输出中的推理标签，只保留正式报告正文。\n\n    输出字段：\n    cleaned_text: String\n    \"\
          \"\"\n\n    original_text = to_text(raw_text)\n\n    if not original_text:\n\
          \        return {\n            \"cleaned_text\": (\n                \"最终总结模型调用成功，但没有返回可展示的正文内容。\"\
          \n                \"请检查模型输出和最终回答变量绑定。\"\n            )\n        }\n\n  \
          \  # 第一优先级：存在 </think> 时，直接取最后一个结束标签之后的内容。\n    cleaned_text = extract_after_last_think(original_text)\n\
          \n    # 第二优先级：删除完整的 think 区块。\n    if not cleaned_text:\n        cleaned_text\
          \ = remove_complete_think_blocks(original_text)\n\n    # 第三优先级：模型可能只输出了\
          \ <think>，没有正常闭合。\n    # 此时从正式 Markdown 报告标题开始截取。\n    if (\n        not\
          \ cleaned_text\n        or cleaned_text.lower().startswith(\"<think\")\n\
          \    ):\n        report_text = extract_report_by_title(original_text)\n\n\
          \        if report_text:\n            cleaned_text = report_text\n\n   \
          \ cleaned_text = remove_remaining_think_tags(cleaned_text)\n    cleaned_text\
          \ = strip_outer_markdown_fence(cleaned_text)\n\n    # 清理过多空行。\n    cleaned_text\
          \ = re.sub(\n        r\"\\n{4,}\",\n        \"\\n\\n\\n\",\n        cleaned_text\n\
          \    ).strip()\n\n    if not cleaned_text:\n        cleaned_text = (\n \
          \           \"最终总结模型已返回数据，但清理推理内容后未发现正式报告正文。\"\n            \"请重新运行，或检查模型是否只生成了思考过程。\"\
          \n        )\n\n    return {\n        \"cleaned_text\": cleaned_text\n  \
          \  }"
        code_language: python3
