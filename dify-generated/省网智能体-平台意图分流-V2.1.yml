    - data:
        code: "import json\nimport re\n\nATTACK_ID_RE = re.compile(r\"\\bT\\d{4}(?:.\\\
          d{3})?\\b\", re.IGNORECASE)\nIPV4_RE = re.compile(r\"^(?:\\d{1,3}.){3}\\\
          d{1,3}$\")\nDOMAIN_RE = re.compile(\n    r\"^(?=.{1,253}$)(?!-)(?:[a-zA-Z0-9-]{1,63}.)+[a-zA-Z]{2,63}$\"\
          \n)\n\n# 常见文件 Hash：MD5 / SHA1 / SHA256 / SHA512\nHASH_LENGTH_TO_TYPE = {\n\
          \    32: \"md5\",\n    40: \"sha1\",\n    64: \"sha256\",\n    128: \"sha512\"\
          ,\n}\n\n# 从用户原始输入中确定性提取常见文件 Hash。\n# 长度必须按照从长到短的顺序排列，避免从 SHA512 或 SHA256\n\
          # 中错误截取较短的 SHA1、MD5。\n# 两侧使用十六进制字符边界，而不是 \\b：\n# 1. 支持“查询2a734e...”这种中文与\
          \ Hash 直接相连的输入；\n# 2. 防止从更长的十六进制字符串中截取部分内容。\nHASH_TEXT_RE = re.compile(\n\
          \    r\"(?<![a-fA-F0-9])\"\n    r\"(?:\"\n    r\"[a-fA-F0-9]{128}\"\n  \
          \  r\"|[a-fA-F0-9]{64}\"\n    r\"|[a-fA-F0-9]{40}\"\n    r\"|[a-fA-F0-9]{32}\"\
          \n    r\")\"\n    r\"(?![a-fA-F0-9])\"\n)\n\n\ndef extract_json_object(text):\n\
          \    \"\"\"\n    兼容以下几类 Agent 输出：\n    1. 直接 JSON 字符串\n    2. {\"text\"\
          : \"...\"} 包了一层\n    3. `json ... ` 代码块\n    4. 前后带解释文字，中间包含 JSON 对象\n \
          \   \"\"\"\n    if not text:\n        return {}\n\n    text = str(text).strip()\n\
          \n    # 兼容 Agent 输出是 {\"text\": \"...\"} 的情况\n    try:\n        obj = json.loads(text)\n\
          \        if isinstance(obj, dict) and isinstance(obj.get(\"text\"), str):\n\
          \            inner = obj.get(\"text\", \"\").strip()\n            try:\n\
          \                return json.loads(inner)\n            except Exception:\n\
          \                return obj\n        return obj\n    except Exception:\n\
          \        pass\n\n    # 去除 markdown 代码块\n    text = re.sub(r\"^```json\\\
          s*\", \"\", text, flags=re.IGNORECASE)\n    text = re.sub(r\"^```\\s*\"\
          , \"\", text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n\n    # 从文本中截取\
          \ JSON 对象\n    start = text.find(\"{\")\n    end = text.rfind(\"}\")\n\n\
          \    if start >= 0 and end > start:\n        try:\n            return json.loads(text[start:end\
          \ + 1])\n        except Exception:\n            return {}\n\n    return\
          \ {}\n\n\ndef dedupe_list(items):\n    \"\"\"\n    去重并保持原顺序。\n    \"\"\"\
          \n    if not isinstance(items, list):\n        return []\n\n    result =\
          \ []\n    seen = set()\n\n    for item in items:\n        value = str(item).strip()\n\
          \        if not value:\n            continue\n\n        key = value.lower()\n\
          \        if key in seen:\n            continue\n\n        seen.add(key)\n\
          \        result.append(value)\n\n    return result\n\n\ndef first_item(items):\n\
          \    if isinstance(items, list) and len(items) > 0:\n        return str(items[0])\n\
          \    return \"\"\n\n\ndef is_valid_ipv4(ip):\n    \"\"\"\n    校验 IPv4，避免\
          \ 999.999.999.999 这类伪 IP。\n    \"\"\"\n    if not ip:\n        return False\n\
          \n    ip = str(ip).strip()\n\n    if not IPV4_RE.fullmatch(ip):\n      \
          \  return False\n\n    parts = ip.split(\".\")\n    for part in parts:\n\
          \        try:\n            number = int(part)\n        except Exception:\n\
          \            return False\n\n        if number < 0 or number > 255:\n  \
          \          return False\n\n    return True\n\n\ndef is_attack_id(value):\n\
          \    \"\"\"\n    判断是否为 ATT&CK 技术编号，例如 T1059、T1059.001。\n    \"\"\"\n   \
          \ if not value:\n        return False\n\n    return bool(ATTACK_ID_RE.fullmatch(str(value).strip()))\n\
          \n\ndef extract_attack_ids_from_text(text):\n    \"\"\"\n    从用户输入、route_plan_json、router_result\
          \ 中抽取 ATT&CK 编号。\n    \"\"\"\n    if not text:\n        return []\n\n  \
          \  ids = ATTACK_ID_RE.findall(str(text))\n    return dedupe_list([x.upper()\
          \ for x in ids])\n\n\ndef is_valid_domain(domain):\n    \"\"\"\n    过滤伪域名：\n\
          \    1. Dify 多模态占位符：1779195036236.multimodal\n    2. ATT&CK 编号：T1059.001\n\
          \    3. IPv4：8.8.8.8\n    4. localhost/local\n    5. 非标准域名格式\n    \"\"\"\
          \n    if not domain:\n        return False\n\n    d = str(domain).strip().lower()\n\
          \n    if not d:\n        return False\n\n    # 过滤 Dify 多模态/文件占位符\n    if\
          \ d.endswith(\".multimodal\"):\n        return False\n\n    # 过滤纯数字 + .multimodal\n\
          \    if d.replace(\".multimodal\", \"\").isdigit():\n        return False\n\
          \n    # 过滤本地域名\n    if d in [\"localhost\", \"local\"]:\n        return\
          \ False\n\n    if d.endswith(\".local\") or d.endswith(\".localhost\"):\n\
          \        return False\n\n    # 过滤 ATT&CK 编号，避免 T1059.001 被当成域名\n    if is_attack_id(d):\n\
          \        return False\n\n    # 过滤 IP 被误当成 domain\n    if is_valid_ipv4(d):\n\
          \        return False\n\n    # 过滤明显不是域名的内容\n    if \"/\" in d or \"\\\\\"\
          \ in d or \" \" in d:\n        return False\n\n    # 保留标准域名\n    if not\
          \ DOMAIN_RE.fullmatch(d):\n        return False\n\n    return True\n\n\n\
          def filter_ips(ip_list):\n    ip_list = dedupe_list(ip_list)\n    return\
          \ [ip for ip in ip_list if is_valid_ipv4(ip)]\n\n\ndef filter_domains(domain_list):\n\
          \    domain_list = dedupe_list(domain_list)\n    return [d for d in domain_list\
          \ if is_valid_domain(d)]\n\n\ndef filter_urls(url_list):\n    \"\"\"\n \
          \   URL 简单过滤：\n    1. 去重\n    2. 保留 http:// 或 https:// 开头的 URL\n    3. 过滤\
          \ .multimodal 占位内容\n    \"\"\"\n    url_list = dedupe_list(url_list)\n \
          \   result = []\n\n    for url in url_list:\n        u = str(url).strip()\n\
          \n        if not u:\n            continue\n\n        lower_u = u.lower()\n\
          \n        if \".multimodal\" in lower_u:\n            continue\n\n     \
          \   if lower_u.startswith(\"http://\") or lower_u.startswith(\"https://\"\
          ):\n            result.append(u)\n\n    return result\n\n\ndef filter_cves(cve_list):\n\
          \    cve_list = dedupe_list(cve_list)\n    result = []\n\n    for cve in\
          \ cve_list:\n        value = str(cve).strip().upper()\n        if re.fullmatch(r\"\
          CVE-\\d{4}-\\d{4,}\", value):\n            result.append(value)\n\n    return\
          \ result\n\n\ndef get_hash_type(hash_value):\n    \"\"\"\n    根据十六进制字符串长度识别常见\
          \ Hash 类型：\n    32=MD5、40=SHA1、64=SHA256、128=SHA512。\n    无法识别时返回空字符串。\n\
          \    \"\"\"\n    if not hash_value:\n        return \"\"\n\n    value =\
          \ str(hash_value).strip()\n\n    if not re.fullmatch(r\"[a-fA-F0-9]+\",\
          \ value):\n        return \"\"\n\n    return HASH_LENGTH_TO_TYPE.get(len(value),\
          \ \"\")\n\n\ndef is_valid_hash(hash_value):\n    \"\"\"\n    校验常见文件 Hash，防止普通文本误触发\
          \ Hash 分支。\n    \"\"\"\n    return bool(get_hash_type(hash_value))\n\n\n\
          def filter_hashes(hash_list):\n    \"\"\"\n    过滤并规范化 Hash：\n    1. 仅保留\
          \ MD5、SHA1、SHA256、SHA512；\n    2. 转为小写，便于去重和传给下游工具；\n    3. 保持原始顺序。\n  \
          \  \"\"\"\n    if not isinstance(hash_list, list):\n        return []\n\n\
          \    result = []\n    seen = set()\n\n    for hash_value in hash_list:\n\
          \        value = str(hash_value).strip().lower()\n\n        if not is_valid_hash(value):\n\
          \            continue\n\n        if value in seen:\n            continue\n\
          \n        seen.add(value)\n        result.append(value)\n\n    return result\n\
          \n\ndef extract_hashes_from_text(text):\n    \"\"\"\n    从用户原始查询中确定性提取常见文件\
          \ Hash。\n    支持：\n    1. MD5：32 位十六进制字符串；\n    2. SHA1：40 位十六进制字符串；\n  \
          \  3. SHA256：64 位十六进制字符串；\n    4. SHA512：128 位十六进制字符串。\n\n    示例：\n    查询2a734e2189ad40fdd8ad7d5a96cc85f6f4ed3bc1\n\
          \n    即使路由 Agent 没有识别到该 SHA1，\n    本函数也会直接从 sys.query 中将其提取出来。\n    \"\"\
          \"\n    if not text:\n        return []\n\n    matches = HASH_TEXT_RE.findall(str(text))\n\
          \n    return filter_hashes(matches)\n\n\ndef normalize_ioc_type(ioc_type):\n\
          \    if not ioc_type:\n        return \"\"\n\n    t = str(ioc_type).strip().lower()\n\
          \n    mapping = {\n        \"ips\": \"ip\",\n        \"ip\": \"ip\",\n \
          \       \"ipv4\": \"ip\",\n\n        \"domains\": \"domain\",\n        \"\
          domain\": \"domain\",\n\n        \"urls\": \"url\",\n        \"url\": \"\
          url\",\n\n        \"cves\": \"cve\",\n        \"cve\": \"cve\",\n\n    \
          \    \"hashes\": \"hash\",\n        \"hash\": \"hash\",\n        \"md5\"\
          : \"hash\",\n        \"sha1\": \"hash\",\n        \"sha-1\": \"hash\",\n\
          \        \"sha256\": \"hash\",\n        \"sha-256\": \"hash\",\n       \
          \ \"sha512\": \"hash\",\n        \"sha-512\": \"hash\",\n    }\n\n    return\
          \ mapping.get(t, t)\n\n\ndef is_valid_route_item(item):\n    \"\"\"\n  \
          \  对 route_plan 中的任务进行二次过滤。\n    重点过滤掉伪 domain 任务，避免域名分支误触发。\n    \"\"\"\
          \n    if not isinstance(item, dict):\n        return False\n\n    ioc_type\
          \ = normalize_ioc_type(\n        item.get(\"ioc_type\") or item.get(\"ioc_type_raw\"\
          )\n    )\n    ioc = str(item.get(\"ioc\") or \"\").strip()\n\n    if not\
          \ ioc:\n        return False\n\n    if ioc_type == \"ip\":\n        return\
          \ is_valid_ipv4(ioc)\n\n    if ioc_type == \"domain\":\n        return is_valid_domain(ioc)\n\
          \n    if ioc_type == \"url\":\n        lower_ioc = ioc.lower()\n       \
          \ if \".multimodal\" in lower_ioc:\n            return False\n        return\
          \ lower_ioc.startswith(\"http://\") or lower_ioc.startswith(\"https://\"\
          )\n\n    if ioc_type == \"cve\":\n        return bool(re.fullmatch(r\"CVE-\\\
          d{4}-\\d{4,}\", ioc.upper()))\n\n    if ioc_type == \"hash\":\n        return\
          \ is_valid_hash(ioc)\n\n    # 其他类型暂时不放行，避免未知类型误触发分支\n    return False\n\n\
          \ndef filter_route_plan(route_plan):\n    \"\"\"\n    过滤 route_plan，同时保留原\
          \ route_plan 项的结构。\n    \"\"\"\n    if not isinstance(route_plan, list):\n\
          \        return []\n\n    result = []\n\n    for item in route_plan:\n \
          \       if not is_valid_route_item(item):\n            continue\n\n    \
          \    # 复制一份，避免直接修改原对象\n        new_item = dict(item)\n\n        # 规范化 ioc_type\n\
          \        new_item[\"ioc_type\"] = normalize_ioc_type(\n            new_item.get(\"\
          ioc_type\") or new_item.get(\"ioc_type_raw\")\n        )\n\n        result.append(new_item)\n\
          \n    return result\n\n\ndef main(arg1: str = \"\", user_query: str = \"\
          \") -> dict:\n    router_result = extract_json_object(arg1)\n\n    if not\
          \ isinstance(router_result, dict):\n        router_result = {}\n\n    iocs\
          \ = router_result.get(\"iocs\") or {}\n    route_plan = router_result.get(\"\
          route_plan\") or []\n\n    # 原始 IOC 列表\n    raw_ip_list = iocs.get(\"ips\"\
          ) or []\n    raw_domain_list = iocs.get(\"domains\") or []\n    raw_url_list\
          \ = iocs.get(\"urls\") or []\n    raw_cve_list = iocs.get(\"cves\") or []\n\
          \    raw_hash_list = iocs.get(\"hashes\") or []\n\n    # 新增：\n    # 不再完全依赖\
          \ Agent 的 Hash 识别结果，\n    # 同时直接从用户原始查询 sys.query 中确定性提取 Hash。\n    query_hash_list\
          \ = extract_hashes_from_text(user_query)\n\n    # 过滤后的 IOC 列表\n    ip_list\
          \ = filter_ips(raw_ip_list)\n    domain_list = filter_domains(raw_domain_list)\n\
          \    url_list = filter_urls(raw_url_list)\n    cve_list = filter_cves(raw_cve_list)\n\
          \    hash_list = filter_hashes(raw_hash_list)\n\n    # 新增：\n    # 合并 Agent\
          \ 已识别 Hash 和用户原始查询中直接提取的 Hash。\n    # 后面还会统一调用 filter_hashes 再次去重和规范化。\n\
          \    hash_list.extend(query_hash_list)\n\n    # 过滤 route_plan，避免伪 domain\
          \ 分支误触发\n    filtered_route_plan = filter_route_plan(route_plan)\n\n   \
          \ # 从 route_plan 中补充 IOC，防止 iocs 字段缺失但 route_plan 有值\n    for item in filtered_route_plan:\n\
          \        ioc_type = normalize_ioc_type(item.get(\"ioc_type\"))\n       \
          \ ioc = str(item.get(\"ioc\") or \"\").strip()\n\n        if ioc_type ==\
          \ \"ip\" and is_valid_ipv4(ioc):\n            ip_list.append(ioc)\n\n  \
          \      elif ioc_type == \"domain\" and is_valid_domain(ioc):\n         \
          \   domain_list.append(ioc)\n\n        elif ioc_type == \"url\":\n     \
          \       lower_ioc = ioc.lower()\n            if lower_ioc.startswith(\"\
          http://\") or lower_ioc.startswith(\"https://\"):\n                url_list.append(ioc)\n\
          \n        elif ioc_type == \"cve\":\n            cve_value = ioc.upper()\n\
          \            if re.fullmatch(r\"CVE-\\d{4}-\\d{4,}\", cve_value):\n    \
          \            cve_list.append(cve_value)\n\n        elif ioc_type == \"hash\"\
          \ and is_valid_hash(ioc):\n            hash_list.append(ioc.lower())\n\n\
          \    # 再次去重\n    ip_list = dedupe_list(ip_list)\n    domain_list = dedupe_list(domain_list)\n\
          \    url_list = dedupe_list(url_list)\n    cve_list = dedupe_list(cve_list)\n\
          \    hash_list = filter_hashes(hash_list)\n\n    # 新增：\n    # 如果 Hash 是直接从\
