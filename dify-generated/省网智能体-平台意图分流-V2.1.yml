          )\n    static_file_summary = collect_anheng_related_risk(related_static_source_files,\
          \ \"related_static_source_files\")\n\n    context_rank = max(\n        download_file_rank,\n\
          \        domain_rank,\n        ip_rank,\n        request_file_summary.get(\"\
          max_rank\", 0),\n        static_file_summary.get(\"max_rank\", 0)\n    )\n\
          \n    context_findings = []\n\n    if isinstance(download_info, dict) and\
