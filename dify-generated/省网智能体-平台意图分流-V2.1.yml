          ] > 0:\n        context_findings.append(f\"关联静态文件数量：{static_summary['count']}，最高\
          \ level={static_summary['max_level']}\")\n\n    high_categories = dedupe_list(comm_summary[\"\
          categories\"] + static_summary[\"categories\"])\n    high_families = dedupe_list(comm_summary[\"\
          families\"] + static_summary[\"families\"])\n\n    if high_categories:\n\
          \        context_findings.append(f\"关联文件类别：{'、'.join(map(str, high_categories[:8]))}\"\
          )\n    if high_families:\n        context_findings.append(f\"关联家族：{'、'.join(map(str,\
          \ high_families[:8]))}\")\n\n    behavior = root.get(\"behavior_profile\"\
          ) or {}\n\n    evidence.update({\n        \"subject_risk_level\": rank_to_level(subject_rank),\n\
          \        \"subject_risk_rank\": subject_rank,\n        \"context_risk_level\"\
          : rank_to_level(context_rank),\n        \"context_risk_rank\": context_rank,\n\
          \        \"confidence\": str(main_intel.get(\"confidence\") or \"medium\"\
          ),\n        \"summary\": summary,\n        \"key_findings\": dedupe_list([\n\
          \            f\"主情报分类：{'、'.join(category_names)}\" if category_names else\
          \ \"\",\n            f\"主情报 level：{main_level}\",\n            f\"标签：{'、'.join(map(str,\
          \ tags))}\" if tags else \"\",\n            f\"ASN：{geolocation.get('asn_number',\
          \ '')} / {geolocation.get('asn_organization', '')}\",\n            f\"地理位置：{geolocation.get('country',\
          \ '')} {geolocation.get('subdivisions', '')} {geolocation.get('city', '')}\"\
          ,\n            *context_findings\n        ]),\n        \"source_specific\"\
          : {\n            \"geolocation\": geolocation,\n            \"main_threat_intel\"\
          : {\n                \"category\": categories,\n                \"level\"\
          : main_level,\n                \"confidence\": main_intel.get(\"confidence\"\
          ),\n                \"tags\": tags,\n                \"is_apt\": is_apt,\n\
          \                \"last_observe_time\": main_intel.get(\"last_observe_time\"\
          ),\n                \"expire_time\": main_intel.get(\"expire_time\")\n \
          \           },\n            \"outbound_threat_intel\": {\n             \
          \   \"category\": outbound.get(\"category\"),\n                \"sub_category\"\
          : outbound.get(\"sub_category\"),\n                \"level\": outbound_level,\n\
