          context_level\"),\n                \"explicit_signal_context_level\": exploitation_context.get(\"\
          context_level\"),\n                \"context_findings\": context_findings,\n\
          \            },\n        },\n        \"raw_compact\": {\n            \"\
          cve_id\": cve_id,\n            \"cvss_score\": cvss_score,\n           \
          \ \"cvss_score_available\": score_available,\n            \"severity\":\
          \ severity,\n            \"published_date\": published_date,\n         \
          \   \"vulnerability_status\": vuln_status,\n            \"record_state\"\
          : status_info[\"record_state\"],\n            \"is_valid_vulnerability\"\
          : status_info[\"is_valid_vulnerability\"],\n            \"needs_enrichment\"\
          : status_info[\"needs_enrichment\"],\n            \"is_in_cisa_kev\": exploitation_context.get(\"\
          is_in_kev\"),\n            \"known_exploited\": exploitation_context.get(\"\
          known_exploited\"),\n            \"poc_available\": exploitation_context.get(\"\
          poc_available\"),\n            \"cvss_vector\": cvss_vector,\n         \
          \   \"vendor\": vendor,\n            \"product\": product,\n           \
          \ \"affected_versions\": affected_versions,\n            \"fixed_versions\"\
          : fixed_versions,\n            \"subject_rank\": subject_rank,\n       \
          \     \"context_rank\": context_rank,\n        },\n    })\n\n    return\
          \ evidence\n\n\n# =========================\n# 5. CVE 融合\n# =========================\n\
          \n\ndef build_cve_fusion(primary_cve: str, evidence_items: list) -> dict:\n\
          \    valid_items = [\n        item\n        for item in evidence_items\n\
          \        if isinstance(item, dict) and item.get(\"query_success\")\n   \
          \ ]\n\n    subject_rank = 0\n    context_rank = 0\n\n    for item in valid_items:\n\
          \        subject_rank = max(subject_rank, as_int(item.get(\"subject_risk_rank\"\
          )))\n        context_rank = max(context_rank, as_int(item.get(\"context_risk_rank\"\
          )))\n\n    final_rank = max(subject_rank, context_rank)\n\n    record_states\
          \ = []\n    for item in valid_items:\n        state = (\n            item.get(\"\
          source_specific\", {}).get(\"record_state\")\n            if isinstance(item.get(\"\
          source_specific\"), dict)\n            else None\n        )\n        if\
          \ state:\n            record_states.append(state)\n\n    all_rejected =\
          \ bool(valid_items) and all(\n        state == \"rejected\" for state in\
          \ record_states\n    ) and len(record_states) == len(valid_items)\n\n  \
          \  has_pending_enrichment = any(\n        state in [\"pending_enrichment\"\
          , \"reserved\", \"disputed\"]\n        for state in record_states\n    )\n\
          \n    has_scored_evidence = any(\n        bool(item.get(\"source_specific\"\
          , {}).get(\"cvss_score_available\"))\n        or bool(item.get(\"source_specific\"\
          , {}).get(\"severity_available\"))\n        for item in valid_items\n  \
          \      if isinstance(item.get(\"source_specific\"), dict)\n    )\n\n   \
          \ conflict_notes = []\n\n    if all_rejected:\n        conflict_notes.append(\"\
          该 CVE 记录已被驳回，不应按有效漏洞处置。\")\n    elif has_pending_enrichment and not has_scored_evidence:\n\
          \        conflict_notes.append(\n            \"该 CVE 已收录但尚未完成评分或富化分析；\"\n\
          \            \"当前风险未知不等于漏洞无效或无需处置。\"\n        )\n    elif subject_rank >=\
          \ 5 and context_rank >= 4:\n        conflict_notes.append(\n           \
          \ \"漏洞本身为严重级，且利用条件或明确利用信号具备高优先级处置特征。\"\n        )\n    elif subject_rank\
          \ >= 5 and context_rank <= 2:\n        conflict_notes.append(\n        \
          \    \"漏洞基础严重度较高，但当前没有明确 KEV、在野利用或公开 PoC 补充信号；\"\n            \"仍应结合资产影响范围安排修复。\"\
          \n        )\n    elif context_rank >= 5:\n        conflict_notes.append(\n\
          \            \"该漏洞存在 KEV 或明确已利用信号，应优先核查资产暴露与修复状态。\"\n        )\n    elif\
          \ subject_rank <= 3 and context_rank >= 4:\n        conflict_notes.append(\n\
          \            \"漏洞基础严重度不是最高，但明确利用信号或利用条件较强，建议提升处置优先级。\"\n        )\n\n  \
          \  source_summaries = [\n        {\n            \"source\": item.get(\"\
          source\"),\n            \"query_status\": item.get(\"query_status\"),\n\
          \            \"subject_risk_level\": item.get(\"subject_risk_level\"),\n\
          \            \"context_risk_level\": item.get(\"context_risk_level\"),\n\
          \            \"summary\": item.get(\"summary\"),\n        }\n        for\
          \ item in valid_items\n    ]\n\n    if not valid_items:\n        risk_reason\
          \ = \"未获得有效 CVE 漏洞情报证据。\"\n    elif all_rejected:\n        risk_reason =\
          \ (\n            \"该 CVE 已被驳回，不应按有效漏洞进入风险处置；\"\n            \"建议保留查询记录并核验用户输入编号。\"\
          \n        )\n    elif final_rank >= 5:\n        risk_reason = \"漏洞基础严重度或明确利用信号达到严重风险级别，应优先处置。\"\
          \n    elif final_rank == 4:\n        risk_reason = \"漏洞达到高风险级别，建议尽快核查受影响资产和补丁状态。\"\
          \n    elif final_rank == 3:\n        risk_reason = (\n            \"漏洞达到中风险级别，需要结合资产暴露面、利用条件和业务重要性\"\
          \n            \"评估处置优先级。\"\n        )\n    elif final_rank == 2:\n     \
          \   risk_reason = (\n            \"漏洞当前表现为低风险或仅有有限上下文信号，\"\n           \
          \ \"仍建议结合资产版本和官方修复信息判断。\"\n        )\n    elif has_pending_enrichment:\n\
          \        risk_reason = (\n            \"该 CVE 已被接收或保留，但尚未获得完整 CVSS 评分或严重等级；\"\
          \n            \"应进入资产版本核验、厂商公告/修复提交比对和持续跟踪流程，\"\n            \"不能解释为漏洞无效或无需处置。\"\
          \n        )\n    else:\n        risk_reason = (\n            \"当前未获得明确风险等级，表示风险尚未定级；\"\
          \n            \"需要结合厂商公告、受影响版本、修复提交和资产情况继续核验。\"\n        )\n\n    return\
          \ {\n        \"ioc\": normalize_cve_id(primary_cve),\n        \"subject_risk_level\"\
          : rank_to_level(subject_rank),\n        \"subject_risk_rank\": subject_rank,\n\
          \        \"context_risk_level\": rank_to_level(context_rank),\n        \"\
          context_risk_rank\": context_rank,\n        \"final_risk_level\": rank_to_level(final_rank),\n\
          \        \"final_risk_rank\": final_rank,\n        \"risk_reason\": risk_reason,\n\
          \        \"evidence_count\": len(valid_items),\n        \"source_summaries\"\
          : source_summaries,\n        \"conflict_notes\": conflict_notes,\n     \
          \   \"record_states\": dedupe_list(record_states),\n        \"all_rejected\"\
          : all_rejected,\n        \"has_pending_enrichment\": has_pending_enrichment,\n\
          \        \"has_scored_evidence\": has_scored_evidence,\n    }\n\n\n# =========================\n\
          # 6. Dify main\n# =========================\n\n\ndef main(\n    primary_cve:\
          \ str = \"\",\n    cve_raw: str = \"\",\n    cve_result_raw: str = \"\"\
          ,\n    cve_result_text: str = \"\",\n    **kwargs,\n) -> dict:\n    \"\"\
          \"\n    Dify 输入变量：\n\n    primary_cve = 解析 route_plan.primary_cve 或当前迭代项\n\
          \    cve_raw     = CVE 查询工具的完整输出\n\n    兼容：cve_result_raw / cve_result_text\
          \ / text1 / result / text。\n    \"\"\"\n    primary_cve = normalize_cve_id(\n\
          \        primary_cve\n        or kwargs.get(\"primary_cve\")\n        or\
          \ kwargs.get(\"cve\")\n        or kwargs.get(\"target_cve\")\n        or\
          \ \"\"\n    )\n\n    cve_input = (\n        cve_raw\n        or cve_result_raw\n\
          \        or cve_result_text\n        or kwargs.get(\"cve_raw\")\n      \
          \  or kwargs.get(\"cve_result_raw\")\n        or kwargs.get(\"cve_result_text\"\
          )\n        or kwargs.get(\"text1\")\n        or kwargs.get(\"result\")\n\
          \        or kwargs.get(\"text\")\n        or \"\"\n    )\n\n    evidence_items\
          \ = []\n\n    if cve_input:\n        cve_evidence = normalize_cve(primary_cve,\
          \ cve_input)\n        evidence_items.append(cve_evidence)\n\n        if\
          \ not primary_cve and cve_evidence.get(\"ioc\"):\n            primary_cve\
          \ = cve_evidence.get(\"ioc\")\n\n    fusion = build_cve_fusion(primary_cve,\
          \ evidence_items)\n\n    bundle = {\n        \"bundle_type\": \"cve_evidence_bundle\"\
          ,\n        \"version\": \"v0.2-cve-status-aware\",\n        \"ioc_type\"\
          : \"cve\",\n        \"ioc\": primary_cve,\n        \"design_note\": (\n\
          \            \"CVE 证据将漏洞基础严重度与利用上下文分开计算。\"\n            \"主体风险主要依据 CVSS\
          \ 和严重等级；利用上下文主要依据 CISA KEV、\"\n            \"在野利用、公开 PoC、EPSS 和 CVSS 利用条件。\"\
          \n            \"Received/Reserved 表示待富化或信息不足，不表示漏洞无效；\"\n            \"\
          无 CVSS 评分也不表示无风险。\"\n        ),\n        \"evidence_items\": evidence_items,\n\
          \        \"fusion_result\": fusion,\n        \"recommended_actions\": [],\n\
          \    }\n\n    if fusion.get(\"all_rejected\"):\n        bundle[\"recommended_actions\"\
          ] = [\n            \"该 CVE 已被驳回，不按有效漏洞执行补丁或隔离处置。\",\n            \"核验用户输入编号，并保留查询记录防止后续重复误报。\"\
          ,\n        ]\n    elif fusion.get(\"has_pending_enrichment\") and not fusion.get(\"\
          has_scored_evidence\"):\n        bundle[\"recommended_actions\"] = [\n \
          \           \"将该 CVE 纳入漏洞跟踪台账，不要因缺少 CVSS 评分而直接忽略。\",\n            \"结合厂商公告、CNA\
          \ 记录、受影响版本和修复提交核验本地资产。\",\n            \"持续跟踪 NVD/CNA 后续评分、补丁和利用信息更新。\"\
          ,\n        ]\n    elif fusion[\"final_risk_rank\"] >= 5:\n        bundle[\"\
          recommended_actions\"] = [\n            \"优先核查本单位资产中是否存在受影响的软件、组件、系统版本或依赖包。\"\
          ,\n            \"对互联网暴露资产、核心业务系统、边界设备和高权限服务优先排查。\",\n            \"尽快确认官方补丁、缓解措施、版本回退或临时隔离方案。\"\
          ,\n            \"结合 KEV、在野利用、PoC 和本地告警日志评估是否存在已被利用迹象。\",\n        ]\n  \
          \  elif fusion[\"final_risk_rank\"] == 4:\n        bundle[\"recommended_actions\"\
          ] = [\n            \"尽快核查受影响资产范围和版本信息。\",\n            \"优先处理互联网暴露、高权限、高价值业务系统上的相关漏洞。\"\
          ,\n            \"跟踪厂商补丁和缓解措施，并保留修复闭环记录。\",\n        ]\n    elif fusion[\"\
          final_risk_rank\"] == 3:\n        bundle[\"recommended_actions\"] = [\n\
          \            \"结合资产暴露面、业务重要性和实际利用条件确定修复优先级。\",\n            \"纳入漏洞管理台账，持续跟踪补丁状态和风险变化。\"\
          ,\n        ]\n    elif fusion[\"final_risk_rank\"] >= 1:\n        bundle[\"\
          recommended_actions\"] = [\n            \"当前风险信号有限，建议保留查询记录并核验受影响资产。\",\n\
          \            \"如后续进入 KEV、出现公开利用或影响核心资产，应及时提升处置优先级。\",\n        ]\n    else:\n\
          \        bundle[\"recommended_actions\"] = [\n            \"当前尚未完成风险定级，建议补充\
          \ NVD、CNA、厂商公告和修复提交信息。\",\n            \"结合本地资产版本进行影响核验，不要将“未评分”解释为“无风险”。\"\
          ,\n        ]\n\n    return {\n        \"cve_evidence_bundle_json\": json.dumps(\n\
          \            bundle,\n            ensure_ascii=False,\n            indent=2,\n\
