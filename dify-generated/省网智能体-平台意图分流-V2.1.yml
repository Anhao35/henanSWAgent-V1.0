          上下文关联家族：{'、'.join(map(str, all_families[:8]))}\")\n\n    key_findings =\
          \ [\n        f\"URL：{url_value}\",\n        f\"URL所属域名：{url_domain}\",\n\
          \        f\"直接 URL 情报是否存在：{isinstance(url_threat_intel, dict)}\",\n    \
          \    f\"直接 URL 主情报分类：{'、'.join(subject_categories)}\" if subject_categories\
          \ else \"\",\n        f\"直接 URL 主情报标签：{'、'.join(subject_tags)}\" if subject_tags\
          \ else \"\",\n        *context_findings\n    ]\n\n    evidence.update({\n\
          \        \"query_success\": True,\n        \"subject_risk_level\": rank_to_level(subject_rank),\n\
