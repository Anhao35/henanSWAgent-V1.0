          \    \"\"\"\n\n    evidence_items = []\n\n    if vt_ip_raw:\n        evidence_items.append(normalize_vt_ip(primary_ip,\
          \ vt_ip_raw))\n\n    if threatbook_ip_raw:\n        evidence_items.append(normalize_threatbook_ip(primary_ip,\
          \ threatbook_ip_raw))\n\n    if anheng_ip_raw:\n        evidence_items.append(normalize_anheng_ip(primary_ip,\
