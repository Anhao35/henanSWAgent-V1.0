          \        elif epss_ratio >= 0.2:\n            context_rank = max(context_rank,\
          \ 3)\n            findings.append(f\"EPSS 约为 {epss_ratio:.4f}，存在一定利用概率信号。\"\
          )\n        else:\n            findings.append(f\"EPSS 约为 {epss_ratio:.4f}。\"\
          )\n\n    return {\n        \"context_rank\": context_rank,\n        \"context_level\"\
          : rank_to_level(context_rank),\n        \"is_in_kev\": is_kev,\n       \
          \ \"kev_raw_value\": kev_value,\n        \"kev_note\": kev_note,\n     \
          \   \"known_exploited\": known_exploited_bool,\n        \"poc_available\"\
          : poc_bool,\n        \"epss_score\": epss_value,\n        \"findings\":\
          \ dedupe_list(findings),\n    }\n\n\n# =========================\n# 4. CVE\
          \ 标准化\n# =========================\n\n\ndef normalize_cve(primary_cve: str,\
          \ raw: Any) -> dict:\n    data = extract_payload(raw)\n    normalized_primary\
          \ = normalize_cve_id(primary_cve)\n\n    evidence = {\n        \"source\"\
