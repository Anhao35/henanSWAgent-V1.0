    - data:
        code: "import json\nfrom typing import Any, Dict, List, Tuple\n\n\n# ============================================================\n\
          # 1. 基础工具函数\n# ============================================================\n\
          \ndef is_empty(value: Any) -> bool:\n    \"\"\"判断值是否为空。\"\"\"\n    return\
          \ value is None or value == \"\" or value == [] or value == {}\n\n\ndef\
          \ parse_json(value: Any, default: Any) -> Any:\n    \"\"\"\n    将字符串、字典或列表解析为\
          \ Python 对象。\n\n    支持：\n    - dict\n    - list\n    - JSON 字符串\n    - 被重复\
          \ JSON 编码的字符串\n    \"\"\"\n    if is_empty(value):\n        return default\n\
          \n    if isinstance(value, (dict, list)):\n        return value\n\n    if\
          \ not isinstance(value, str):\n        return default\n\n    current = value.strip()\n\
          \    if not current:\n        return default\n\n    for _ in range(5):\n\
          \        try:\n            parsed = json.loads(current)\n            if\
          \ isinstance(parsed, str):\n                current = parsed.strip()\n \
          \               continue\n            return parsed\n        except (json.JSONDecodeError,\
          \ TypeError, ValueError):\n            return default\n\n    return default\n\
          \n\ndef to_int(value: Any, default: int = 0) -> int:\n    \"\"\"尽量将值转换为整数。\"\
          \"\"\n    try:\n        if value is None or value == \"\":\n           \
          \ return default\n        return int(float(value))\n    except (TypeError,\
          \ ValueError):\n        return default\n\n\ndef to_text(value: Any) -> str:\n\
          \    \"\"\"将任意值转换为字符串。\"\"\"\n    if value is None:\n        return \"\"\
          \n\n    if isinstance(value, str):\n        return value.strip()\n\n   \
          \ if isinstance(value, (dict, list)):\n        return json.dumps(value,\
          \ ensure_ascii=False)\n\n    return str(value).strip()\n\n\ndef trim_text(value:\
          \ Any, max_length: int = 300) -> str:\n    \"\"\"限制摘要字段长度，防止巨大对象进入 LLM 或知识检索节点。\"\
          \"\"\n    text = to_text(value)\n    if len(text) <= max_length:\n     \
          \   return text\n    return text[:max_length] + \"……\"\n\n\ndef risk_rank_to_level(rank:\
          \ int) -> str:\n    \"\"\"风险分值映射为风险等级。\"\"\"\n    if rank >= 5:\n      \
          \  return \"严重风险\"\n    if rank == 4:\n        return \"高风险\"\n    if rank\
          \ == 3:\n        return \"中风险\"\n    if rank == 2:\n        return \"低风险\"\
          \n    if rank == 1:\n        return \"无明显风险\"\n    return \"未知\"\n\n\ndef\
          \ normalize_ioc_type(value: Any) -> str:\n    \"\"\"统一 IOC 类型名称。\"\"\"\n\
          \    text = str(value or \"\").strip().lower()\n\n    aliases = {\n    \
          \    \"ip_address\": \"ip\",\n        \"ipv4\": \"ip\",\n        \"ipv6\"\
          : \"ip\",\n        \"domain_name\": \"domain\",\n        \"hostname\": \"\
          domain\",\n        \"uri\": \"url\",\n        \"file_hash\": \"hash\",\n\
          \        \"md5\": \"hash\",\n        \"sha1\": \"hash\",\n        \"sha-1\"\
          : \"hash\",\n        \"sha256\": \"hash\",\n        \"sha-256\": \"hash\"\
          ,\n        \"sha512\": \"hash\",\n        \"sha-512\": \"hash\",\n     \
          \   \"vulnerability\": \"cve\"\n    }\n\n    return aliases.get(text, text)\n\
          \n\ndef normalize_ioc_value(ioc_type: Any, value: Any) -> str:\n    \"\"\
          \"\n    统一 IOC 值：\n    - Hash、Domain 转小写；\n    - CVE 转大写；\n    - 其他保持原值。\n\
          \    \"\"\"\n    normalized_type = normalize_ioc_type(ioc_type)\n    text\
          \ = str(value or \"\").strip()\n\n    if normalized_type in [\"hash\", \"\
          domain\"]:\n        return text.lower()\n\n    if normalized_type == \"\
          cve\":\n        return text.upper()\n\n    return text\n\n\ndef dedupe_objects(items:\
          \ List[Any]) -> List[Any]:\n    \"\"\"对字典、列表或普通值去重，并保持原有顺序。\"\"\"\n    if\
          \ not isinstance(items, list):\n        return []\n\n    result: List[Any]\
          \ = []\n    seen = set()\n\n    for item in items:\n        if is_empty(item):\n\
          \            continue\n\n        if isinstance(item, (dict, list)):\n  \
          \          try:\n                key = json.dumps(item, ensure_ascii=False,\
          \ sort_keys=True)\n            except (TypeError, ValueError):\n       \
          \         key = str(item)\n        else:\n            key = str(item)\n\n\
          \        if key in seen:\n            continue\n\n        seen.add(key)\n\
          \        result.append(item)\n\n    return result\n\n\ndef ensure_list(value:\
          \ Any) -> List[Any]:\n    \"\"\"保证返回列表。\"\"\"\n    return value if isinstance(value,\
          \ list) else []\n\n\ndef safe_dict(value: Any) -> Dict[str, Any]:\n    \"\
          \"\"保证返回字典。\"\"\"\n    return value if isinstance(value, dict) else {}\n\
          \n\ndef first_non_empty(*values: Any) -> Any:\n    \"\"\"返回第一个非空值。\"\"\"\
          \n    for value in values:\n        if not is_empty(value):\n          \
          \  return value\n    return None\n\n\n# ============================================================\n\
          # 2. IOC 对象与摘要合并\n# ============================================================\n\
          \ndef build_ioc_key(item: Dict[str, Any]) -> str:\n    \"\"\"使用 IOC 类型和\
          \ IOC 值生成唯一标识。\"\"\"\n    ioc_type = normalize_ioc_type(item.get(\"ioc_type\"\
          ))\n    ioc = normalize_ioc_value(ioc_type, item.get(\"ioc\"))\n\n    if\
          \ not ioc:\n        return \"\"\n\n    return f\"{ioc_type}|{ioc}\"\n\n\n\
          def merge_ioc_records(items: List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n\
          \    \"\"\"\n    合并重复 IOC。\n\n    同一个 IOC 如果同时存在于单次 Bus 和批量 Bus：\n    -\
          \ 保留 final_risk_rank 更高的记录；\n    - 风险分值相同时，保留证据数量更多的记录；\n    - 主记录缺失字段时，从另一条记录补充；\n\
          \    - 列表字段进行去重合并。\n    \"\"\"\n    merged: Dict[str, Dict[str, Any]] =\
          \ {}\n    order: List[str] = []\n\n    list_fields = [\n        \"key_findings\"\
          ,\n        \"source_summaries\",\n        \"conflict_notes\",\n        \"\
          recommended_actions\"\n    ]\n\n    for item in items:\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        normalized_item = dict(item)\n\
          \        normalized_item[\"ioc_type\"] = normalize_ioc_type(\n         \
          \   normalized_item.get(\"ioc_type\")\n        )\n        normalized_item[\"\
          ioc\"] = normalize_ioc_value(\n            normalized_item.get(\"ioc_type\"\
          ),\n            normalized_item.get(\"ioc\")\n        )\n\n        key =\
          \ build_ioc_key(normalized_item)\n        if not key:\n            continue\n\
          \n        if key not in merged:\n            merged[key] = normalized_item\n\
          \            order.append(key)\n            continue\n\n        old_item\
          \ = merged[key]\n\n        old_rank = to_int(old_item.get(\"final_risk_rank\"\
          ))\n        new_rank = to_int(normalized_item.get(\"final_risk_rank\"))\n\
          \n        old_count = to_int(old_item.get(\"evidence_count\"))\n       \
          \ new_count = to_int(normalized_item.get(\"evidence_count\"))\n\n      \
          \  should_replace = (\n            new_rank > old_rank\n            or (new_rank\
          \ == old_rank and new_count > old_count)\n        )\n\n        if should_replace:\n\
          \            primary = dict(normalized_item)\n            secondary = old_item\n\
          \        else:\n            primary = dict(old_item)\n            secondary\
          \ = normalized_item\n\n        for field in list_fields:\n            primary[field]\
          \ = dedupe_objects(\n                ensure_list(primary.get(field))\n \
          \               + ensure_list(secondary.get(field))\n            )\n\n \
          \       primary[\"evidence_count\"] = max(\n            to_int(primary.get(\"\
          evidence_count\")),\n            to_int(secondary.get(\"evidence_count\"\
          ))\n        )\n\n        for field, value in secondary.items():\n      \
          \      if (\n                field not in list_fields\n                and\
          \ field != \"evidence_count\"\n                and is_empty(primary.get(field))\n\
          \                and not is_empty(value)\n            ):\n             \
          \   primary[field] = value\n\n        merged[key] = primary\n\n    return\
          \ [merged[key] for key in order]\n\n\n# ============================================================\n\
          # 3. Evidence Bus 读取\n# ============================================================\n\
          \ndef extract_evidence_items_from_bundles(\n    evidence_bundles: List[Any]\n\
          ) -> List[Dict[str, Any]]:\n    \"\"\"\n    当 Bus 没有 all_evidence_items\
          \ 时，\n    从 evidence_bundles[].evidence_items 中兜底提取。\n    \"\"\"\n    result:\
          \ List[Dict[str, Any]] = []\n\n    for bundle in evidence_bundles:\n   \
          \     if not isinstance(bundle, dict):\n            continue\n\n       \
          \ for item in ensure_list(bundle.get(\"evidence_items\")):\n           \
          \ if isinstance(item, dict):\n                result.append(item)\n\n  \
          \  return dedupe_objects(result)\n\n\ndef extract_summaries_from_bundles(\n\
          \    evidence_bundles: List[Any]\n) -> List[Dict[str, Any]]:\n    \"\"\"\
          \n    当 Bus 没有 bundle_summaries 时，\n    从 evidence_bundles[].fusion_result\
          \ 中兜底提取。\n    \"\"\"\n    result: List[Dict[str, Any]] = []\n\n    for bundle\
          \ in evidence_bundles:\n        if not isinstance(bundle, dict):\n     \
          \       continue\n\n        fusion = safe_dict(bundle.get(\"fusion_result\"\
          ))\n\n        ioc_type = normalize_ioc_type(\n            first_non_empty(\n\
          \                bundle.get(\"ioc_type\"),\n                fusion.get(\"\
          ioc_type\")\n            )\n        )\n\n        ioc = normalize_ioc_value(\n\
          \            ioc_type,\n            first_non_empty(\n                fusion.get(\"\
          ioc\"),\n                bundle.get(\"ioc\")\n            )\n        )\n\
          \n        if not ioc_type or not ioc:\n            continue\n\n        summary\
          \ = dict(fusion)\n        summary[\"ioc_type\"] = ioc_type\n        summary[\"\
          ioc\"] = ioc\n        summary[\"recommended_actions\"] = dedupe_objects(\n\
          \            ensure_list(summary.get(\"recommended_actions\"))\n       \
          \     + ensure_list(bundle.get(\"recommended_actions\"))\n        )\n\n\
          \        result.append(summary)\n\n    return merge_ioc_records(result)\n\
          \n\ndef normalize_bus(raw_bundle_json: Any) -> Dict[str, Any]:\n    \"\"\
          \"将单次或批量 Evidence Bus 转换为统一结构。\"\"\"\n    bundle = parse_json(raw_bundle_json,\
          \ {})\n\n    if not isinstance(bundle, dict):\n        bundle = {}\n\n \
          \   overall = safe_dict(bundle.get(\"overall_fusion_result\"))\n\n    evidence_bundles\
          \ = ensure_list(bundle.get(\"evidence_bundles\"))\n\n    evidence_items\
          \ = ensure_list(bundle.get(\"all_evidence_items\"))\n    if not evidence_items:\n\
          \        evidence_items = extract_evidence_items_from_bundles(\n       \
          \     evidence_bundles\n        )\n\n    bundle_summaries = ensure_list(bundle.get(\"\
          bundle_summaries\"))\n    if not bundle_summaries:\n        bundle_summaries\
          \ = extract_summaries_from_bundles(\n            evidence_bundles\n    \
          \    )\n\n    return {\n        \"raw_bundle\": bundle,\n        \"overall\"\
          : overall,\n        \"ioc_list\": ensure_list(bundle.get(\"ioc_list\")),\n\
          \        \"bundle_summaries\": bundle_summaries,\n        \"evidence_bundles\"\
          : evidence_bundles,\n        \"evidence_items\": evidence_items,\n     \
          \   \"recommended_actions\": ensure_list(\n            bundle.get(\"recommended_actions\"\
          )\n        )\n    }\n\n\n# ============================================================\n\
          # 4. 证据与摘要补全\n# ============================================================\n\
          \ndef build_evidence_index(\n    evidence_items: List[Any]\n) -> Dict[str,\
          \ List[Dict[str, Any]]]:\n    \"\"\"按 IOC 建立证据索引。\"\"\"\n    result: Dict[str,\
          \ List[Dict[str, Any]]] = {}\n\n    for item in evidence_items:\n      \
          \  if not isinstance(item, dict):\n            continue\n\n        key =\
          \ build_ioc_key(item)\n        if not key:\n            continue\n\n   \
          \     result.setdefault(key, []).append(item)\n\n    return result\n\n\n\
          def enrich_bundle_summaries(\n    ioc_list: List[Dict[str, Any]],\n    bundle_summaries:\
          \ List[Dict[str, Any]],\n    evidence_items: List[Any]\n) -> List[Dict[str,\
          \ Any]]:\n    \"\"\"\n    使用 evidence_items 补全 bundle_summaries。\n\n   \
          \ 主要修复：\n    - 不再从字段不完整的 ioc_list 生成主体风险和上下文风险；\n    - 当摘要中的风险或证据数量错误为 0\
          \ 时，\n      使用详细 evidence_items 中的真实值补全；\n    - 没有摘要时，根据 IOC 和详细证据构造摘要。\n\
          \    \"\"\"\n    evidence_index = build_evidence_index(evidence_items)\n\
          \n    summary_index: Dict[str, Dict[str, Any]] = {}\n    order: List[str]\
          \ = []\n\n    for summary in merge_ioc_records(bundle_summaries):\n    \
          \    key = build_ioc_key(summary)\n        if not key:\n            continue\n\
          \        summary_index[key] = dict(summary)\n        order.append(key)\n\
          \n    for ioc_item in merge_ioc_records(ioc_list):\n        key = build_ioc_key(ioc_item)\n\
          \        if not key:\n            continue\n\n        matched = evidence_index.get(key,\
          \ [])\n\n        subject_rank = max(\n            [\n                to_int(item.get(\"\
          subject_risk_rank\"))\n                for item in matched\n           \
          \     if isinstance(item, dict)\n            ]\n            or [0]\n   \
          \     )\n\n        context_rank = max(\n            [\n                to_int(item.get(\"\
          context_risk_rank\"))\n                for item in matched\n           \
          \     if isinstance(item, dict)\n            ]\n            or [0]\n   \
          \     )\n\n        valid_count = len([\n            item\n            for\
          \ item in matched\n            if isinstance(item, dict)\n            and\
          \ item.get(\"query_success\")\n        ])\n\n        source_summaries =\
          \ []\n        key_findings = []\n\n        for item in matched:\n      \
          \      source_summaries.append({\n                \"source\": item.get(\"\
          source\"),\n                \"tool_name\": item.get(\"tool_name\"),\n  \
          \              \"query_success\": item.get(\"query_success\"),\n       \
          \         \"confidence\": item.get(\"confidence\"),\n                \"\
          subject_risk_level\": item.get(\"subject_risk_level\"),\n              \
          \  \"context_risk_level\": item.get(\"context_risk_level\"),\n         \
          \       \"summary\": item.get(\"summary\")\n            })\n\n         \
          \   key_findings.extend(\n                ensure_list(item.get(\"key_findings\"\
          ))\n            )\n\n        final_rank = max(\n            to_int(ioc_item.get(\"\
          final_risk_rank\")),\n            subject_rank,\n            context_rank\n\
          \        )\n\n        generated = {\n            \"ioc_type\": normalize_ioc_type(\n\
          \                ioc_item.get(\"ioc_type\")\n            ),\n          \
          \  \"ioc\": normalize_ioc_value(\n                ioc_item.get(\"ioc_type\"\
          ),\n                ioc_item.get(\"ioc\")\n            ),\n            \"\
          subject_risk_level\": risk_rank_to_level(subject_rank),\n            \"\
          subject_risk_rank\": subject_rank,\n            \"context_risk_level\":\
          \ risk_rank_to_level(context_rank),\n            \"context_risk_rank\":\
          \ context_rank,\n            \"final_risk_level\": first_non_empty(\n  \
          \              ioc_item.get(\"final_risk_level\"),\n                risk_rank_to_level(final_rank)\n\
          \            ),\n            \"final_risk_rank\": final_rank,\n        \
          \    \"risk_reason\": first_non_empty(\n                ioc_item.get(\"\
          risk_reason\"),\n                \"根据标准化证据中的主体风险和上下文风险计算。\"\n          \
          \  ),\n            \"evidence_count\": valid_count,\n            \"source_summaries\"\
          : dedupe_objects(source_summaries),\n            \"key_findings\": dedupe_objects(key_findings),\n\
          \            \"conflict_notes\": [],\n            \"recommended_actions\"\
          : []\n        }\n\n        if key not in summary_index:\n            summary_index[key]\
          \ = generated\n            order.append(key)\n        else:\n          \
          \  summary_index[key] = merge_ioc_records(\n                [summary_index[key],\
          \ generated]\n            )[0]\n\n    # 强制用详细证据补全摘要中的错误 0 值。\n    for key\
          \ in list(order):\n        summary = summary_index[key]\n        matched\
          \ = evidence_index.get(key, [])\n\n        if not matched:\n           \
          \ continue\n\n        evidence_subject_rank = max(\n            [\n    \
          \            to_int(item.get(\"subject_risk_rank\"))\n                for\
          \ item in matched\n                if isinstance(item, dict)\n         \
          \   ]\n            or [0]\n        )\n\n        evidence_context_rank =\
          \ max(\n            [\n                to_int(item.get(\"context_risk_rank\"\
          ))\n                for item in matched\n                if isinstance(item,\
          \ dict)\n            ]\n            or [0]\n        )\n\n        if evidence_subject_rank\
          \ > to_int(\n            summary.get(\"subject_risk_rank\")\n        ):\n\
          \            summary[\"subject_risk_rank\"] = evidence_subject_rank\n  \
          \          summary[\"subject_risk_level\"] = risk_rank_to_level(\n     \
          \           evidence_subject_rank\n            )\n\n        if evidence_context_rank\
          \ > to_int(\n            summary.get(\"context_risk_rank\")\n        ):\n\
          \            summary[\"context_risk_rank\"] = evidence_context_rank\n  \
          \          summary[\"context_risk_level\"] = risk_rank_to_level(\n     \
          \           evidence_context_rank\n            )\n\n        valid_count\
          \ = len([\n            item\n            for item in matched\n         \
          \   if isinstance(item, dict)\n            and item.get(\"query_success\"\
          )\n        ])\n\n        summary[\"evidence_count\"] = max(\n          \
          \  to_int(summary.get(\"evidence_count\")),\n            valid_count\n \
          \       )\n\n        evidence_findings = []\n        evidence_sources =\
          \ []\n\n        for item in matched:\n            evidence_findings.extend(\n\
          \                ensure_list(item.get(\"key_findings\"))\n            )\n\
          \n            evidence_sources.append({\n                \"source\": item.get(\"\
          source\"),\n                \"tool_name\": item.get(\"tool_name\"),\n  \
          \              \"query_success\": item.get(\"query_success\"),\n       \
          \         \"confidence\": item.get(\"confidence\"),\n                \"\
          subject_risk_level\": item.get(\"subject_risk_level\"),\n              \
          \  \"context_risk_level\": item.get(\"context_risk_level\"),\n         \
          \       \"summary\": item.get(\"summary\")\n            })\n\n        summary[\"\
          key_findings\"] = dedupe_objects(\n            ensure_list(summary.get(\"\
          key_findings\"))\n            + evidence_findings\n        )\n\n       \
          \ summary[\"source_summaries\"] = dedupe_objects(\n            ensure_list(summary.get(\"\
          source_summaries\"))\n            + evidence_sources\n        )\n\n    \
          \    final_rank = max(\n            to_int(summary.get(\"final_risk_rank\"\
          )),\n            to_int(summary.get(\"subject_risk_rank\")),\n         \
          \   to_int(summary.get(\"context_risk_rank\"))\n        )\n\n        summary[\"\
          final_risk_rank\"] = final_rank\n        summary[\"final_risk_level\"] =\
          \ risk_rank_to_level(final_rank)\n\n        summary_index[key] = summary\n\
          \n    return [summary_index[key] for key in order]\n\n\n# ============================================================\n\
          # 5. 总体风险融合\n# ============================================================\n\
          \ndef calculate_overall_risk(\n    risk_records: List[Dict[str, Any]],\n\
          \    single_rank: Any,\n    multi_rank: Any\n) -> Tuple[int, str, List[Dict[str,\
          \ Any]]]:\n    \"\"\"根据所有对象摘要计算最终总体风险。\"\"\"\n    object_ranks = [\n   \
          \     to_int(item.get(\"final_risk_rank\"))\n        for item in risk_records\n\
          \        if isinstance(item, dict)\n    ]\n\n    if object_ranks:\n    \
          \    overall_rank = max(object_ranks)\n    else:\n        overall_rank =\
          \ max(\n            to_int(single_rank),\n            to_int(multi_rank)\n\
          \        )\n\n    overall_level = risk_rank_to_level(overall_rank)\n\n \
          \   highest_risk_iocs = [\n        item\n        for item in risk_records\n\
          \        if isinstance(item, dict)\n        and to_int(item.get(\"final_risk_rank\"\
          )) == overall_rank\n    ]\n\n    return overall_rank, overall_level, highest_risk_iocs\n\
          \n\ndef build_overall_reason(\n    overall_rank: int,\n    highest_risk_iocs:\
          \ List[Dict[str, Any]]\n) -> str:\n    \"\"\"优先使用最高风险对象真实的 risk_reason。\"\
          \"\"\n    reasons = dedupe_objects([\n        trim_text(item.get(\"risk_reason\"\
          ), 500)\n        for item in highest_risk_iocs\n        if isinstance(item,\
          \ dict)\n        and to_text(item.get(\"risk_reason\"))\n    ])\n\n    if\
          \ reasons:\n        return \"；\".join(reasons)\n\n    if overall_rank >=\
          \ 5:\n        return (\n            \"合并后的单次与批量证据中存在严重风险对象，\"\n        \
          \    \"应优先开展隔离、阻断或漏洞修复。\"\n        )\n\n    if overall_rank == 4:\n    \
          \    return (\n            \"合并后的单次与批量证据中存在高风险对象，\"\n            \"建议尽快复核并采取相应处置措施。\"\
          \n        )\n\n    if overall_rank == 3:\n        return (\n           \
          \ \"合并后的证据中存在中风险对象，\"\n            \"需要结合本地日志、终端行为和资产情况进一步复核。\"\n      \
          \  )\n\n    if overall_rank == 2:\n        return (\n            \"合并后的证据中存在低风险或上下文风险线索，\"\
          \n            \"建议持续监测并补充本地证据。\"\n        )\n\n    if overall_rank == 1:\n\
          \        return \"当前合并后的标准化证据未发现明显恶意风险。\"\n\n    return (\n        \"单次\
          \ IOC 查询分支和批量 IOC 查询分支\"\n        \"均未获得有效标准化证据。\"\n    )\n\n\n# ============================================================\n\
          # 6. 类型统计与证据数量\n# ============================================================\n\
          \ndef build_type_counts(\n    ioc_list: List[Dict[str, Any]]\n) -> Dict[str,\
          \ int]:\n    \"\"\"统计各种 IOC 类型数量。\"\"\"\n    type_counts = {\n        \"\
          ip\": 0,\n        \"domain\": 0,\n        \"url\": 0,\n        \"hash\"\
          : 0,\n        \"cve\": 0\n    }\n\n    seen = set()\n\n    for item in ioc_list:\n\
          \        if not isinstance(item, dict):\n            continue\n\n      \
          \  key = build_ioc_key(item)\n        if not key or key in seen:\n     \
          \       continue\n\n        seen.add(key)\n\n        ioc_type = normalize_ioc_type(item.get(\"\
          ioc_type\"))\n        if ioc_type in type_counts:\n            type_counts[ioc_type]\
          \ += 1\n\n    return type_counts\n\n\ndef calculate_evidence_count(\n  \
          \  bundle_summaries: List[Dict[str, Any]],\n    evidence_items: List[Any],\n\
          \    single_count: Any,\n    multi_count: Any\n) -> int:\n    \"\"\"\n \
          \   计算合并后的证据数量。\n\n    优先级：\n    1. 去重后的 evidence_items 中 query_success=true\
          \ 的实际数量；\n    2. 各对象摘要中的 evidence_count 之和；\n    3. 单次和批量 Bus 的 evidence_count\
          \ 之和。\n    \"\"\"\n    valid_items = [\n        item\n        for item in\
          \ evidence_items\n        if isinstance(item, dict)\n        and item.get(\"\
          query_success\")\n    ]\n\n    if valid_items:\n        return len(valid_items)\n\
          \n    summary_count = sum(\n        to_int(item.get(\"evidence_count\"))\n\
          \        for item in bundle_summaries\n        if isinstance(item, dict)\n\
          \    )\n\n    if summary_count > 0:\n        return summary_count\n\n  \
          \  return to_int(single_count) + to_int(multi_count)\n\n\n# ============================================================\n\
          # 7. 紧凑事实提取\n# ============================================================\n\
          \ndef find_matching_evidence(\n    summary: Dict[str, Any],\n    evidence_items:\
          \ List[Any]\n) -> List[Dict[str, Any]]:\n    \"\"\"查找与某个对象对应的证据项。\"\"\"\n\
          \    key = build_ioc_key(summary)\n\n    if not key:\n        return []\n\
          \n    return [\n        item\n        for item in evidence_items\n     \
          \   if isinstance(item, dict)\n        and build_ioc_key(item) == key\n\
          \    ]\n\n\ndef compact_findings(\n    findings: Any,\n    max_items: int\
          \ = 8\n) -> List[str]:\n    \"\"\"\n    压缩 key_findings。\n\n    过滤旧节点可能写入的完整\
          \ file_reputation、\n    antivirus_scan 等巨大字典字符串。\n    \"\"\"\n    result:\
          \ List[str] = []\n\n    for item in ensure_list(findings):\n        text\
          \ = to_text(item)\n\n        if not text:\n            continue\n\n    \
          \    lower = text.lower()\n\n        if (\n            len(text) > 500\n\
          \            or \"antivirus_scan\" in lower\n            or \"文件信誉：{\" in\
          \ text\n            or \"file_reputation：{\" in lower\n        ):\n    \
          \        continue\n\n        result.append(trim_text(text, 240))\n\n   \
          \     if len(result) >= max_items:\n            break\n\n    return dedupe_objects(result)\n\
          \n\ndef compact_value(\n    value: Any,\n    max_string: int = 260,\n  \
          \  max_list: int = 5,\n    max_dict: int = 16,\n    depth: int = 0\n) ->\
          \ Any:\n    \"\"\"\n    递归压缩结构化字段，避免超大对象直接进入最终 LLM。\n\n    注意：\n    - None、空字符串、空列表和空字典视为空；\n\
          \    - 0 和 False 是真实工具值，必须保留；\n    - 列表和字典只做容量控制，不修改字段语义。\n    \"\"\"\n\
          \    if value is None or value == \"\":\n        return None\n\n    if isinstance(value,\
          \ (int, float, bool)):\n        return value\n\n    if depth >= 4:\n   \
          \     return trim_text(value, max_string)\n\n    if isinstance(value, str):\n\
          \        return trim_text(value, max_string)\n\n    if isinstance(value,\
          \ list):\n        result: List[Any] = []\n\n        for item in value[:max_list]:\n\
          \            compacted = compact_value(\n                item,\n       \
          \         max_string=max_string,\n                max_list=max_list,\n \
          \               max_dict=max_dict,\n                depth=depth + 1\n  \
          \          )\n\n            if compacted not in [None, \"\", [], {}]:\n\
          \                result.append(compacted)\n\n        return result\n\n \
          \   if isinstance(value, dict):\n        result: Dict[str, Any] = {}\n\n\
          \        for key, item in list(value.items())[:max_dict]:\n            compacted\
          \ = compact_value(\n                item,\n                max_string=max_string,\n\
          \                max_list=max_list,\n                max_dict=max_dict,\n\
          \                depth=depth + 1\n            )\n\n            if compacted\
          \ not in [None, \"\", [], {}]:\n                result[str(key)] = compacted\n\
          \n        return result\n\n    return trim_text(value, max_string)\n\n\n\
          def put_detail(\n    target: Dict[str, Any],\n    key: str,\n    value:\
          \ Any,\n    max_string: int = 260,\n    max_list: int = 5,\n    max_dict:\
          \ int = 16\n) -> None:\n    \"\"\"\n    将非空字段写入 LLM 证据详情。\n\n    该函数不会丢弃数值\
          \ 0 或布尔值 False。\n    \"\"\"\n    if value is None or value == \"\":\n  \
          \      return\n\n    compacted = compact_value(\n        value,\n      \
          \  max_string=max_string,\n        max_list=max_list,\n        max_dict=max_dict\n\
          \    )\n\n    if compacted in [None, \"\", [], {}]:\n        return\n\n\
          \    target[key] = compacted\n\n\ndef build_remaining_fields(\n    source:\
          \ Dict[str, Any],\n    consumed_keys: List[str],\n    max_dict: int = 16\n\
          ) -> Dict[str, Any]:\n    \"\"\"\n    保留专项字段之外仍然存在的真实字段。\n\n    这样既能优先提取\
          \ IP、Domain、URL、Hash、CVE 的关键字段，\n    又不会因为上游字段扩展或工具版本变化而把新字段全部丢失。\n    \"\
          \"\"\n    consumed = set(consumed_keys)\n    remaining = {\n        str(key):\
          \ value\n        for key, value in source.items()\n        if str(key) not\
          \ in consumed\n    }\n\n    compacted = compact_value(\n        remaining,\n\
          \        max_string=240,\n        max_list=4,\n        max_dict=max_dict\n\
          \    )\n\n    return compacted if isinstance(compacted, dict) else {}\n\n\
          \ndef build_llm_evidence_item(\n    evidence: Dict[str, Any]\n) -> Dict[str,\
          \ Any]:\n    \"\"\"\n    将完整 Evidence Item 转换为最终 LLM 使用的结构化紧凑证据。\n\n   \
          \ 所有输出均由当前 evidence 动态生成，不使用固定 IOC、固定风险值\n    或针对某一测试样例写死的最终结果。\n    \"\"\
          \"\n    ioc_type = normalize_ioc_type(evidence.get(\"ioc_type\"))\n    ioc\
          \ = normalize_ioc_value(ioc_type, evidence.get(\"ioc\"))\n\n    source_specific\
          \ = safe_dict(\n        evidence.get(\"source_specific\")\n    )\n    raw_compact\
          \ = safe_dict(\n        evidence.get(\"raw_compact\")\n    )\n\n    result:\
          \ Dict[str, Any] = {\n        \"source\": evidence.get(\"source\"),\n  \
          \      \"tool_name\": evidence.get(\"tool_name\"),\n        \"ioc_type\"\
          : ioc_type,\n        \"ioc\": ioc,\n        \"query_success\": evidence.get(\"\
          query_success\") is True,\n        \"subject_risk_level\": evidence.get(\n\
          \            \"subject_risk_level\",\n            \"未知\"\n        ),\n \
          \       \"subject_risk_rank\": to_int(\n            evidence.get(\"subject_risk_rank\"\
          )\n        ),\n        \"context_risk_level\": evidence.get(\n         \
          \   \"context_risk_level\",\n            \"未知\"\n        ),\n        \"\
          context_risk_rank\": to_int(\n            evidence.get(\"context_risk_rank\"\
          )\n        ),\n        \"confidence\": evidence.get(\"confidence\"),\n \
          \       \"summary\": trim_text(\n            evidence.get(\"summary\"),\n\
          \            420\n        ),\n        \"key_findings\": compact_findings(\n\
          \            evidence.get(\"key_findings\"),\n            max_items=8\n\
          \        )\n    }\n\n    details: Dict[str, Any] = {}\n    consumed_source_keys:\
          \ List[str] = []\n    consumed_raw_keys: List[str] = []\n\n    if ioc_type\
          \ == \"ip\":\n        consumed_source_keys = [\n            \"vt_link\"\
          ,\n            \"reputation\",\n            \"owner\",\n            \"network\"\
          ,\n            \"country\",\n            \"asn\",\n            \"rir\",\n\
          \            \"last_analysis_time\",\n            \"last_modification_time\"\
          ,\n            \"analysis_stats\",\n            \"community_votes\",\n \
          \           \"crowdsourced_context\",\n            \"whois_summary\",\n\
          \            \"certificate_summary\",\n            \"risk_hits\",\n    \
          \        \"response_code\",\n            \"verbose_msg\",\n            \"\
          severity\",\n            \"is_malicious\",\n            \"confidence_level\"\
          ,\n            \"judgments\",\n            \"tags_classes\",\n         \
          \   \"geo\",\n            \"carrier\",\n            \"asn_info\",\n    \
          \        \"asn_number\",\n            \"scene\",\n            \"update_time\"\
          ,\n            \"permalink\",\n            \"geolocation\",\n          \
          \  \"main_threat_intel\",\n            \"outbound_threat_intel\",\n    \
          \        \"inbound_threat_intel\",\n            \"related_files_summary\"\
          ,\n            \"behavior_profile_summary\"\n        ]\n        consumed_raw_keys\
          \ = [\n            \"ip\",\n            \"object_type\",\n            \"\
          analysis_stats\",\n            \"risk_hits_count\",\n            \"severity\"\
          ,\n            \"is_malicious\",\n            \"confidence_level\",\n  \
          \          \"judgments\",\n            \"main_level\",\n            \"outbound_level\"\
          ,\n            \"inbound_level\",\n            \"related_communication_file_count\"\
          ,\n            \"related_static_file_count\",\n            \"related_file_max_level\"\
          \n        ]\n\n        put_detail(\n            details,\n            \"\
          analysis_stats\",\n            first_non_empty(\n                source_specific.get(\"\
          analysis_stats\"),\n                raw_compact.get(\"analysis_stats\")\n\
          \            )\n        )\n        put_detail(\n            details,\n \
          \           \"community_votes\",\n            source_specific.get(\"community_votes\"\
          )\n        )\n        put_detail(\n            details,\n            \"\
          reputation\",\n            source_specific.get(\"reputation\")\n       \
          \ )\n        put_detail(\n            details,\n            \"subject_verdict\"\
          ,\n            {\n                \"severity\": source_specific.get(\"severity\"\
          ),\n                \"is_malicious\": source_specific.get(\"is_malicious\"\
          ),\n                \"confidence_level\": source_specific.get(\n       \
          \             \"confidence_level\"\n                ),\n               \
          \ \"judgments\": source_specific.get(\"judgments\"),\n                \"\
          tags_classes\": source_specific.get(\"tags_classes\")\n            },\n\
          \            max_list=8\n        )\n        put_detail(\n            details,\n\
          \            \"ownership_and_network\",\n            {\n               \
          \ \"owner\": source_specific.get(\"owner\"),\n                \"network\"\
          : source_specific.get(\"network\"),\n                \"country\": source_specific.get(\"\
          country\"),\n                \"asn\": source_specific.get(\"asn\"),\n  \
          \              \"rir\": source_specific.get(\"rir\"),\n                \"\
          carrier\": source_specific.get(\"carrier\"),\n                \"asn_info\"\
          : source_specific.get(\"asn_info\"),\n                \"asn_number\": source_specific.get(\"\
          asn_number\")\n            }\n        )\n        put_detail(\n         \
          \   details,\n            \"geolocation\",\n            first_non_empty(\n\
          \                source_specific.get(\"geolocation\"),\n               \
          \ source_specific.get(\"geo\")\n            )\n        )\n        put_detail(\n\
          \            details,\n            \"main_threat_intel\",\n            source_specific.get(\"\
          main_threat_intel\")\n        )\n        put_detail(\n            details,\n\
          \            \"outbound_threat_intel\",\n            source_specific.get(\"\
          outbound_threat_intel\")\n        )\n        put_detail(\n            details,\n\
          \            \"inbound_threat_intel\",\n            source_specific.get(\"\
          inbound_threat_intel\")\n        )\n        put_detail(\n            details,\n\
          \            \"related_files_summary\",\n            source_specific.get(\"\
          related_files_summary\")\n        )\n        put_detail(\n            details,\n\
          \            \"behavior_profile_summary\",\n            source_specific.get(\"\
          behavior_profile_summary\")\n        )\n        put_detail(\n          \
          \  details,\n            \"crowdsourced_context\",\n            source_specific.get(\"\
          crowdsourced_context\"),\n            max_list=3\n        )\n        put_detail(\n\
          \            details,\n            \"risk_hits\",\n            source_specific.get(\"\
          risk_hits\"),\n            max_list=5\n        )\n        put_detail(\n\
          \            details,\n            \"whois_summary\",\n            source_specific.get(\"\
          whois_summary\")\n        )\n        put_detail(\n            details,\n\
          \            \"certificate_summary\",\n            source_specific.get(\"\
          certificate_summary\")\n        )\n\n    elif ioc_type == \"domain\":\n\
          \        consumed_source_keys = [\n            \"vt_link\",\n          \
          \  \"reputation\",\n            \"last_analysis_time\",\n            \"\
          last_modification_time\",\n            \"last_update_time\",\n         \
          \   \"tld\",\n            \"registrar\",\n            \"creation_time\"\
          ,\n            \"expiration_time\",\n            \"analysis_stats\",\n \
          \           \"community_votes\",\n            \"popularity\",\n        \
          \    \"dns_summary\",\n            \"whois_summary\",\n            \"certificate_summary\"\
          ,\n            \"crowdsourced_context\",\n            \"risk_hits\",\n \
          \           \"basic_info\",\n            \"whois\",\n            \"historical_intel_summary\"\
          ,\n            \"related_communication_files_summary\",\n            \"\
          related_static_files_summary\",\n            \"related_resolution_ips_summary\"\
          ,\n            \"related_threat_articles_count\",\n            \"related_urls_summary\"\
          ,\n            \"note\"\n        ]\n        consumed_raw_keys = [\n    \
          \        \"domain\",\n            \"object_type\",\n            \"analysis_stats\"\
          ,\n            \"risk_hits_count\",\n            \"a_record_count\",\n \
          \           \"is_valid\",\n            \"root_domain\",\n            \"\
          subject_has_threat_intel\",\n            \"historical_intel_count\",\n \
          \           \"related_communication_files_count\",\n            \"related_static_files_count\"\
          ,\n            \"related_resolution_ips_count\",\n            \"related_threat_articles_count\"\
          ,\n            \"related_urls_count\",\n            \"context_max_level\"\
          \n        ]\n\n        put_detail(\n            details,\n            \"\
          analysis_stats\",\n            first_non_empty(\n                source_specific.get(\"\
          analysis_stats\"),\n                raw_compact.get(\"analysis_stats\")\n\
