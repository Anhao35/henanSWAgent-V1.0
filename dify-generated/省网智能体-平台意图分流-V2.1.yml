    - data:
        code: "from typing import Any, Dict\nimport json\n\n\ndef to_text(value: Any,\
          \ default: str = \"\") -> str:\n    \"\"\"\n    将任意输入安全转换为去除首尾空白的字符串。\n\
          \    \"\"\"\n    if value is None:\n        return default\n\n    if isinstance(value,\
          \ str):\n        text = value.strip()\n        return text if text else\
          \ default\n\n    if isinstance(value, (dict, list, tuple)):\n        try:\n\
          \            return json.dumps(\n                value,\n              \
          \  ensure_ascii=False,\n                indent=2\n            )\n      \
          \  except (TypeError, ValueError):\n            return str(value).strip()\
          \ or default\n\n    text = str(value).strip()\n    return text if text else\
          \ default\n\n\ndef to_int(value: Any, default: int = 0) -> int:\n    \"\"\
          \"\n    将输入安全转换为整数。\n    支持整数、浮点数和数字字符串。\n    \"\"\"\n    if value is None:\n\
          \        return default\n\n    try:\n        return int(float(value))\n\
          \    except (TypeError, ValueError, OverflowError):\n        return default\n\
          \n\ndef format_number(value: Any, default: str = \"0\") -> str:\n    \"\"\
          \"\n    格式化风险分值。\n    例如：\n    3.0  -> 3\n    3.5  -> 3.5\n    None -> 0\n\
          \    \"\"\"\n    if value is None:\n        return default\n\n    try:\n\
          \        number = float(value)\n        if number.is_integer():\n      \
          \      return str(int(number))\n        return str(round(number, 2))\n \
          \   except (TypeError, ValueError, OverflowError):\n        text = to_text(value)\n\
          \        return text if text else default\n\n\ndef format_json_text(value:\
          \ Any, default: str = \"[]\") -> str:\n    \"\"\"\n    将 IOC 列表转换为适合在 Markdown\
          \ JSON 代码块中展示的字符串。\n    支持：\n    1. 已经是 list 或 dict 的输入；\n    2. JSON 格式字符串；\n\
          \    3. 普通字符串；\n    4. 空值。\n    \"\"\"\n    if value is None:\n        return\
          \ default\n\n    if isinstance(value, (list, dict)):\n        try:\n   \
          \         return json.dumps(\n                value,\n                ensure_ascii=False,\n\
          \                indent=2\n            )\n        except (TypeError, ValueError):\n\
          \            return default\n\n    text = to_text(value)\n    if not text:\n\
          \        return default\n\n    try:\n        parsed_value = json.loads(text)\n\
          \        return json.dumps(\n            parsed_value,\n            ensure_ascii=False,\n\
          \            indent=2\n        )\n    except (json.JSONDecodeError, TypeError,\
          \ ValueError):\n        return text\n\n\ndef normalize_risk_level(value:\
          \ Any) -> str:\n    \"\"\"\n    标准化风险等级，避免空字符串直接显示。\n    \"\"\"\n    risk_level\
          \ = to_text(value, \"未知\")\n\n    risk_level_mapping = {\n        \"unknown\"\
          : \"未知\",\n        \"UNKNOWN\": \"未知\",\n        \"Unknown\": \"未知\",\n\
          \        \"none\": \"未知\",\n        \"null\": \"未知\",\n        \"low\":\
          \ \"低风险\",\n        \"LOW\": \"低风险\",\n        \"Low\": \"低风险\",\n     \
          \   \"medium\": \"中风险\",\n        \"MEDIUM\": \"中风险\",\n        \"Medium\"\
          : \"中风险\",\n        \"high\": \"高风险\",\n        \"HIGH\": \"高风险\",\n   \
          \     \"High\": \"高风险\",\n        \"critical\": \"严重风险\",\n        \"CRITICAL\"\
          : \"严重风险\",\n        \"Critical\": \"严重风险\"\n    }\n    return risk_level_mapping.get(risk_level,\
          \ risk_level)\n\n\ndef build_evidence_status(evidence_count: int) -> str:\n\
          \    \"\"\"\n    根据有效证据数量生成服务状态说明。\n    \"\"\"\n    if evidence_count >\
          \ 0:\n        return (\n            \"上游 IOC 查询、威胁情报检索和 Evidence Bus 证据融合已经完成，\"\
          \n            \"但最终语言模型总结服务暂时不可用。\"\n            \"以下内容由兜底代码节点直接根据上游结构化证据生成。\"\
          \n        )\n\n    return (\n        \"最终语言模型总结服务暂时不可用，\"\n        \"并且当前\
          \ Evidence Bus 中没有获得有效的标准化威胁情报证据。\"\n        \"因此本报告只能说明当前查询状态，不能据此认定查询对象安全或恶意。\"\
          \n    )\n\n\ndef build_risk_explanation(\n    risk_level: str,\n    risk_rank:\
          \ str,\n    evidence_count: int\n) -> str:\n    \"\"\"\n    生成不依赖语言模型的基础风险解释。\n\
          \    \"\"\"\n    if evidence_count <= 0:\n        return (\n           \
          \ \"当前没有足够的有效证据支持明确的安全结论。\"\n            \"总体风险应保持为“未知”，需要结合其他情报源和本地安全日志继续核验。\"\
          \n        )\n\n    normalized_level = risk_level.lower()\n\n    if \"严重\"\
          \ in risk_level or \"critical\" in normalized_level:\n        return (\n\
          \            f\"Evidence Bus 给出的总体风险等级为“{risk_level}”，\"\n            f\"\
          风险分值为 {risk_rank}。\"\n            \"建议优先开展人工复核、资产影响确认和应急处置。\"\n        \
          \    \"该结论仅来源于上游已获得的结构化证据，尚未经过最终语言模型综合解释。\"\n        )\n\n    if \"高\" in\
          \ risk_level or \"high\" in normalized_level:\n        return (\n      \
          \      f\"Evidence Bus 给出的总体风险等级为“{risk_level}”，\"\n            f\"风险分值为\
          \ {risk_rank}。\"\n            \"建议将相关 IOC 列入重点核查范围，并结合终端、网络和安全设备日志确认是否存在实际命中。\"\
          \n        )\n\n    if \"中\" in risk_level or \"medium\" in normalized_level:\n\
          \        return (\n            f\"Evidence Bus 给出的总体风险等级为“{risk_level}”，\"\
          \n            f\"风险分值为 {risk_rank}。\"\n            \"当前存在需要关注的证据，但仍需结合资产访问记录、时间范围和业务背景进行人工确认。\"\
          \n        )\n\n    if \"低\" in risk_level or \"low\" in normalized_level:\n\
          \        return (\n            f\"Evidence Bus 给出的总体风险等级为“{risk_level}”，\"\
          \n            f\"风险分值为 {risk_rank}。\"\n            \"当前上游证据未显示明显高风险，但低风险不等于绝对安全，仍应结合本地日志和业务环境进行核验。\"\
          \n        )\n\n    return (\n        f\"Evidence Bus 当前给出的总体风险等级为“{risk_level}”，\"\
          \n        f\"风险分值为 {risk_rank}。\"\n        \"由于最终语言模型总结失败，本节点不对上游证据作额外推断，\"\
          \n        \"建议依据 Evidence Bus 原始摘要进行人工复核。\"\n    )\n\n\ndef build_recommendations(\n\
          \    risk_level: str,\n    evidence_count: int\n) -> str:\n    \"\"\"\n\
          \    根据证据数量和风险等级生成基础处置建议。\n    \"\"\"\n    recommendations = [\n       \
          \ \"稍后重新执行工作流，尝试生成完整的 AI 综合研判报告。\",\n        \"以 Evidence Bus 中已经生成的标准化证据为准，避免根据模型异常信息判断\
          \ IOC 的安全性。\",\n        \"结合本地 DNS、代理、防火墙、WAF、邮件网关、EDR、NDR 和 SIEM 日志确认是否存在真实访问或命中。\"\
          ,\n        \"核对 IOC 首次出现时间、最后出现时间、情报来源、标签、置信度以及查询状态，排除过期情报和误报。\",\n    \
          \    \"如果需要采取封禁、隔离或阻断措施，应先确认相关 IOC 是否属于业务依赖、公共服务或共享基础设施。\"\n    ]\n\n  \
          \  normalized_level = risk_level.lower()\n\n    if evidence_count <= 0:\n\
          \        recommendations.append(\n            \"当前没有有效证据，不应直接执行永久封禁；建议更换情报源、检查上游工具状态后重新查询。\"\
          \n        )\n    elif (\n        \"严重\" in risk_level\n        or \"高\"\
          \ in risk_level\n        or \"critical\" in normalized_level\n        or\
          \ \"high\" in normalized_level\n    ):\n        recommendations.append(\n\
          \            \"如果本地日志确认相关 IOC 与资产发生通信，应立即保存证据，并评估是否需要临时阻断、终端隔离和事件升级。\"\n\
          \        )\n    else:\n        recommendations.append(\n            \"当前建议以监控、复核和关联分析为主，避免仅根据单一外部情报结果实施高影响处置。\"\
          \n        )\n\n    return \"\\n\".join(\n        f\"{index}. {item}\"\n\
          \        for index, item in enumerate(recommendations, start=1)\n    )\n\
          \n\ndef main(\n    user_query: str = \"\",\n    risk_level: str = \"\",\n\
          \    risk_rank: Any = 0,\n    evidence_count: Any = 0,\n    llm_context:\
          \ str = \"\",\n    ioc_list_json: str = \"\"\n) -> Dict[str, str]:\n   \
          \ \"\"\"\n    当最终语言模型节点因 DNS、网络、超时或模型服务异常而失败时，\n    根据已经生成的 Evidence Bus\
          \ 返回基础降级报告。\n    输出字段：\n    fallback_answer: String\n    \"\"\"\n\n    query_text\
          \ = to_text(\n        user_query,\n        \"未提供用户查询内容\"\n    )\n\n    final_risk_level\
          \ = normalize_risk_level(risk_level)\n    final_risk_rank = format_number(risk_rank,\
          \ \"0\")\n    final_evidence_count = max(to_int(evidence_count, 0), 0)\n\
          \n    evidence_summary = to_text(\n        llm_context,\n        \"上游没有提供可用于展示的\
          \ Evidence Bus 摘要。\"\n    )\n\n    formatted_ioc_list = format_json_text(\n\
          \        ioc_list_json,\n        \"[]\"\n    )\n\n    evidence_status =\
          \ build_evidence_status(\n        final_evidence_count\n    )\n\n    risk_explanation\
          \ = build_risk_explanation(\n        final_risk_level,\n        final_risk_rank,\n\
          \        final_evidence_count\n    )\n\n    recommendations = build_recommendations(\n\
          \        final_risk_level,\n        final_evidence_count\n    )\n\n    report_lines\
          \ = [\n        \"# 威胁情报查询结果（降级模式）\",\n        \"\",\n        \"## 1. 服务状态\"\
          ,\n        \"\",\n        evidence_status,\n        \"\",\n        (\n \
          \           \"本次异常发生在最终语言模型总结阶段，\"\n            \"常见原因包括模型服务暂时不可用、网络连接异常、\"\
          \n            \"请求超时或 DNS 域名解析失败。\"\n        ),\n        \"\",\n       \
          \ (\n            \"需要特别说明：语言模型调用失败不代表查询对象安全，\"\n            \"也不代表查询对象恶意。\"\
          \n        ),\n        \"\",\n        \"## 2. 查询信息\",\n        \"\",\n  \
          \      f\"- 用户问题：{query_text}\",\n        f\"- 总体风险等级：{final_risk_level}\"\
          ,\n        f\"- 总体风险分值：{final_risk_rank}\",\n        f\"- 有效证据数量：{final_evidence_count}\"\
          ,\n        \"\",\n        \"## 3. 基础风险研判\",\n        \"\",\n        risk_explanation,\n\
          \        \"\",\n        \"## 4. Evidence Bus 摘要\",\n        \"\",\n    \
          \    evidence_summary,\n        \"\",\n        \"## 5. IOC 对象列表\",\n   \
          \     \"\",\n        \"```json\",\n        formatted_ioc_list,\n       \
          \ \"```\",\n        \"\",\n        \"## 6. 处置建议\",\n        \"\",\n    \
          \    recommendations,\n        \"\",\n        \"## 7. 结论边界\",\n        \"\
          \",\n        (\n            \"本报告由代码兜底节点根据上游 Evidence Bus 自动生成，\"\n    \
          \        \"没有调用语言模型进行语义补充。\"\n        ),\n        \"\",\n        (\n   \
          \         \"报告不会补充上游证据中不存在的攻击组织、恶意家族、\"\n            \"漏洞利用方式、ATT&CK 技术编号或处置结论。\"\
          \n        ),\n        \"\",\n        (\n            \"如 Evidence Bus 中证据为空、字段缺失或查询工具异常，\"\
          \n            \"应将结论保持为“未知”，不得将“未查询到证据”解释为“确认安全”。\"\n        )\n    ]\n\n\
          \    fallback_answer = \"\\n\".join(report_lines).strip()\n\n    return\
          \ {\n        \"fallback_answer\": fallback_answer\n    }\n"
