          )),\n            \"context_risk_level\": item.get(\"context_risk_level\"\
          ),\n            \"context_risk_rank\": as_int(item.get(\"context_risk_rank\"\
          )),\n            \"final_risk_level\": item.get(\"final_risk_level\"),\n\
          \            \"final_risk_rank\": as_int(item.get(\"final_risk_rank\")),\n\
          \            \"evidence_count\": as_int(item.get(\"evidence_count\")),\n\
          \            \"risk_reason\": item.get(\"risk_reason\")\n        })\n\n\
          \    ioc_list = dedupe_list(ioc_list)\n\n    knowledge_retrieval_query =\
          \ build_knowledge_retrieval_query(\n        user_query=user_query,\n   \
          \     bundle_summaries=bundle_summaries,\n        overall=overall\n    )\n\
          \n    llm_evidence_context = build_llm_context(\n        bundle_summaries=bundle_summaries,\n\
