          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"杀毒引擎检测\",\n                details.get(\"antivirus_scan\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"文件信息\",\n                details.get(\"file_info\")\n\
          \            )\n            add_fact_line(\n                local,\n   \
          \             \"威胁上下文\",\n                details.get(\"threat_context\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"关联Hash\",\n                details.get(\"sample_hashes\"\
          )\n            )\n\n        elif ioc_type == \"cve\":\n            add_fact_line(\n\
          \                local,\n                \"漏洞描述\",\n                details.get(\"\
          description\"),\n                420\n            )\n            add_fact_line(\n\
          \                local,\n                \"CVSS评分\",\n                details.get(\"\
          cvss_score\")\n            )\n            add_fact_line(\n             \
          \   local,\n                \"严重等级\",\n                details.get(\"severity\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"公开日期\",\n                details.get(\"published_date\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"漏洞状态\",\n                details.get(\"vulnerability_status\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"CISA KEV\",\n                details.get(\"cisa_kev\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"CVSS向量\",\n                details.get(\"cvss_vector\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"CVSS向量摘要\",\n                details.get(\"cvss_vector_summary\"\
          )\n            )\n            add_fact_line(\n                local,\n \
          \               \"利用上下文\",\n                details.get(\"exploitation_context\"\
          )\n            )\n\n        add_fact_line(\n            local,\n       \
          \     \"其他结构化字段\",\n            details.get(\"additional_source_specific\"\
          )\n        )\n        add_fact_line(\n            local,\n            \"\
          其他紧凑字段\",\n            details.get(\"additional_raw_compact\")\n       \
          \ )\n\n        local.extend(\n            ensure_list(compact.get(\"key_findings\"\
          ))[:4]\n        )\n\n        # 每个来源独立限制，避免第一个工具来源占满全部摘要。\n        facts.extend(local[:16])\n\
          \n    facts.extend(\n        compact_findings(\n            summary.get(\"\
          key_findings\"),\n            max_items=5\n        )\n    )\n\n    return\
          \ dedupe_objects(facts)[:64]\n\n\n# ============================================================\n\
          # 8. 知识库检索查询生成\n# ============================================================\n\
          \ndef build_knowledge_query(\n    bundle_summaries: List[Dict[str, Any]],\n\
          \    evidence_items: List[Any],\n    single_query: Any,\n    multi_query:\
          \ Any\n) -> str:\n    \"\"\"\n    根据最终标准化对象重新生成紧凑知识检索词。\n\n    不再直接拼接旧查询中的完整杀毒引擎列表，\n\
          \    从而减少截断、延迟和无关检索。\n    \"\"\"\n    sections: List[str] = []\n\n    for\
          \ summary in bundle_summaries:\n        if not isinstance(summary, dict):\n\
          \            continue\n\n        ioc_type = normalize_ioc_type(\n      \
          \      summary.get(\"ioc_type\")\n        )\n        ioc = normalize_ioc_value(\n\
          \            ioc_type,\n            summary.get(\"ioc\")\n        )\n\n\
          \        if not ioc:\n            continue\n\n        lines = [\n      \
          \      f\"对象类型：{ioc_type}\",\n            f\"查询对象：{ioc}\",\n           \
          \ (\n                f\"主体风险：\"\n                f\"{summary.get('subject_risk_level',\
          \ '未知')}\"\n                f\"（{to_int(summary.get('subject_risk_rank'))}）\"\
          \n            ),\n            (\n                f\"上下文风险：\"\n         \
          \       f\"{summary.get('context_risk_level', '未知')}\"\n               \
          \ f\"（{to_int(summary.get('context_risk_rank'))}）\"\n            ),\n  \
          \          (\n                f\"最终风险：\"\n                f\"{summary.get('final_risk_level',\
          \ '未知')}\"\n                f\"（{to_int(summary.get('final_risk_rank'))}）\"\
          \n            ),\n            (\n                \"风险理由：\"\n           \
          \     + trim_text(\n                    summary.get(\"risk_reason\"),\n\
          \                    360\n                )\n            )\n        ]\n\n\
          \        facts = build_evidence_fact_lines(\n            summary,\n    \
          \        evidence_items\n        )\n\n        lines.extend(\n          \
          \  [f\"- {fact}\" for fact in facts[:10]]\n        )\n\n        sections.append(\"\
          \\n\".join(lines))\n\n    if not sections:\n        single_text = trim_text(single_query,\
          \ 1200)\n        multi_text = trim_text(multi_query, 1200)\n\n        if\
          \ single_text:\n            sections.append(\n                \"【单次分支摘要】\\\
          n\"\n                + single_text\n            )\n\n        if multi_text:\n\
          \            sections.append(\n                \"【批量分支摘要】\\n\"\n       \
          \         + multi_text\n            )\n\n    if not sections:\n        return\
          \ (\n            \"请检索与当前安全查询相关的 IOC 分析、\"\n            \"威胁情报、文件信誉、漏洞修复、\"\
          \n            \"ATT&CK/CWE 映射和应急响应知识。\"\n        )\n\n    query = (\n  \
          \      \"请针对以下标准化安全对象检索直接相关的威胁背景、\"\n        \"误报判断、日志核查方向、终端排查、漏洞修复和 SOC\
          \ 处置建议。\\n\"\n        \"知识库内容只能作为辅助背景，\"\n        \"不得覆盖或改写标准化工具证据。\\n\\\
          n\"\n        + \"\\n\\n\".join(sections)\n    )\n\n    return trim_text(query,\
          \ 6000)\n\n\n# ============================================================\n\
          # 9. 最终 LLM Evidence 上下文\n# ============================================================\n\
          \ndef build_llm_context(\n    ioc_list: List[Dict[str, Any]],\n    bundle_summaries:\
          \ List[Dict[str, Any]],\n    evidence_items: List[Any],\n    overall_level:\
          \ str,\n    overall_rank: int,\n    overall_reason: str,\n    evidence_count:\
          \ int,\n    type_counts: Dict[str, int],\n    single_has_evidence: bool,\n\
          \    multi_has_evidence: bool,\n    single_fallback_context: Any = \"\"\
          ,\n    multi_fallback_context: Any = \"\"\n) -> str:\n    \"\"\"\n    生成供最终研判\
          \ LLM 使用的统一证据摘要。\n\n    核心修复：\n    - 不再对整段摘要执行 14000 字符的尾部硬截断；\n    - 每个\
          \ IOC 都强制保留对象标识和风险控制字段；\n    - 剩余文本预算在所有 IOC 之间公平分配；\n    - 详细结构化证据由 f_llm_evidence_items_json\
          \ 单独提供；\n    - 确保 ioc_list 中存在的对象不会因摘要列表缺项而被遗漏。\n    \"\"\"\n    header_lines:\
          \ List[str] = []\n\n    header_lines.append(\"【单双 Evidence Bus 融合结果】\")\n\
          \n    header_lines.append(\n        f\"单次 IOC Evidence Bus 是否包含有效对象：\"\n\
          \        f\"{'是' if single_has_evidence else '否'}。\"\n    )\n\n    header_lines.append(\n\
          \        f\"批量 IOC Evidence Bus 是否包含有效对象：\"\n        f\"{'是' if multi_has_evidence\
          \ else '否'}。\"\n    )\n\n    header_lines.append(\n        f\"总体风险：{overall_level}；\"\
          \n        f\"总体风险分值：{overall_rank}；\"\n        f\"对象数量：{len(ioc_list)}；\"\
          \n        f\"有效证据数量：{evidence_count}。\"\n    )\n\n    header_lines.append(\n\
          \        \"总体判断依据：\"\n        + trim_text(overall_reason, 900)\n    )\n\n\
          \    header_lines.append(\n        \"对象类型统计：\"\n        f\"IP={type_counts.get('ip',\
          \ 0)}，\"\n        f\"Domain={type_counts.get('domain', 0)}，\"\n        f\"\
          URL={type_counts.get('url', 0)}，\"\n        f\"Hash={type_counts.get('hash',\
          \ 0)}，\"\n        f\"CVE={type_counts.get('cve', 0)}。\"\n    )\n\n    context_summaries:\
          \ List[Dict[str, Any]] = [\n        item\n        for item in bundle_summaries\n\
          \        if isinstance(item, dict)\n        and build_ioc_key(item)\n  \
          \  ]\n\n    existing_keys = {\n        build_ioc_key(item)\n        for\
          \ item in context_summaries\n    }\n\n    for item in ioc_list:\n      \
          \  if not isinstance(item, dict):\n            continue\n\n        key =\
          \ build_ioc_key(item)\n\n        if not key or key in existing_keys:\n \
          \           continue\n\n        context_summaries.append(item)\n       \
          \ existing_keys.add(key)\n\n    if not context_summaries:\n        header_lines.append(\n\
          \            \"当前没有包含完整风险字段的对象摘要。\"\n        )\n\n        fallback_contexts\
          \ = dedupe_objects([\n            trim_text(single_fallback_context, 1500),\n\
          \            trim_text(multi_fallback_context, 1500)\n        ])\n\n   \
          \     for context in fallback_contexts:\n            if context:\n     \
          \           header_lines.append(\n                    \"上游摘要补充：\"\n    \
          \                + context\n                )\n\n        return \"\\n\"\
          .join(header_lines)\n\n    header_lines.append(\"各对象融合摘要与关键证据：\")\n\n  \
          \  # 16000 是目标预算，不再作为整段文本的尾部截断点。\n    # 每个对象先保留必需字段，再公平使用剩余预算。\n    target_total_chars\
          \ = 16000\n    fixed_chars = len(\"\\n\".join(header_lines))\n    object_count\
          \ = max(len(context_summaries), 1)\n    available_chars = max(\n       \
          \ target_total_chars - fixed_chars,\n        object_count * 420\n    )\n\
          \    per_object_budget = max(\n        420,\n        min(\n            2200,\n\
          \            available_chars // object_count\n        )\n    )\n\n    object_blocks:\
          \ List[str] = []\n\n    for summary in context_summaries:\n        ioc_type\
          \ = normalize_ioc_type(\n            summary.get(\"ioc_type\")\n       \
          \ )\n        ioc = normalize_ioc_value(\n            ioc_type,\n       \
          \     summary.get(\"ioc\")\n        )\n\n        reason_budget = max(\n\
          \            120,\n            min(500, per_object_budget // 3)\n      \
          \  )\n\n        mandatory = (\n            f\"- 类型：{ioc_type}；\"\n     \
          \       f\"对象：{ioc}；\"\n            f\"主体风险：{summary.get('subject_risk_level',\
          \ '未知')}；\"\n            f\"主体风险分值：{to_int(summary.get('subject_risk_rank'))}；\"\
          \n            f\"上下文风险：{summary.get('context_risk_level', '未知')}；\"\n  \
          \          f\"上下文风险分值：{to_int(summary.get('context_risk_rank'))}；\"\n  \
          \          f\"最终风险：{summary.get('final_risk_level', '未知')}；\"\n        \
          \    f\"最终风险分值：{to_int(summary.get('final_risk_rank'))}；\"\n           \
          \ f\"证据数：{to_int(summary.get('evidence_count'))}；\"\n            f\"判断依据：\"\
          \n            f\"{trim_text(summary.get('risk_reason'), reason_budget)}\"\
          \n        )\n\n        block_lines = [mandatory]\n        used_chars = len(mandatory)\n\
          \n        facts = build_evidence_fact_lines(\n            summary,\n   \
          \         evidence_items\n        )\n\n        omitted_count = 0\n\n   \
          \     if facts:\n            facts_header = \"  关键证据：\"\n\n            if\
          \ (\n                used_chars\n                + len(facts_header)\n \
          \               + 1\n                <= per_object_budget\n            ):\n\
          \                block_lines.append(facts_header)\n                used_chars\
          \ += len(facts_header) + 1\n\n        for fact in facts:\n            line\
          \ = f\"  - {fact}\"\n\n            if (\n                used_chars\n  \
          \              + len(line)\n                + 1\n                > per_object_budget\n\
          \            ):\n                omitted_count += 1\n                continue\n\
          \n            block_lines.append(line)\n            used_chars += len(line)\
          \ + 1\n\n        conflict_notes = compact_findings(\n            summary.get(\"\
          conflict_notes\"),\n            max_items=4\n        )\n\n        for note\
          \ in conflict_notes:\n            line = (\n                \"  - 冲突或不确定性：\"\
          \n                + note\n            )\n\n            if (\n          \
          \      used_chars\n                + len(line)\n                + 1\n  \
          \              > per_object_budget\n            ):\n                omitted_count\
          \ += 1\n                continue\n\n            block_lines.append(line)\n\
          \            used_chars += len(line) + 1\n\n        if omitted_count > 0:\n\
          \            omitted_line = (\n                f\"  - 本对象另有 {omitted_count}\
          \ 条细节\"\n                \"未在文本摘要展开，请读取\"\n                \" f_llm_evidence_items_json。\"\
          \n            )\n            block_lines.append(omitted_line)\n\n      \
          \  object_blocks.append(\n            \"\\n\".join(block_lines)\n      \
          \  )\n\n    return \"\\n\".join(\n        header_lines\n        + object_blocks\n\
          \    )\n\n\n# ============================================================\n\
          # 10. Dify 主函数\n# ============================================================\n\
          \ndef main(\n    s_bundle_json: str = \"\",\n    s_knowledge_query: str\
          \ = \"\",\n    s_llm_context: str = \"\",\n    s_risk_rank: Any = 0,\n \
          \   s_evidence_count: Any = 0,\n    m_bundle_json: str = \"\",\n    m_knowledge_query:\
          \ str = \"\",\n    m_llm_context: str = \"\",\n    m_risk_rank: Any = 0,\n\
          \    m_evidence_count: Any = 0\n) -> Dict[str, Any]:\n    \"\"\"\n    合并单次\
          \ IOC Evidence Bus 和批量 IOC Evidence Bus。\n\n    输入变量名称保持不变。\n    原有输出变量名称保持不变，并新增\n\
          \    f_llm_evidence_items_json 供最终 LLM 使用。\n    \"\"\"\n    single_bus =\
          \ normalize_bus(s_bundle_json)\n    multi_bus = normalize_bus(m_bundle_json)\n\
          \n    # 合并 IOC 列表。\n    ioc_list = merge_ioc_records(\n        single_bus[\"\
          ioc_list\"]\n        + multi_bus[\"ioc_list\"]\n    )\n\n    # 合并原始摘要。\n\
          \    raw_bundle_summaries = merge_ioc_records(\n        single_bus[\"bundle_summaries\"\
          ]\n        + multi_bus[\"bundle_summaries\"]\n    )\n\n    # 合并完整证据包。\n\
          \    evidence_bundles = dedupe_objects(\n        single_bus[\"evidence_bundles\"\
          ]\n        + multi_bus[\"evidence_bundles\"]\n    )\n\n    # 合并全部证据项。\n\
          \    evidence_items = dedupe_objects(\n        single_bus[\"evidence_items\"\
          ]\n        + multi_bus[\"evidence_items\"]\n    )\n\n    # 生成最终 LLM 专用的结构化紧凑证据。\n\
          \    # 该变量完全由当前 evidence_items 动态转换生成。\n    llm_evidence_items = build_llm_evidence_items(\n\
          \        evidence_items\n    )\n\n    # 用详细证据补全对象摘要。\n    bundle_summaries\
          \ = enrich_bundle_summaries(\n        ioc_list=ioc_list,\n        bundle_summaries=raw_bundle_summaries,\n\
          \        evidence_items=evidence_items\n    )\n\n    # 如果 ioc_list 为空，但摘要存在，则从摘要恢复\
          \ IOC 列表。\n    if not ioc_list and bundle_summaries:\n        ioc_list =\
          \ merge_ioc_records([\n            {\n                \"ioc_type\": item.get(\"\
          ioc_type\"),\n                \"ioc\": item.get(\"ioc\"),\n            \
          \    \"final_risk_level\": item.get(\"final_risk_level\"),\n           \
          \     \"final_risk_rank\": item.get(\"final_risk_rank\"),\n            \
          \    \"evidence_count\": item.get(\"evidence_count\")\n            }\n \
          \           for item in bundle_summaries\n            if isinstance(item,\
          \ dict)\n        ])\n\n    # 将摘要中的最终风险同步回 ioc_list。\n    ioc_list = merge_ioc_records(\n\
          \        ioc_list\n        + [\n            {\n                \"ioc_type\"\
          : item.get(\"ioc_type\"),\n                \"ioc\": item.get(\"ioc\"),\n\
          \                \"final_risk_level\": item.get(\"final_risk_level\"),\n\
          \                \"final_risk_rank\": item.get(\"final_risk_rank\"),\n \
          \               \"evidence_count\": item.get(\"evidence_count\")\n     \
          \       }\n            for item in bundle_summaries\n            if isinstance(item,\
          \ dict)\n        ]\n    )\n\n    single_has_evidence = bool(\n        single_bus[\"\
          ioc_list\"]\n        or single_bus[\"bundle_summaries\"]\n        or [\n\
          \            item\n            for item in single_bus[\"evidence_items\"\
          ]\n            if isinstance(item, dict)\n            and item.get(\"query_success\"\
          )\n        ]\n    )\n\n    multi_has_evidence = bool(\n        multi_bus[\"\
          ioc_list\"]\n        or multi_bus[\"bundle_summaries\"]\n        or [\n\
          \            item\n            for item in multi_bus[\"evidence_items\"\
          ]\n            if isinstance(item, dict)\n            and item.get(\"query_success\"\
          )\n        ]\n    )\n\n    recommended_actions = dedupe_objects(\n     \
          \   single_bus[\"recommended_actions\"]\n        + multi_bus[\"recommended_actions\"\
          ]\n        + [\n            action\n            for summary in bundle_summaries\n\
          \            if isinstance(summary, dict)\n            for action in ensure_list(\n\
          \                summary.get(\"recommended_actions\")\n            )\n \
          \       ]\n    )\n\n    # 使用 bundle_summaries 计算总体风险。\n    risk_records\
          \ = (\n        bundle_summaries\n        if bundle_summaries\n        else\
          \ ioc_list\n    )\n\n    (\n        overall_rank,\n        overall_level,\n\
          \        highest_risk_iocs\n    ) = calculate_overall_risk(\n        risk_records=risk_records,\n\
          \        single_rank=s_risk_rank,\n        multi_rank=m_risk_rank\n    )\n\
          \n    overall_reason = build_overall_reason(\n        overall_rank=overall_rank,\n\
          \        highest_risk_iocs=highest_risk_iocs\n    )\n\n    type_counts =\
          \ build_type_counts(ioc_list)\n\n    evidence_count = calculate_evidence_count(\n\
          \        bundle_summaries=bundle_summaries,\n        evidence_items=evidence_items,\n\
          \        single_count=s_evidence_count,\n        multi_count=m_evidence_count\n\
          \    )\n\n    # 重新生成紧凑知识检索词。\n    knowledge_query = build_knowledge_query(\n\
          \        bundle_summaries=bundle_summaries,\n        evidence_items=evidence_items,\n\
          \        single_query=s_knowledge_query,\n        multi_query=m_knowledge_query\n\
          \    )\n\n    # 关键修复：使用 bundle_summaries 生成最终 LLM 摘要。\n    llm_context =\
          \ build_llm_context(\n        ioc_list=ioc_list,\n        bundle_summaries=bundle_summaries,\n\
          \        evidence_items=evidence_items,\n        overall_level=overall_level,\n\
          \        overall_rank=overall_rank,\n        overall_reason=overall_reason,\n\
          \        evidence_count=evidence_count,\n        type_counts=type_counts,\n\
          \        single_has_evidence=single_has_evidence,\n        multi_has_evidence=multi_has_evidence,\n\
          \        single_fallback_context=s_llm_context,\n        multi_fallback_context=m_llm_context\n\
          \    )\n\n    final_bundle = {\n        \"bundle_type\": \"combined_single_multi_evidence_bus\"\
          ,\n        \"version\": \"v1.1-final-evidence-bus\",\n        \"design_note\"\
          : (\n            \"该证据包由单次 IOC 查询 Evidence Bus \"\n            \"和批量 IOC\
          \ 查询 Evidence Bus 合并生成。\"\n            \"空 Evidence Bus 只用于保证变量稳定存在，\"\n\
          \            \"不会覆盖另一条分支中的有效证据。\"\n            \"最终 LLM 摘要使用包含主体风险、上下文风险、\"\
          \n            \"证据数量和风险理由的 bundle_summaries 生成，\"\n            \"并从 evidence_items\
          \ 中提取紧凑关键事实。\"\n        ),\n        \"source_bus_status\": {\n         \
          \   \"single_bus_has_evidence\": single_has_evidence,\n            \"multi_bus_has_evidence\"\
          : multi_has_evidence\n        },\n        \"overall_fusion_result\": {\n\
          \            \"overall_risk_level\": overall_level,\n            \"overall_risk_rank\"\
          : overall_rank,\n            \"overall_reason\": overall_reason,\n     \
          \       \"highest_risk_iocs\": highest_risk_iocs,\n            \"ioc_count\"\
          : len(ioc_list),\n            \"evidence_count\": evidence_count,\n    \
          \        \"type_counts\": type_counts\n        },\n        \"ioc_list\"\
          : ioc_list,\n        \"bundle_summaries\": bundle_summaries,\n        \"\
          evidence_bundles\": evidence_bundles,\n        \"all_evidence_items\": evidence_items,\n\
          \        \"recommended_actions\": recommended_actions,\n        \"knowledge_retrieval_query\"\
          : knowledge_query\n    }\n\n    # 保留全部原有输出变量，并新增 LLM 专用证据变量。\n    return\
          \ {\n        \"f_unified_risk_level\": overall_level,\n        \"f_knowledge_retrieval_query\"\
          : knowledge_query,\n        \"f_unified_ioc_list_json\": json.dumps(\n \
          \           ioc_list,\n            ensure_ascii=False,\n            indent=2\n\
          \        ),\n        \"f_unified_risk_rank\": overall_rank,\n        \"\
          f_unified_evidence_bundle_json\": json.dumps(\n            final_bundle,\n\
          \            ensure_ascii=False,\n            indent=2\n        ),\n   \
          \     \"f_unified_evidence_count\": evidence_count,\n        \"f_llm_evidence_context\"\
          : llm_context,\n        \"f_unified_evidence_items_json\": json.dumps(\n\
          \            evidence_items,\n            ensure_ascii=False,\n        \
