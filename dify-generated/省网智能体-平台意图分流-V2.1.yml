    - data:
        code: "import json\nimport re\nfrom typing import Any\n\n\ndef parse_json(value:\
          \ Any) -> Any:\n    if value is None:\n        return None\n    if isinstance(value,\
          \ (dict, list)):\n        return value\n    if not isinstance(value, str):\n\
          \        return value\n\n    text = value.strip()\n    if not text:\n  \
          \      return None\n\n    text = re.sub(r\"^```json\\s*\", \"\", text, flags=re.IGNORECASE)\n\
          \    text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\"\
          , \"\", text)\n\n    for _ in range(3):\n        try:\n            obj =\
          \ json.loads(text)\n            if isinstance(obj, str):\n             \
          \   text = obj.strip()\n                continue\n            return obj\n\
          \        except Exception:\n            break\n\n    start = text.find(\"\
          {\")\n    end = text.rfind(\"}\")\n    if start >= 0 and end > start:\n\
          \        try:\n            return json.loads(text[start:end + 1])\n    \
          \    except Exception:\n            pass\n\n    return {\"raw\": text}\n\
          \n\ndef ensure_list(value: Any) -> list:\n    obj = parse_json(value)\n\
          \    if obj is None:\n        return []\n    if isinstance(obj, list):\n\
          \        return obj\n    return [obj]\n\n\ndef collect_indicators(items:\
          \ list) -> dict:\n    result = {\n        \"ips\": [],\n        \"domains\"\
          : [],\n        \"urls\": [],\n        \"hashes\": [],\n        \"cves\"\
          : [],\n    }\n\n    for item in items:\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        indicators = item.get(\"security_indicators\"\
          ) or {}\n        if not isinstance(indicators, dict):\n            continue\n\
          \n        for key in result:\n            vals = indicators.get(key) or\
          \ []\n            if isinstance(vals, list):\n                result[key].extend([str(x)\
          \ for x in vals if x])\n\n    for key in result:\n        result[key] =\
          \ list(dict.fromkeys(result[key]))\n\n    return result\n\n\ndef short_text(text:\
          \ str, max_len: int = 800) -> str:\n    text = str(text or \"\").strip()\n\
          \    if len(text) <= max_len:\n        return text\n    return text[:max_len]\
          \ + \"...\"\n\n\ndef main(\n    file_type_summary: str = \"\",\n    file_inventory_json:\
          \ str = \"\",\n    iteration_outputs: Any = None,\n    **kwargs\n) -> dict:\n\
          \    raw_items = ensure_list(iteration_outputs)\n\n    normalized_items\
          \ = []\n    for x in raw_items:\n        obj = parse_json(x)\n        if\
          \ isinstance(obj, dict):\n            normalized_items.append(obj)\n\n \
          \   image_items = [x for x in normalized_items if x.get(\"file_type\") ==\
          \ \"image\"]\n    document_items = [x for x in normalized_items if x.get(\"\
          file_type\") == \"document\"]\n    unsupported_items = [x for x in normalized_items\
          \ if x.get(\"file_type\") == \"unsupported\"]\n\n    extracted = collect_indicators(normalized_items)\n\
          \n    context = {\n        \"bundle_type\": \"multimodal_context_bundle\"\
          ,\n        \"version\": \"v0.1\",\n        \"file_type_summary\": file_type_summary,\n\
          \        \"file_inventory\": parse_json(file_inventory_json) or [],\n  \
          \      \"file_results\": normalized_items,\n        \"extracted_security_indicators\"\
          : extracted,\n        \"counts\": {\n            \"file_count\": len(normalized_items),\n\
          \            \"image_summary_count\": len(image_items),\n            \"\
          document_summary_count\": len(document_items),\n            \"unsupported_count\"\
          : len(unsupported_items),\n        },\n        \"note\": \"该上下文由上传文件经图片分析、文本提取和文档摘要后生成，供后续安全\
          \ IOC 路由与证据融合使用。\"\n    }\n\n    lines = []\n    lines.append(file_type_summary)\n\
          \n    if image_items:\n        lines.append(\"\\n【图片分析摘要】\")\n        for\
          \ item in image_items:\n            lines.append(f\"- {item.get('filename',\
          \ '')}：{short_text(item.get('summary', ''))}\")\n            if item.get(\"\
          visible_text\"):\n                lines.append(f\"  可见文字：{short_text(item.get('visible_text',\
          \ ''), 300)}\")\n            if item.get(\"risk_clues\"):\n            \
          \    lines.append(f\"  风险线索：{item.get('risk_clues')}\")\n\n    if document_items:\n\
          \        lines.append(\"\\n【文档分析摘要】\")\n        for item in document_items:\n\
          \            lines.append(f\"- {item.get('filename', '')}：{short_text(item.get('summary',\
          \ ''))}\")\n            if item.get(\"key_security_findings\"):\n      \
          \          lines.append(f\"  关键发现：{item.get('key_security_findings')}\"\
          )\n            if item.get(\"risk_clues\"):\n                lines.append(f\"\
          \  风险线索：{item.get('risk_clues')}\")\n\n    if unsupported_items:\n     \
          \   lines.append(\"\\n【未支持文件】\")\n        for item in unsupported_items:\n\
          \            lines.append(f\"- {item.get('filename', '')}：{item.get('summary',\
          \ '')}\")\n\n    lines.append(\"\\n【从文件中提取的安全指标】\")\n    lines.append(json.dumps(extracted,\
          \ ensure_ascii=False, indent=2))\n\n    return {\n        \"multimodal_context_json\"\
          : json.dumps(context, ensure_ascii=False, indent=2),\n        \"multimodal_context_text\"\
          : \"\\n\".join(lines),\n        \"file_count\": len(normalized_items),\n\
          \        \"image_summary_count\": len(image_items),\n        \"document_summary_count\"\
          : len(document_items),\n        \"extracted_ioc_summary_json\": json.dumps(extracted,\
          \ ensure_ascii=False, indent=2),\n    }"
