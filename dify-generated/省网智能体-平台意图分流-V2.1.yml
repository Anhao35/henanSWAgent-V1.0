          \       \"CISA KEV说明\",\n        \"kev_note\",\n        \"kev_description\"\
          ,\n        \"required_action\",\n    ])\n    known_exploited = find_first_value(data,\
          \ [\n        \"是否在野利用\",\n        \"是否已被利用\",\n        \"known_exploited\"\
          ,\n        \"exploited_in_the_wild\",\n        \"in_the_wild\",\n      \
          \  \"active_exploitation\",\n    ])\n    poc_available = find_first_value(data,\
          \ [\n        \"是否存在PoC\",\n        \"poc_available\",\n        \"has_poc\"\
          ,\n        \"public_poc\",\n        \"exploit_available\",\n    ])\n   \
          \ epss_score = find_first_value(data, [\n        \"EPSS\",\n        \"epss_score\"\
          ,\n        \"epss\",\n    ])\n\n    context_rank = 0\n    findings = []\n\
          \n    is_kev = is_yes(kev_value)\n    known_exploited_bool = normalize_boolean_signal(known_exploited)\n\
          \    poc_bool = normalize_boolean_signal(poc_available)\n    epss_value\
          \ = as_float_or_none(epss_score)\n\n    if is_kev:\n        context_rank\
          \ = max(context_rank, 5)\n        findings.append(\"该漏洞已列入 CISA KEV，存在已知被利用事实，应优先处置。\"\
          )\n    elif kev_value not in [None, \"\"]:\n        findings.append(\"当前工具结果显示该漏洞未列入\
          \ CISA KEV。\")\n\n    if known_exploited_bool is True:\n        context_rank\
          \ = max(context_rank, 5)\n        findings.append(\"工具结果显示该漏洞存在在野利用或已知被利用信号。\"\
          )\n    elif known_exploited_bool is False:\n        findings.append(\"当前工具结果未显示明确在野利用信号。\"\
          )\n\n    if poc_bool is True:\n        context_rank = max(context_rank,\
          \ 4)\n        findings.append(\"工具结果显示存在公开 PoC 或可用利用代码。\")\n    elif poc_bool\
          \ is False:\n        findings.append(\"当前工具结果未显示公开 PoC。\")\n\n    if epss_value\
          \ is not None:\n        if epss_value <= 1:\n            epss_ratio = epss_value\n\
