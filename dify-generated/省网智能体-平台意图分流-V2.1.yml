          \            return text\n\n    return text\n\n\ndef extract_payload(raw:\
          \ Any) -> Any:\n    \"\"\"\n    从工具输出中提取真正有效的业务数据。\n    兼容：\n    - {\"result\"\
          : \"...\"}\n    - {\"text\": \"...\"}\n    - {\"json\": [{\"result\": \"\
          ...\"}]}\n    - {\"data\": {...}}\n    - {\"answer\": \"...\"}\n    \"\"\
          \"\n    obj = try_json_loads(raw)\n\n    if obj is None:\n        return\
          \ None\n\n    if isinstance(obj, list):\n        if len(obj) == 0:\n   \
          \         return None\n        if len(obj) == 1:\n            return extract_payload(obj[0])\n\
          \        return [extract_payload(x) for x in obj]\n\n    if isinstance(obj,\
          \ dict):\n        # 优先取 result，因为你的 VT 和安恒工具常把业务 JSON 放在 result 字符串里\n \
          \       for key in [\"result\", \"text1\", \"answer\", \"text\", \"json\"\
          , \"data\"]:\n            if key in obj and obj.get(key) not in [None, \"\
          \", []]:\n                return extract_payload(obj.get(key))\n\n     \
          \   return obj\n\n    return obj\n\n\ndef as_int(value: Any, default: int\
          \ = 0) -> int:\n    try:\n        if value is None or value == \"\":\n \
          \           return default\n        return int(float(value))\n    except\
          \ Exception:\n        return default\n\n\ndef safe_get(d: Any, path: list,\
          \ default=None):\n    cur = d\n    for key in path:\n        if not isinstance(cur,\
          \ dict):\n            return default\n        cur = cur.get(key)\n     \
          \   if cur is None:\n            return default\n    return cur\n\n\ndef\
